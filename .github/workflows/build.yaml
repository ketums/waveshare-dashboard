name: ESPHome Build .bin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build ESPHome Binary
        uses: esphome/build-action@v2
        with:
          yaml_file: waveshare-dashboard.yaml
          version: latest

      - name: Upload .bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .esphome/build/waveshare-dashboard/.pioenvs/waveshare-dashboard/firmware.bin
