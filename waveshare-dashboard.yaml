esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

  on_boot:
    priority: -10
    then:
      - delay: 10s
      - script.execute: pobierz_pogode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"
  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: temp_pogody
    type: float
    restore_value: no
    initial_value: '0'

  - id: wilg_pogody
    type: int
    restore_value: no
    initial_value: '0'

  - id: wiatr_pogody
    type: float
    restore_value: no
    initial_value: '0'

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_ok
    type: bool
    restore_value: no
    initial_value: 'false'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  id: klient_http
  timeout: 15s
  useragent: "ESPHome Waveshare"

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"
    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

script:
  - id: pobierz_pogode
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6059&longitude=18.2356&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    id(pogoda_ok) = false;
                    ESP_LOGE("POGODA", "HTTP %d", response->status_code);
                    return;
                  }

                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["current"]) {
                      return false;
                    }

                    JsonObject c = root["current"];

                    id(temp_pogody) =
                      c["temperature_2m"].as<float>();

                    id(wilg_pogody) =
                      c["relative_humidity_2m"].as<int>();

                    id(wiatr_pogody) =
                      c["wind_speed_10m"].as<float>();

                    id(kod_pogody) =
                      c["weather_code"].as<int>();

                    id(pogoda_ok) = true;

                    ESP_LOGI(
                      "POGODA",
                      "Temp %.1f C, wilg %d%%, wiatr %.1f km/h, kod %d",
                      id(temp_pogody),
                      id(wilg_pogody),
                      id(wiatr_pogody),
                      id(kod_pogody)
                    );

                    return true;
                  });

interval:
  - interval: 10min
    then:
      - script.execute: pobierz_pogode

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran_waveshare
    rotation: 0
    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-
      auto now = id(czas_sntp).now();

      it.fill(Color(18, 24, 38));

      it.rectangle(
        10, 10, 780, 460,
        Color(45, 55, 72)
      );

      it.print(
        25, 20,
        id(font_srednia),
        Color(220, 225, 235),
        TextAlign::TOP_LEFT,
        "DASHBOARD"
      );

      if (id(wifi_ssid).has_state()) {
        it.print(
          250, 20,
          id(font_mala),
          Color(80, 210, 130),
          TextAlign::TOP_LEFT,
          "WIFI OK"
        );
      }

      if (id(wifi_sila).has_state()) {
        it.printf(
          330, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_LEFT,
          "%.0f dBm",
          id(wifi_sila).state
        );
      }

      if (now.is_valid()) {
        it.strftime(
          760, 20,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%H:%M",
          now
        );
      }

      it.line(
        10, 70, 790, 70,
        Color(45, 55, 72)
      );

      if (id(aktualna_strona) == 0) {

        it.print(
          400, 95,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "DASHBOARD"
        );

        it.print(
          400, 155,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_CENTER,
          "ROLETY  |  KLIMATYZACJA"
        );

        it.rectangle(
          50, 230, 200, 80,
          Color(66, 153, 225)
        );

        it.print(
          150, 250,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "OTWÓRZ"
        );

        it.rectangle(
          300, 230, 200, 80,
          Color(229, 62, 62)
        );

        it.print(
          400, 250,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STOP"
        );

        it.rectangle(
          550, 230, 200, 80,
          Color(66, 153, 225)
        );

        it.print(
          650, 250,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ZAMKNIJ"
        );

        it.print(
          400, 370,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "DOTKNIJ GORNEGO PASKA"
        );

        it.print(
          400, 405,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_CENTER,
          "STRONA 1/3"
        );

      } else if (id(aktualna_strona) == 1) {

        it.print(
          400, 110,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "DRUGI KAFEL"
        );

        it.print(
          400, 190,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "Miejsce na kolejne funkcje"
        );

        it.print(
          400, 405,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_CENTER,
          "STRONA 2/3"
        );

      } else {

        it.print(
          400, 85,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_CENTER,
          "POGODA - WEJHEROWO"
        );

        if (id(pogoda_ok)) {

          it.printf(
            210, 135,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_CENTER,
            "%.1f °C",
            id(temp_pogody)
          );

          it.printf(
            210, 205,
            id(font_srednia),
            Color(160, 200, 230),
            TextAlign::TOP_CENTER,
            "Wilgotność %d%%",
            id(wilg_pogody)
          );

          it.printf(
            210, 245,
            id(font_mala),
            Color(160, 174, 192),
            TextAlign::TOP_CENTER,
            "Wiatr %.1f km/h",
            id(wiatr_pogody)
          );

          if (id(kod_pogody) == 0) {
            it.filled_circle(
              600, 175, 45,
              Color(255, 205, 50)
            );

            it.print(
              600, 235,
              id(font_mala),
              Color(255, 220, 100),
              TextAlign::TOP_CENTER,
              "BEZCHMURNIE"
            );

          } else if (
            id(kod_pogody) >= 1 &&
            id(kod_pogody) <= 3
          ) {

            it.filled_circle(
              570, 165, 35,
              Color(255, 205, 50)
            );

            it.filled_circle(
              620, 180, 38,
              Color(170, 190, 215)
            );

            it.filled_rectangle(
              570, 180, 100, 35,
              Color(160, 180, 205)
            );

            it.print(
              620, 235,
              id(font_mala),
              Color(190, 205, 225),
              TextAlign::TOP_CENTER,
              "ZACHMURZENIE"
            );

          } else if (
            id(kod_pogody) >= 51 &&
            id(kod_pogody) <= 67
          ) {

            it.filled_circle(
              610, 165, 42,
              Color(150, 170, 195)
            );

            it.filled_rectangle(
              555, 175, 110, 35,
              Color(150, 170, 195)
            );

            for (int i = 0; i < 6; i++) {
              int x = 560 + i * 20;

              it.line(
                x, 220,
                x - 5, 240,
                Color(50, 170, 240)
              );
            }

            it.print(
              610, 250,
              id(font_mala),
              Color(70, 180, 240),
              TextAlign::TOP_CENTER,
              "DESZCZ"
            );

          } else {

            it.filled_circle(
              610, 175, 42,
              Color(145, 165, 190)
            );

            it.print(
              610, 235,
              id(font_mala),
              Color(190, 205, 220),
              TextAlign::TOP_CENTER,
              "POGODA"
            );
          }

        } else {

          it.print(
            400, 170,
            id(font_srednia),
            Color(220, 225, 235),
            TextAlign::TOP_CENTER,
            "POBIERANIE POGODY..."
          );

          it.print(
            400, 220,
            id(font_mala),
            Color(150, 170, 195),
            TextAlign::TOP_CENTER,
            "Czekam na internet"
          );
        }

        it.print(
          400, 405,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_CENTER,
          "STRONA 3/3"
        );
      }

touchscreen:
  - platform: gt911
    id: panel_dotykowy
    i2c_id: bus_i2c
    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          int x = touch.x;
          int y = touch.y;

          ESP_LOGI(
            "TOUCH",
            "X=%d Y=%d",
            x,
            y
          );

          if (y <= 70) {
            id(aktualna_strona) =
              (id(aktualna_strona) + 1) % 3;
          }