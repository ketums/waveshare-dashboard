touchscreen:
  - platform: gt911
    id: panel_dotykowy
    i2c_id: bus_i2c

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          int x = touch.x;
          int y = touch.y;

          ESP_LOGI(
            "TOUCH",
            "Dotyk X=%d Y=%d",
            x,
            y
          );

          // =====================================================
          // STRONA 3 - POWRÓT
          // =====================================================

          if (id(aktualna_strona) == 2) {

            id(aktualna_strona) = 0;

            ESP_LOGI(
              "TOUCH",
              "Powrót ze strony 3 na stronę 1"
            );

            return;
          }

          // =====================================================
          // GÓRNY PASEK - PRZEŁĄCZANIE STRON
          // =====================================================

          if (y >= 0 && y <= 70) {

            id(aktualna_strona) =
              (id(aktualna_strona) + 1) % 3;

            ESP_LOGI(
              "TOUCH",
              "Przełączono stronę na indeks: %d",
              id(aktualna_strona)
            );

            return;
          }

          // =====================================================
          // STRONA 1 - PRZYCISKI
          // =====================================================

          if (id(aktualna_strona) == 0) {

            // ROLETY

            if (y >= 190 && y <= 238) {

              if (x >= 28 && x <= 128) {

                ESP_LOGI(
                  "TOUCH",
                  "OTWÓRZ OKNA"
                );

              }

              else if (x >= 143 && x <= 243) {

                ESP_LOGI(
                  "TOUCH",
                  "STOP ROLETY"
                );

              }

              else if (x >= 258 && x <= 358) {

                ESP_LOGI(
                  "TOUCH",
                  "ZAMKNIJ OKNA"
                );
              }
            }

            // KLIMATYZACJA -

            if (
              x >= 425 &&
              x <= 483 &&
              y >= 190 &&
              y <= 238
            ) {

              ESP_LOGI(
                "TOUCH",
                "KLIMATYZACJA TEMP -"
              );
            }

            // KLIMATYZACJA +

            if (
              x >= 700 &&
              x <= 758 &&
              y >= 190 &&
              y <= 238
            ) {

              ESP_LOGI(
                "TOUCH",
                "KLIMATYZACJA TEMP +"
              );
            }

            // OGRZEWANIE

            if (
              x >= 408 &&
              x <= 786 &&
              y >= 272 &&
              y <= 462
            ) {

              ESP_LOGI(
                "TOUCH",
                "Naciśnięto OGRZEWANIE"
              );
            }
          }

          // =====================================================
          // STRONA 2
          // =====================================================

          else if (id(aktualna_strona) == 1) {

            ESP_LOGI(
              "TOUCH",
              "Dotyk na stronie 2"
            );
          }

      # KONIEC LAMBDA