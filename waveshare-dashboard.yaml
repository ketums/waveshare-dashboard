esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

  on_boot:
    priority: -100
    then:
      - delay: 10s
      - script.execute: pobierz_pogode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_temperatura
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_dane_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: pogoda_opis
    type: std::string
    restore_value: no
    initial_value: '"Pobieranie danych..."'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  timeout: 15s

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"
    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_zegar
    size: 64
    glyphs: "0123456789:"

image:
  - file: "weather_partly_cloudy.png"
    id: ikona_pogoda_duza
    type: RGB565
    transparency: alpha_channel

  - file: "weather_partly_cloudy_small.png"
    id: ikona_pogoda_mala
    type: RGB565
    transparency: alpha_channel

script:
  - id: pobierz_pogode
    mode: restart
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60167&longitude=18.23833&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=kmh&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          if (!root["current"]) {
                            return false;
                          }

                          JsonObject current = root["current"];

                          if (!current["temperature_2m"]) {
                            return false;
                          }

                          if (!current["relative_humidity_2m"]) {
                            return false;
                          }

                          if (!current["wind_speed_10m"]) {
                            return false;
                          }

                          id(pogoda_temperatura) =
                            current["temperature_2m"].as<float>();

                          id(pogoda_wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(pogoda_wiatr) =
                            current["wind_speed_10m"].as<float>();

                          int kod = current["weather_code"].as<int>();

                          if (kod == 0) {
                            id(pogoda_opis) = "Bezchmurnie";
                          } else if (kod == 1 || kod == 2) {
                            id(pogoda_opis) = "Czesciowe zachmurzenie";
                          } else if (kod == 3) {
                            id(pogoda_opis) = "Pochmurno";
                          } else if (kod == 45 || kod == 48) {
                            id(pogoda_opis) = "Mgla";
                          } else if (kod >= 51 && kod <= 67) {
                            id(pogoda_opis) = "Deszcz";
                          } else if (kod >= 71 && kod <= 77) {
                            id(pogoda_opis) = "Snieg";
                          } else if (kod >= 80 && kod <= 82) {
                            id(pogoda_opis) = "Przelotny deszcz";
                          } else if (kod >= 85 && kod <= 86) {
                            id(pogoda_opis) = "Przelotny snieg";
                          } else if (kod >= 95) {
                            id(pogoda_opis) = "Burza";
                          } else {
                            id(pogoda_opis) = "Nieznana pogoda";
                          }

                          id(pogoda_dane_ok) = true;

                          ESP_LOGI(
                            "POGODA",
                            "TEMP %.1f C | WILG %.0f %% | WIATR %.1f km/h",
                            id(pogoda_temperatura),
                            id(pogoda_wilgotnosc),
                            id(pogoda_wiatr)
                          );

                          return true;
                        });

                  else:
                    - lambda: |-
                        id(pogoda_dane_ok) = false;
                        ESP_LOGE(
                          "POGODA",
                          "HTTP ERROR %d",
                          response->status_code
                        );

          on_error:
            then:
              - lambda: |-
                  id(pogoda_dane_ok) = false;
                  ESP_LOGE("POGODA", "Blad polaczenia");

interval:
  - interval: 10min
    then:
      - script.execute: pobierz_pogode

