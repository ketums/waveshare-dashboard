
esphome:
  name: waveshare-dashboard
  friendly_name: Waveshare Dashboard

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: "WPISZ_NAZWE_WIFI"
  password: "WPISZ_HASLO_WIFI"

api:

ota:
  - platform: esphome

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz
  id: bus_i2c

# Sterownik CH422G
ch422g:
  - id: io_ex

# Podświetlenie ekranu przez CH422G
switch:
  - platform: gpio
    name: "Podświetlenie ekranu"
    id: podswietlenie
    pin:
      ch422g: io_ex
      number: 2
      mode:
        output: true
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: ekran
    update_interval: 1s
    auto_clear_enabled: true
    color_order: RGB

    dimensions:
      width: 800
      height: 480

    pclk_frequency: 16MHz

    de_pin:
      number: GPIO5

    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true

    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    pclk_pin: GPIO7

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30

    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4

    data_pins:
      red:
        - GPIO1
        - GPIO2
        - GPIO42
        - GPIO41
        - GPIO40

      green:
        - GPIO39
        - GPIO0
        - GPIO45
        - GPIO48
        - GPIO47
        - GPIO21

      blue:
        - GPIO14
        - GPIO38
        - GPIO18
        - GPIO17
        - GPIO10

    lambda: |-
      it.fill(Color(0, 0, 0));

      it.filled_rectangle(0, 0, 800, 480,
                          Color(5, 12, 35));

      it.rectangle(5, 5, 790, 470,
                   Color(0, 220, 255));

      it.print(400, 90, id(font_test),
               Color(255, 255, 255),
               TextAlign::CENTER, "WAVESHARE");

      it.print(400, 165, id(font_test),
               Color(0, 220, 255),
               TextAlign::CENTER, "ESP32-S3");

      it.print(400, 245, id(font_test),
               Color(255, 220, 0),
               TextAlign::CENTER, "800 x 480");

      it.print(400, 315, id(font_test),
               Color(255, 255, 255),
               TextAlign::CENTER, "TEST EKRANU");

      if (id(czas).now().is_valid()) {
        it.strftime(400, 405, id(font_small),
                    Color(0, 255, 200),
                    TextAlign::CENTER,
                    "%H:%M:%S",
                    id(czas).now());
      } else {
        it.print(400, 405, id(font_small),
                 Color(255, 255, 255),
                 TextAlign::CENTER, "LACZENIE Z CZASEM");
      }

font:
  - file: "gfonts://Roboto"
    id: font_test
    size: 42
    glyphsets:
      - GF_Latin_Core

  - file: "gfonts://Roboto"
    id: font_small
    size: 28
    glyphsets:
      - GF_Latin_Core
