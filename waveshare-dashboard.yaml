touchscreen:

  - platform: gt911

    id: ekran_dotykowy

    display: ekran

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

    on_touch:
      then:

        - lambda: |-
            int x = touch.x;
            int y = touch.y;

            if (x < 267) {
              id(aktualna_strona) = 0;
            } else if (x < 534) {
              id(aktualna_strona) = 1;
            } else {
              id(aktualna_strona) = 2;
            }

            ESP_LOGI(
              "touch",
              "Dotyk X=%d Y=%d -> strona %d",
              x,
              y,
              id(aktualna_strona)
            );