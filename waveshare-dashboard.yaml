esphome:
  name: esp32-s3-display
  friendly_name: ESP32-S3 Panel Pogodowy

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESP32-S3 Fallback Hotspot"
    password: "fallbackpassword"

captive_portal:

# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: time_now
    servers:
      - "pl.pool.ntp.org"
    timezone: Europe/Warsaw

# ============================================================
# INTERNET / OPEN-METEO
# ============================================================

http_request:
  useragent: "ESPHome-Waveshare-Weather"
  timeout: 10s

# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub

# ============================================================
# I2C - GT911
# ============================================================

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

# ============================================================
# ZMIENNE
# ============================================================

globals:

  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '2'

  - id: weather_code
    type: int
    restore_value: no
    initial_value: '0'

  - id: animacja
    type: int
    restore_value: no
    initial_value: '0'

# ============================================================
# CZUJNIKI POGODY
# ============================================================

sensor:

  - platform: template
    name: "Temperatura zewnętrzna"
    id: weather_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "Kod pogody WMO"
    id: weather_wmo
    accuracy_decimals: 0

    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              id(weather_code) = (int)x;
            }

  - platform: template
    name: "Wilgotność"
    id: weather_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    name: "Prędkość wiatru"
    id: weather_wind
    unit_of_measurement: "km/h"
    accuracy_decimals: 1

  - platform: template
    name: "Zachmurzenie"
    id: weather_cloud
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: wifi_signal
    name: "Siła WiFi"
    id: wifi_signal_db
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

# ============================================================
# WI-FI
# ============================================================

text_sensor:

  - platform: wifi_info

    ip_address:
      name: "Adres IP panelu"
      id: wifi_ip

    ssid:
      name: "Sieć WiFi"
      id: wifi_ssid

# ============================================================
# POBIERANIE AKTUALNEJ POGODY
# WEJHEROWO
# ============================================================

interval:

  - interval: 10min

    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60&longitude=18.25&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m"

          on_response:

            then:

              - lambda: |-

                  json::parse_json(response->body, [](JsonObject root) {

                    JsonObject current = root["current"];

                    if (!current.isNull()) {

                      float temp =
                        current["temperature_2m"].as<float>();

                      float humidity =
                        current["relative_humidity_2m"].as<float>();

                      float wind =
                        current["wind_speed_10m"].as<float>();

                      float cloud =
                        current["cloud_cover"].as<float>();

                      int code =
                        current["weather_code"].as<int>();

                      id(weather_temp).publish_state(temp);
                      id(weather_humidity).publish_state(humidity);
                      id(weather_wind).publish_state(wind);
                      id(weather_cloud).publish_state(cloud);
                      id(weather_wmo).publish_state(code);

                    }

                  });

# ============================================================
# ANIMACJA
# ============================================================

interval:

  - interval: 80ms

    then:

      - lambda: |-

          id(animacja)++;

          if (id(animacja) > 1000) {
            id(animacja) = 0;
          }

# ============================================================
# CZCIONKI
# ============================================================

font:

  - file: "Roboto-Regular.ttf"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "Roboto-Regular.ttf"
    id: font_srednia
    size: 24
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "Roboto-Regular.ttf"
    id: font_duza
    size: 58
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "Roboto-Regular.ttf"
    id: font_ogromna
    size: 92
    glyphs: "0123456789-+.°C"

# ============================================================
# WYŚWIETLACZ
# WAVESHARE ESP32-S3 TOUCH LCD 4.3
# 800 x 480
# ============================================================

display:

  - platform: mipi_rgb

    model: ESP32-S3-TOUCH-LCD-4.3

    id: my_display

    rotation: 0

    update_interval: 80ms

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    enable_pin:
      ch422g: ch422g_hub
      number: 2

    color_order: RGB

    lambda: |-

      // ======================================================
      // KARTA 3 - PEŁNOEKRANOWA POGODA
      // ======================================================

      if (id(aktualna_strona) == 2) {

        // ----------------------------------------------------
        // TŁO
        // ----------------------------------------------------

        it.fill(Color(18, 28, 48));

        // ----------------------------------------------------
        // GÓRNA CZĘŚĆ NIEBA
        // ----------------------------------------------------

        it.filled_rectangle(
          0,
          0,
          800,
          260,
          Color(25, 70, 115)
        );

        // ----------------------------------------------------
        // DOLNA CZĘŚĆ
        // ----------------------------------------------------

        it.filled_rectangle(
          0,
          260,
          800,
          220,
          Color(18, 28, 48)
        );

        // ====================================================
        // ANIMOWANE SŁOŃCE
        // ====================================================

        if (id(weather_code) == 0 ||
            id(weather_code) == 1 ||
            id(weather_code) == 2) {

          int sun_x = 665;
          int sun_y = 105;

          int ruch =
            (id(animacja) / 10) % 8;

          it.filled_circle(
            sun_x,
            sun_y,
            48,
            Color(255, 205, 70)
          );

          // promienie

          it.line(
            sun_x - 75 - ruch,
            sun_y,
            sun_x - 55,
            sun_y,
            Color(255, 220, 100)
          );

          it.line(
            sun_x + 55,
            sun_y,
            sun_x + 75 + ruch,
            sun_y,
            Color(255, 220, 100)