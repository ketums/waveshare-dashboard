          TextAlign::TOP_RIGHT,
          "STRONA 2/2"
        );

        it.print(
          35,
          85,
          id(font_srednia),
          niebieski,
          TextAlign::TOP_LEFT,
          "POGODA - WEJHEROWO"
        );

        if (id(pogoda_ok)) {

          it.printf(
            45,
            125,
            id(font_duza),
            bialy,
            TextAlign::TOP_LEFT,
            "%.1f °C",
            id(temp_pogody)
          );

          it.printf(
            50,
            185,
            id(font_srednia),
            niebieski,
            TextAlign::TOP_LEFT,
            "Wilgotność  %d%%",
            id(wilg_pogody)
          );

          it.printf(
            50,
            225,
            id(font_srednia),
            szary,
            TextAlign::TOP_LEFT,
            "Wiatr  %.1f km/h",
