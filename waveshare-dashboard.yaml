esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

# ============================================================
# I2C
# ============================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: io_ex

# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# ============================================================
# POGODA
# ============================================================

http_request:
  id: klient_http
  useragent: "ESPHome Weather"
  timeout: 10s

globals:

  - id: temperatura
    type: float
    restore_value: no
    initial_value: "0"

  - id: wilgotnosc
    type: float
    restore_value: no
    initial_value: "0"

  - id: wiatr
    type: float
    restore_value: no
    initial_value: "0"

  - id: cisnienie
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: "2"

  - id: klatka
    type: int
    restore_value: no
    initial_value: "0"

# ============================================================
# ANIMACJA + POBIERANIE POGODY
# ============================================================

interval:

  - interval: 100ms
    then:
      - lambda: |-
          id(klatka)++;

          if (id(klatka) > 10000) {
            id(klatka) = 0;
          }

  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.605&longitude=18.2356&current=temperature_2m,relative_humidity_2m,weather_code,pressure_msl,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject current = root["current"];

                          if (current.isNull()) {
                            return false;
                          }

                          id(temperatura) =
                            current["temperature_2m"].as<float>();

                          id(wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(cisnienie) =
                            current["pressure_msl"].as<float>();

                          id(kod_pogody) =
                            current["weather_code"].as<int>();

                          return true;
                        });

# ============================================================
# CZCIONKI
# ============================================================

font:

  - file: "Roboto-Regular.ttf"
    id: font_mala
    size: 16
    bpp: 4

  - file: "Roboto-Regular.ttf"
    id: font_srednia
    size: 24
    bpp: 4

  - file: "Roboto-Regular.ttf"
    id: font_duza
    size: 70
    bpp: 4

  - file: "Roboto-Regular.ttf"
    id: font_zegar
    size: 55
    bpp: 4

# ============================================================
# WYŚWIETLACZ
# WAVESHARE 800 x 480
# ============================================================

display:

  - platform: rpi_dpi_rgb

    id: ekran

    update_interval: 100ms
    auto_clear_enabled: true
    color_order: RGB

    pclk_frequency: 14MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7

    pclk_inverted: false

    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:

      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      int f = id(klatka);

      int kod = id(kod_pogody);

      auto now = id(czas).now();

      // ======================================================
      // NIEBO
      // ======================================================

      bool noc = false;

      if (now.is_valid()) {
        if (now.hour >= 20 || now.hour < 6) {
          noc = true;
        }
      }

      if (noc) {

        it.fill(Color(8, 15, 45));

      } else {

        it.fill(Color(55, 145, 215));
      }

      // ======================================================
      // ANIMOWANE SŁOŃCE
      // ======================================================

      if (!noc) {

        int puls = (f / 5) % 8;

        it.filled_circle(
          150,
          120,
          48 + puls,
          Color(255, 190, 45)
        );

        it.filled_circle(
          150,
          120,
          36,
          Color(255, 225, 75)
        );
      }

      // ======================================================
      // KSIĘŻYC
      // ======================================================

      if (noc) {

        it.filled_circle(
          150,
          110,
          42,
          Color(235, 235, 210)
        );

        it.filled_circle(
          168,
          95,
          42,
          Color(8, 15, 45)
        );
      }

      // ======================================================
      // ANIMOWANE CHMURY
      // ======================================================

      int ruch = (f / 3) % 800;

      int x1 = 50 + ruch;
      int x2 = x1 - 800;

      it.filled_circle(
        x1,
        180,
        30,
        Color(225, 235, 245)
      );

      it.filled_circle(
        x1 + 35,
        160,
        40,
        Color(240, 245, 250)
      );

      it.filled_circle(
        x1 + 75,
        180,
        30,
        Color(225, 235, 245)
      );

      it.filled_rectangle(
        x1,
        180,
        75,
        30,
        Color(225, 235, 245)
      );

      it.filled_circle(
        x2,
        230,
        25,
        Color(205, 220, 235)
      );

      it.filled_circle(
        x2 + 30,
        210,
        35,
        Color(225, 235, 245)
      );

      it.filled_circle(
        x2 + 65,
        230,
        25,
        Color(205, 220, 235)
      );

      it.filled_rectangle(
        x2,
        230,
        65,
        25,
        Color(215, 230, 240)
      );

      // ======================================================
      // DESZCZ
      // ======================================================

      if (
        kod == 51 ||
        kod == 53 ||
        kod == 55 ||
        kod == 61 ||
        kod == 63 ||
        kod == 65 ||
        kod == 80 ||
        kod == 81 ||
        kod == 82
      ) {

        for (int i = 0; i < 45; i++) {

          int x =
            (i * 71 + f * 2) % 800;

          int y =
            220 + ((i * 37 + f * 4) % 100);

          it.line(
            x,
            y,
            x - 5,
            y + 14,
            Color(170, 225, 255)
          );
        }
      }

      // ======================================================
      // ŚNIEG
      // ======================================================

      if (
        kod == 71 ||
        kod == 73 ||
        kod == 75 ||
        kod == 77
      ) {

        for (int i = 0; i < 40; i++) {

          int x =
            (i * 83 + f) % 800;

          int y =
            210 + ((i * 41 + f * 2) % 110);

          it.filled_circle(
            x,
            y,
            3,
            Color(255, 255, 255)
          );
        }
      }

      // ======================================================
      // GÓRNY PANEL
      // ======================================================

      it.filled_rectangle(
        20,
        20,
        310,
        75,
        Color(0, 0, 0)
      );

      it.print(
        40,
        32,
        id(font_srednia),
        Color(255, 255, 255),
        "WEJHEROWO"
      );

      it.print(
        40,
        63,
        id(font_mala),
        Color(200, 220, 240),
        "POLSKA"
      );

      // ======================================================
      // ZEGAR
      // ======================================================

      if (now.is_valid()) {

        it.strftime(
          760,
          25,
          id(font_zegar),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%H:%M",
          now
        );
      }

      // ======================================================
      // TEMPERATURA
      // ======================================================

      it.filled_rectangle(
        25,
        115,
        350,
        165,
        Color(0, 0, 0)
      );

      it.printf(
        45,
        125,
        id(font_duza),
        Color(255, 255, 255),
        "%.1f C",
        id(temperatura)
      );

      // ======================================================
      // OPIS
      // ======================================================

      if (kod == 0) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Bezchmurnie"
        );

      } else if (kod == 1 || kod == 2) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Czesciowe zachmurzenie"
        );

      } else if (kod == 3) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Pochmurno"
        );

      } else if (kod >= 51 && kod <= 67) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Deszcz"
        );

      } else if (kod >= 71 && kod <= 77) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Snieg"
        );

      } else if (kod >= 95) {

        it.print(
          50,
          230,
          id(font_srednia),
          Color(255, 255, 255),
          "Burza"
        );
      }

      // ======================================================
      // PANEL INFORMACJI
      // ======================================================

      it.filled_rectangle(
        500,
        115,
        275,
        165,
        Color(0, 0, 0)
      );

      it.printf(
        525,
        135,
        id(font_mala),
        Color(255, 255, 255),
        "Odczuwalna: %.1f C",
        id(temperatura)
      );

      it.printf(
        525,
        165,
        id(font_mala),
        Color(170, 225, 255),
        "Wilgotnosc: %.0f %%",
        id(wilgotnosc)
      );

      it.printf(
        525,
        195,
        id(font_mala),
        Color(180, 235, 255),
        "Wiatr: %.0f km/h",
        id(wiatr)
      );

      it.printf(
        525,
        225,
        id(font_mala),
        Color(220, 210, 255),
        "Cisnienie: %.0f hPa",
        id(cisnienie)
      );

      // ======================================================
      // DOLNY PASEK
      // ======================================================

      it.filled_rectangle(
        15,
        320,
        770,
        140,
        Color(0, 0, 0)
      );

      it.print(
        35,
        335,
        id(font_mala),
        Color(255, 255, 255),
        "DZIS"
      );

      it.printf(
        35,
        365,
        id(font_srednia),
        Color(255, 220, 100),
        "%.0f C",
        id(temperatura)
      );

      it.print(
        190,
        335,
        id(font_mala),
        Color(255, 255, 255),
        "WILGOTNOSC"
      );

      it.printf(
        190,
        365,
        id(font_srednia),
        Color(170, 225, 255),
        "%.0f %%",
        id(wilgotnosc)
      );

      it.print(
        365,
        335,
        id(font_mala),
        Color(255, 255, 255),
        "WIATR"
      );

      it.printf(
        365,
        365,
        id(font_srednia),
        Color(180, 235, 255),
        "%.0f km/h",
        id(wiatr)
      );

      it.print(
        540,
        335,
        id(font_mala),
        Color(255, 255, 255),
        "ZRODLO"
      );

      it.print(
        540,
        365,
        id(font_srednia),
        Color(255, 255, 255),
        "Open-Meteo"
      );

      // ======================================================
      // STOPKA
      // ======================================================

      it.print(
        400,
        445,
        id(font_mala),
        Color(170, 200, 220),
        TextAlign::CENTER,
        "Animowana pogoda - Wejherowo"
      );

# ============================================================
# GT911
# ============================================================

touchscreen:

  - platform: gt911

    id: my_touch

    i2c_id: bus_i2c

    address: 0x5D

    interrupt_pin:
      number: GPIO4

    reset_pin:
      ch422g: io_ex
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false