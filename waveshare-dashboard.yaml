esphome:
  name: waveshare-dashboard
  friendly_name: Waveshare 4.3 Dashboard

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:


# ============================================================
# CH422G - ekspander GPIO znajdujący się na płytce Waveshare
# ============================================================

ch422g:
  - id: ch422g_hub


# ============================================================
# I2C - GT911 + CH422G
# GPIO 8 = SDA
# GPIO 9 = SCL
# ============================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz


# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: zegar
    timezone: Europe/Warsaw


# ============================================================
# CZCIONKI
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 20

  - file: "gfonts://Roboto"
    id: font_medium
    size: 26

  - file: "gfonts://Roboto"
    id: font_large
    size: 48

  - file: "gfonts://Roboto"
    id: font_title
    size: 30


# ============================================================
# WYŚWIETLACZ 800x480
# ============================================================

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran

    rotation: 0

    update_interval: 1s

    lambda: |-

      // ------------------------------------------------------
      // TŁO
      // ------------------------------------------------------

      it.fill(Color(15, 18, 24));


      // ------------------------------------------------------
      // GÓRNY PANEL
      // ------------------------------------------------------

      it.filled_rectangle(
        0, 0,
        800, 75,
        Color(25, 30, 40)
      );

      it.print(
        20, 20,
        id(font_title),
        Color(255, 255, 255),
        "SMART HOME"
      );


      // Zegar

      auto now = id(zegar).now();

      if (now.is_valid()) {

        it.printf(
          780, 14,
          id(font_large),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%02d:%02d",
          now.hour,
          now.minute
        );

      } else {

        it.print(
          780, 20,
          id(font_medium),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "--:--"
        );

      }


      // ------------------------------------------------------
      // LINIE PODZIAŁU
      // ------------------------------------------------------

      it.filled_rectangle(
        399, 75,
        401, 480,
        Color(70, 75, 85)
      );

      it.filled_rectangle(
        0, 300,
        800, 302,
        Color(70, 75, 85)
      );


      // ------------------------------------------------------
      // LEWA GÓRA - ROLETY
      // ------------------------------------------------------

      it.print(
        200, 95,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ROLETY OKIENNE"
      );


      // Przyciski rolet

      it.filled_rectangle(
        25, 150,
        130, 210,
        Color(40, 45, 55)
      );

      it.print(
        77, 165,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "GÓRA"
      );


      it.filled_rectangle(
        145, 150,
        250, 210,
        Color(40, 45, 55)
      );

      it.print(
        197, 165,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "STOP"
      );


      it.filled_rectangle(
        265, 150,
        370, 210,
        Color(40, 45, 55)
      );

      it.print(
        317, 165,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "DÓŁ"
      );


      // Status rolet

      it.print(
        200, 235,
        id(font_small),
        Color(150, 160, 175),
        TextAlign::TOP_CENTER,
        "STEROWANIE ROLETAMI"
      );


      // ------------------------------------------------------
      // PRAWA GÓRA - KLIMATYZACJA
      // ------------------------------------------------------

      it.print(
        600, 95,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ROTENSO"
      );

      it.print(
        600, 130,
        id(font_title),
        Color(100, 200, 255),
        TextAlign::TOP_CENTER,
        "KLIMATYZACJA"
      );


      it.filled_rectangle(
        440, 170,
        560, 230,
        Color(40, 45, 55)
      );

      it.print(
        500, 184,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ON / OFF"
      );


      it.filled_rectangle(
        580, 170,
        760, 230,
        Color(40, 45, 55)
      );

      it.print(
        670, 184,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "TRYB"
      );


      it.print(
        600, 255,
        id(font_small),
        Color(150, 160, 175),
        TextAlign::TOP_CENTER,
        "STATUS: GOTOWA"
      );


      // ------------------------------------------------------
      // LEWY DÓŁ - CZUJNIK ZIGBEE
      // ------------------------------------------------------

      it.print(
        200, 325,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "CZUJNIK ZIGBEE"
      );


      it.print(
        110, 385,
        id(font_large),
        Color(255, 180, 80),
        TextAlign::TOP_CENTER,
        "21.5°C"
      );


      it.print(
        285, 395,
        id(font_medium),
        Color(100, 200, 255),
        TextAlign::TOP_CENTER,
        "55% RH"
      );


      // ------------------------------------------------------
      // PRAWY DÓŁ - STATUS SYSTEMU
      // ------------------------------------------------------

      it.print(
        600, 325,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "STATUS SYSTEMU"
      );


      it.print(
        600, 375,
        id(font_medium),
        Color(100, 255, 130),
        TextAlign::TOP_CENTER,
        "ESP32 ONLINE"
      );


      it.print(
        600, 420,
        id(font_small),
        Color(160, 170, 180),
        TextAlign::TOP_CENTER,
        "Waveshare 800x480"
      );


# ============================================================
# GT911 - PANEL DOTYKOWY
# ============================================================

touchscreen:
  - platform: gt911

    id: dotyk

    display: ekran

    i2c_id: bus_a

    address: 0x5D

    # IRQ dotyku jest bezpośrednio na GPIO4
    interrupt_pin: GPIO4

    # Poprawiony pin resetu przez ekspander CH422G
    reset_pin:
      ch422g: ch422g_hub
      pin: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    update_interval: 50ms

    on_touch:
      - lambda: |-

          ESP_LOGI(
            "touch",
            "Dotyk: X=%d Y=%d",
            touch.x,
            touch.y
          );


# ============================================================
# PRZYCISKI DOTYKOWE - ROLETA GÓRA
# ============================================================

binary_sensor:

  - platform: touchscreen
    name: "Roleta Góra"
    id: roleta_gora

    x_min: 25
    x_max: 130
    y_min: 150
    y_max: 210

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY GÓRA"
          level: INFO


  - platform: touchscreen
    name: "Roleta Stop"
    id: roleta_stop

    x_min: 145
    x_max: 250
    y_min: 150
    y_max: 210

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY STOP"
          level: INFO


  - platform: touchscreen
    name: "Roleta Dół"
    id: roleta_dol

    x_min: 265
    x_max: 370
    y_min: 150
    y_max: 210

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY DÓŁ"
          level: INFO


# ============================================================
# PRZYCISK DOTYKOWY - KLIMATYZACJA
# ============================================================

  - platform: touchscreen
    name: "Klimatyzacja"
    id: klimatyzacja

    x_min: 440
    x_max: 560
    y_min: 170
    y_max: 230

    on_press:
      - logger.log:
          format: "Naciśnięto KLIMATYZACJA"


# ============================================================
# PRZYCISK DOTYKOWY - TRYB KLIMATYZACJI
# ============================================================

  - platform: touchscreen
    name: "Tryb klimatyzacji"
    id: tryb_klimatyzacji

    x_min: 580
    x_max: 760
    y_min: 170
    y_max: 230

    on_press:
      - logger.log:
          format: "Naciśnięto TRYB KLIMATYZACJI"
