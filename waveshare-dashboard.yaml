esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_temp
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_odczuwalna
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_opad
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_snieg
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_kod
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_dzien
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: pogoda_online
    type: bool
    restore_value: no
    initial_value: 'false'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  timeout: 10s

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"
    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

interval:
  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.605&longitude=18.235&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,showers,snowfall,weather_code,wind_speed_10m,is_day&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 2048

          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject current = root["current"];

                          if (current["temperature_2m"]) {
                            id(pogoda_temp) =
                              current["temperature_2m"].as<float>();
                          }

                          if (current["apparent_temperature"]) {
                            id(pogoda_odczuwalna) =
                              current["apparent_temperature"].as<float>();
                          }

                          if (current["relative_humidity_2m"]) {
                            id(pogoda_wilgotnosc) =
                              current["relative_humidity_2m"].as<float>();
                          }

                          if (current["wind_speed_10m"]) {
                            id(pogoda_wiatr) =
                              current["wind_speed_10m"].as<float>();
                          }

                          if (current["precipitation"]) {
                            id(pogoda_opad) =
                              current["precipitation"].as<float>();
                          }

                          if (current["snowfall"]) {
                            id(pogoda_snieg) =
                              current["snowfall"].as<float>();
                          }

                          if (current["weather_code"]) {
                            id(pogoda_kod) =
                              current["weather_code"].as<int>();
                          }

                          if (current["is_day"]) {
                            id(pogoda_dzien) =
                              current["is_day"].as<int>() == 1;
                          }

                          id(pogoda_online) = true;

                          ESP_LOGI(
                            "POGODA",
                            "Temp %.1f C | Wilgotnosc %.0f%% | Wiatr %.1f km/h | Kod %d",
                            id(pogoda_temp),
                            id(pogoda_wilgotnosc),
                            id(pogoda_wiatr),
                            id(pogoda_kod)
                          );

                          return true;
                        });

                  else:
                    - lambda: |-
                        id(pogoda_online) = false;

                        ESP_LOGW(
                          "POGODA",
                          "Blad HTTP: %d",
                          response->status_code
                        );

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran_waveshare
    rotation: 0
    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-

      auto time_now = id(czas_sntp).now();

      // =====================================================
      // STRONA 3 - AKTUALNA POGODA
      // =====================================================

      if (id(aktualna_strona) == 2) {

        it.fill(Color(8, 16, 30));

        // Gorny pasek
        it.rectangle(
          0, 0, 800, 65,
          Color(15, 30, 52)
        );

        it.print(
          25, 18,
          id(font_srednia),
          Color(220, 230, 245),
          TextAlign::TOP_LEFT,
          "WEJHEROWO"
        );

        if (id(pogoda_online)) {

          it.print(
            775, 18,
            id(font_mala),
            Color(80, 220, 130),
            TextAlign::TOP_RIGHT,
            "ONLINE"
          );

        } else {

          it.print(
            775, 18,
            id(font_mala),
            Color(240, 100, 100),
            TextAlign::TOP_RIGHT,
            "BRAK DANYCH"
          );
        }

        uint32_t ms = millis();

        int kod = id(pogoda_kod);

        // =====================================================
        // BEZCHMURNIE
        // =====================================================

        if (kod == 0 || kod == 1) {

          int cx = 235;
          int cy = 235;

          float angle =
            (ms % 8000) *
            (2.0 * 3.14159265 / 8000.0);

          for (int i = 0; i < 12; i++) {

            float a =
              angle +
              i * (2.0 * 3.14159265 / 12.0);

            int x1 =
              cx + 55.0 * cosf(a);

            int y1 =
              cy + 55.0 * sinf(a);

            int x2 =
              cx + 82.0 * cosf(a);

            int y2 =
              cy + 82.0 * sinf(a);

            it.line(
              x1, y1,
              x2, y2,
              Color(255, 190, 40)
            );
          }

          it.filled_circle(
            cx, cy, 48,
            Color(255, 190, 35)
          );

          it.filled_circle(
            cx - 10, cy - 10, 34,
            Color(255, 225, 90)
          );
        }

        // =====================================================
        // CZESCIOWE / DUZE ZACHMURZENIE
        // =====================================================

        else if (kod == 2 || kod == 3) {

          int move =
            (ms / 35) % 70;

          int cx =
            185 + move;

          int cy = 235;

          it.filled_circle(
            cx - 65, cy + 10, 35,
            Color(110, 135, 165)
          );

          it.filled_circle(
            cx - 15, cy - 15, 48,
            Color(155, 180, 210)
          );

          it.filled_circle(
            cx + 35, cy + 5, 40,
            Color(125, 150, 180)
          );

          it.filled_rectangle(
            cx - 70,
            cy + 5,
            135,
            42,
            Color(145, 170, 200)
          );

          if (kod == 2) {

            it.line(
              100, 165,
              140, 180,
              Color(255, 205, 80)
            );

            it.line(
              280, 165,
              320, 180,
              Color(255, 205, 80)
            );
          }
        }

        // =====================================================
        // MGŁA
        // =====================================================

        else if (kod == 45 || kod == 48) {

          for (int i = 0; i < 7; i++) {

            int shift =
              (ms / 20 + i * 45) % 180;

            int y =
              150 + i * 30;

            it.line(
              50 + shift,
              y,
              360 + shift,
              y,
              Color(150, 170, 190)
            );
          }
        }

        // =====================================================
        // DESZCZ
        // =====================================================

        else if (
          (kod >= 51 && kod <= 67) ||
          (kod >= 80 && kod <= 82)
        ) {

          int cx = 225;
          int cy = 180;

          it.filled_circle(
            cx - 70, cy + 20, 38,
            Color(90, 115, 145)
          );

          it.filled_circle(
            cx - 15, cy - 5, 52,
            Color(135, 160, 190)
          );

          it.filled_circle(
            cx + 45, cy + 18, 40,
            Color(100, 125, 155)
          );

          it.filled_rectangle(
            cx - 75,
            cy + 20,
            135,
            42,
            Color(125, 150, 180)
          );

          for (int i = 0; i < 28; i++) {

            int x =
              105 +
              ((i * 37) % 250);

            int speed =
              3 + (i % 5);

            int y =
              250 +
              ((ms / speed + i * 31) % 170);

            it.line(
              x,
              y,
              x - 4,
              y + 17,
              Color(70, 175, 245)
            );
          }
        }

        // =====================================================
        // SNEG
        // =====================================================

        else if (
          (kod >= 71 && kod <= 77) ||
          kod == 85 ||
          kod == 86
        ) {

          int cx = 225;
          int cy = 180;

          it.filled_circle(
            cx - 70, cy + 20, 38,
            Color(125, 145, 170)
          );

          it.filled_circle(
            cx - 15, cy - 5, 52,
            Color(175, 195, 215)
          );

          it.filled_circle(
            cx + 45, cy + 18, 40,
            Color(145, 165, 190)
          );

          it.filled_rectangle(
            cx - 75,
            cy + 20,
            135,
            42,
            Color(160, 180, 200)
          );

          for (int i = 0; i < 25; i++) {

            int x =
              100 +
              ((i * 47) % 250);

            int y =
              250 +
              ((ms / 8 + i * 37) % 170);

            it.filled_circle(
              x,
              y,
              4,
              Color(245, 250, 255)
            );
          }
        }

        // =====================================================
        // BURZA
        // =====================================================

        else if (kod >= 95) {

          int cx = 225;
          int cy = 175;

          it.filled_circle(
            cx - 70, cy + 20, 40,
            Color(65, 75, 95)
          );

          it.filled_circle(
            cx - 15, cy - 5, 55,
            Color(90, 100, 120)
          );

          it.filled_circle(
            cx + 50, cy + 20, 42,
            Color(70, 80, 100)
          );

          it.filled_rectangle(
            cx - 80,
            cy + 20,
            150,
            45,
            Color(80, 90, 110)
          );

          for (int i = 0; i < 18; i++) {

            int x =
              115 +
              ((i * 43) % 230);

            int y =
              260 +
              ((ms / 5 + i * 29) % 150);

            it.line(
              x,
              y,
              x - 5,
              y + 18,
              Color(70, 175, 245)
            );
          }

          int flash =
            (ms / 250) % 4;

          if (flash == 0 || flash == 1) {

            it.line(
              225, 245,
              200, 300,
              Color(255, 240, 80)
            );

            it.line(
              200, 300,
              230, 300,
              Color(255, 240, 80)
            );

            it.line(
              230, 300,
              210, 350,
              Color(255, 240, 80)
            );
          }
        }

        // =====================================================
        // INFORMACJE POGODOWE
        // =====================================================

        it.rectangle(
          420, 90, 360, 325,
          Color(25, 40, 62)
        );

        if (id(pogoda_online)) {

          it.printf(
            445, 110,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_LEFT,
            "%.1f°C",
            id(pogoda_temp)
          );

          it.printf(
            445, 165,
            id(font_mala),
            Color(170, 190, 215),
            TextAlign::TOP_LEFT,
            "Odczuwalna %.1f°C",
            id(pogoda_odczuwalna)
          );

          it.printf(
            445, 215,
            id(font_srednia),
            Color(90, 200, 250),
            TextAlign::TOP_LEFT,
            "Wilgotnosc %.0f%%",
            id(pogoda_wilgotnosc)
          );

          it.printf(
            445, 260,
            id(font_srednia),
            Color(170, 205, 235),
            TextAlign::TOP_LEFT,
            "Wiatr %.1f km/h",
            id(pogoda_wiatr)
          );

          it.printf(
            445, 305,
            id(font_mala),
            Color(160, 180, 205),
            TextAlign::TOP_LEFT,
            "Opad: %.1f mm",
            id(pogoda_opad)
          );

          if (kod == 0) {

            it.print(
              445, 350,
              id(font_mala),
              Color(255, 210, 70),
              TextAlign::TOP_LEFT,
              "Bezchmurnie"
            );

          } else if (kod == 1) {

            it.print(
              445, 350,
              id(font_mala),
              Color(255, 210, 70),
              TextAlign::TOP_LEFT,
              "Przewaznie bezchmurnie"
            );

          } else if (kod == 2) {

            it.print(
              445, 350,
              id(font_mala),
              Color(190, 205, 225),
              TextAlign::TOP_LEFT,
              "Czesciowe zachmurzenie"
            );

          } else if (kod == 3) {

            it.print(
              445, 350,
              id(font_mala),
              Color(170, 185, 205),
              TextAlign::TOP_LEFT,
              "Pochmurno"
            );

          } else if (
            kod == 45 ||
            kod == 48
          ) {

            it.print(
              445, 350,
              id(font_mala),
              Color(180, 190, 200),
              TextAlign::TOP_LEFT,
              "Mgla"
            );

          } else if (
            kod >= 51 &&
            kod <= 67
          ) {

            it.print(
              445, 350,
              id(font_mala),
              Color(80, 185, 245),
              TextAlign::TOP_LEFT,
              "Deszcz"
            );

          } else if (
            kod >= 71 &&
            kod <= 77
          ) {

            it.print(
              445, 350,
              id(font_mala),
              Color(235, 245, 255),
              TextAlign::TOP_LEFT,
              "Snieg"
            );

          } else if (
            kod >= 80 &&
            kod <= 82
          ) {

            it.print(
              445, 350,
              id(font_mala),
              Color(80, 185, 245),
              TextAlign::TOP_LEFT,
              "Przelotny deszcz"
            );

          } else if (kod >= 95) {

            it.print(
              445, 350,
              id(font_mala),
              Color(255, 220, 70),
              TextAlign::TOP_LEFT,
              "Burza"
            );

          } else {

            it.print(
              445, 350,
              id(font_mala),
              Color(180, 195, 215),
              TextAlign::TOP_LEFT,
              "Warunki pogodowe"
            );
          }

        } else {

          it.print(
            600, 170,
            id(font_srednia),
            Color(180, 195, 215),
            TextAlign::CENTER,
            "POBIERANIE"
          );

          it.print(
            600, 205,
            id(font_mala),
            Color(130, 150, 175),
            TextAlign::CENTER,
            "danych pogodowych..."
          );
        }

        if (time_now.is_valid()) {

          it.strftime(
            775, 435,
            id(font_mala),
            Color(130, 150, 175),
            TextAlign::BOTTOM_RIGHT,
            "%H:%M:%S",
            time_now
          );
        }

        return;
      }

      // =====================================================
      // WSPOLNY WYGLAD STRONY 1 I 2
      // =====================================================

      it.fill(Color(18, 24, 38));

      it.rectangle(
        10, 10, 780, 460,
        Color(45, 55, 72)
      );

      it.line(
        10, 70,
        790, 70,
        Color(45, 55, 72)
      );

      it.print(
        25, 20,
        id(font_srednia),
        Color(200, 210, 225),
        TextAlign::TOP_LEFT,
        "DASHBOARD"
      );

      if (id(wifi_ssid).has_state()) {

        it.print(
          285, 18,
          id(font_srednia),
          Color(72, 187, 120),
          TextAlign::TOP_LEFT,
          "WIFI OK"
        );

      } else {

        it.print(
          285, 18,
          id(font_srednia),
          Color(229, 62, 62),
          TextAlign::TOP_LEFT,
          "WIFI OFF"
        );
      }

      if (!isnan(id(wifi_sila).state)) {

        it.printf(
          390, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_LEFT,
          "%0.0f dBm",
          id(wifi_sila).state
        );

      } else {

        it.print(
          390, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_LEFT,
          "-- dBm"
        );
      }

      if (id(wifi_ip).has_state()) {

        it.printf(
          770, 20,
          id(font_mala),
          Color(90, 200, 250),
          TextAlign::TOP_RIGHT,
          "%s",
          id(wifi_ip).state.c_str()
        );

      } else {

        it.print(
          770, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_RIGHT,
          "brak IP"
        );
      }

      // =====================================================
      // STRONA 1
      // =====================================================

      if (id(aktualna_strona) == 0) {

        it.line(
          400, 70,
          400, 470,
          Color(45, 55, 72)
        );

        it.line(
          10, 270,
          790, 270,
          Color(45, 55, 72)
        );

        it.print(
          770, 75,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_RIGHT,
          "STRONA 1/3"
