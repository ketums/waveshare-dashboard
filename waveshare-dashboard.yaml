        );

        // delikatny cien dolu

        it.filled_rectangle(
          570, 390,
          100, 12,
          Color(220, 223, 225)
        );

        // ===================================================
        // METALOWE POKRETLO
        // ===================================================

        it.filled_rectangle(
          580, 315,
          80, 25,
          Color(150, 154, 158)
        );

        it.filled_circle(
          620, 315,
          40,
          Color(160, 164, 168)
        );

        it.filled_rectangle(
          585, 300,
          70, 22,
          Color(180, 184, 188)
        );

        it.filled_circle(
          620, 300,
          35,
          Color(170, 174, 178)
        );

        // nacięcia pokretla

        for (int i = 0; i < 7; i++) {

          it.line(
            590 + i * 10,
            290,
            590 + i * 10,
            315,
            Color(105, 110, 115)
          );
        }

        // gorna krawedz

        it.filled_rectangle(
          595, 285,
          50, 8,
          Color(195, 198, 200)
        );

        // ===================================================
        // WYSWIETLACZ
        // ===================================================

        it.print(
          620, 350,
          id(font_srednia),
          Color(185, 190, 195),
          TextAlign::TOP_CENTER,
          "26°"
        );

        // ===================================================
        // STATUS
        // ===================================================

        it.print(
          440, 400,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "STATUS:"
        );

        it.print(
          505, 400,
          id(font_mala),
          Color(100, 220, 130),
          TextAlign::TOP_LEFT,
          "GRZEJE"
        );

      }

      // =====================================================
      // STRONA 2
      // =====================================================

      else if (id(aktualna_strona) == 1) {

        it.print(
          770, 75,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_RIGHT,
          "STRONA 2/3"
        );

        it.print(
          400, 150,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "DRUGI KAFEL"
        );

        it.print(
          400, 220,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "Miejsce na kolejne"
        );

        it.print(
          400, 250,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "przyciski i sensory"
        );
      }

touchscreen:
  - platform: gt911
    id: panel_dotykowy
    i2c_id: bus_i2c

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          int x = touch.x;
          int y = touch.y;

          ESP_LOGI(
            "TOUCH",
            "Dotyk X=%d Y=%d",
            x,
            y
          );

          // ===================================================
          // STRONA 3
          // ===================================================

          if (id(aktualna_strona) == 2) {

            id(aktualna_strona) = 0;

            ESP_LOGI(
              "TOUCH",
              "Powrot ze strony 3 na strone 1"
            );

            return;
          }

          // ===================================================
          // GORNY PASEK
          // ===================================================

          if (y >= 0 && y <= 70) {

            id(aktualna_strona) =
              (id(aktualna_strona) + 1) % 3;

            ESP_LOGI(
              "TOUCH",
              "Przelaczono strone na indeks: %d",
              id(aktualna_strona)
            );

            return;
          }

          // ===================================================
          // STRONA 1
          // ===================================================

          if (id(aktualna_strona) == 0) {

            // ROLETY

            if (y >= 170 && y <= 220) {

              if (x >= 30 && x <= 130) {

                ESP_LOGI(
                  "TOUCH",
                  "Nacisnieto: OTWORZ OKNA"
                );

              } else if (x >= 140 && x <= 240) {

                ESP_LOGI(
                  "TOUCH",
                  "Nacisnieto: STOP ROLETY"
                );

              } else if (x >= 250 && x <= 350) {

                ESP_LOGI(
                  "TOUCH",
                  "Nacisnieto: ZAMKNIJ OKNA"
                );

              } else if (x >= 430 && x <= 490) {

                ESP_LOGI(
                  "TOUCH",
                  "Nacisnieto: TEMP -"
                );

              } else if (x >= 580 && x <= 640) {

                ESP_LOGI(
                  "TOUCH",
                  "Nacisnieto: TEMP +"
                );
              }
            }

            // OGRZEWANIE

            if (
              x >= 420 &&
              x <= 780 &&
              y >= 285 &&
              y <= 460
            ) {

              ESP_LOGI(
                "TOUCH",
                "Nacisnieto: OGRZEWANIE"
              );
            }
          }

          // ===================================================
          // STRONA 2
          // ===================================================

          else if (id(aktualna_strona) == 1) {

            ESP_LOGI(
              "TOUCH",
              "Dotyk na stronie 2"
            );
          }