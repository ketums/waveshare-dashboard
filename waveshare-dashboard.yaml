esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

builder: esp-idf

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

api:

ota:
  - platform: esphome

# ============================================================
# ZMIENNE GLOBALNE (STAN STRONY)
# ============================================================

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

# 1. Konfiguracja Magistrali I2C dla kontrolera dotyku GT911
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true
  id: bus_i2c

# 3. Klient HTTP (bez błędnego zapisu z kropką na poziomie głównym)
http_request:
  id: klient_http
  useragent: "ESPHome Waveshare"
  timeout: 5s

# 2. Konfiguracja Panelu Dotykowego GT911 + Obsługa stron i akcji HTTP
touchscreen:
  platform: gt911
  id: panel_dotykowy
  i2c_id: bus_i2c
  interrupt_pin: GPIO0
  reset_pin: GPIO38
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

  on_touch:
    - lambda: |-
        int x = touch.x;
        int y = touch.y;
        
        // --- PRZEŁĄCZANIE STRON (Górny pasek: y od 0 do 70) ---
        if (y >= 0 && y <= 70) {
          if (id(aktualna_strona) == 0) {
            id(aktualna_strona) = 1;
            ESP_LOGI("TOUCH", "Przełączono na Stronę 2");
          } else {
            id(aktualna_strona) = 0;
            ESP_LOGI("TOUCH", "Przełączono na Stronę 1");
          }
          return;
        }

        // --- OBSŁUGA DLA STRONY GŁÓWNEJ (0) ---
        if (id(aktualna_strona) == 0) {
          // --- STREFA 1: ROLETY ---
          if (y >= 170 && y <= 220) {
            // Przycisk: OTWÓRZ OKNA
            if (x >= 30 && x <= 130) {
              ESP_LOGI("TOUCH", "Naciśnięto: OTWÓRZ OKNA");
              id(klient_http)->post("https://openapi.tuyaeu.com/v1.0/token");
            }
            // Przycisk: STOP
            else if (x >= 140 && x <= 240) {
              ESP_LOGI("TOUCH", "Naciśnięto: STOP ROLETY");
              id(klient_http)->post("https://openapi.tuyaeu.com/v1.0/token");
            }
            // Przycisk: ZAMKNIJ OKNA
            else if (x >= 250 && x <= 350) {
              ESP_LOGI("TOUCH", "Naciśnięto: ZAMKNIJ OKNA");
              id(klient_http)->post("https://openapi.tuyaeu.com/v1.0/token");
            }
          }

          // --- STREFA 2: KLIMATYZACJA ROTENSO ---
          if (y >= 170 && y <= 220) {
            // Przycisk: - (Zmniejsz temperaturę)
            if (x >= 430 && x <= 490) {
              ESP_LOGI("TOUCH", "Naciśnięto: TEMP -");
              id(klient_http)->post("https://openapi.tuyaeu.com/v1.0/token");
            }
            // Przycisk: + (Zwiększ temperaturę)
            else if (x >= 580 && x <= 640) {
              ESP_LOGI("TOUCH", "Naciśnięto: TEMP +");
              id(klient_http)->post("https://openapi.tuyaeu.com/v1.0/token");
            }
          }
        } 
        // --- OBSŁUGA DLA DRUGIEGO KAFLA / STRONY (1) ---
        else {
          // Przycisk powrotu na stronie 2
          if (y >= 320 && y <= 390 && x >= 250 && x <= 550) {
            id(aktualna_strona) = 0;
            ESP_LOGI("TOUCH", "Powrót do strony głównej");
          }
        }

# Czcionki
font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
  - file: "gfonts://Roboto"
    id: font_mala
    size: 16

# Czas NTP
time:
  - platform: sntp
    id: czas_sntp
    timezone: "Europe/Warsaw"

# Wyświetlacz LCD ESP32-S3 (800x480) - Obsługa dwóch stron
display:
  - platform: esp32_lcd
    id: ekran_waveshare
    dimensions:
      width: 800
      height: 480
    col_max: 800
    row_max: 480
    color_order: RGB
    data_rate: 16MHz
    lambda: |-
      // Ciemny motyw tła
      it.fill(Color(18, 24, 38));

      // Wspólne ramki i górny pasek
      it.rectangle(10, 10, 780, 460, Color(45, 55, 72));
      it.line(10, 70, 790, 70, Color(45, 55, 72));

      // Zegar
      auto time_now = id(czas_sntp).now();
      if (time_now.is_valid()) {
        it.strftime(30, 20, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, "%H:%M", time_now);
      }

      // Status w nagłówku zależny od strony
      if (id(aktualna_strona) == 0) {
        it.print(770, 25, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_RIGHT, "Strona 1/2 [Dotknij góry]");
      } else {
        it.print(770, 25, id(font_srednia), Color(90, 200, 250), TextAlign::TOP_RIGHT, "Strona 2/2 [Powrót]");
      }


      // ======================================================
      // ZAWARTOŚĆ STRONY 0 (GŁÓWNA)
      // ======================================================
      if (id(aktualna_strona) == 0) {

        it.line(400, 70, 400, 470, Color(45, 55, 72));
        it.line(10, 270, 790, 270, Color(45, 55, 72));

        // --- KAFELEK 1: ROLETY ---
        it.print(30, 90, id(font_srednia), Color(237, 137, 54), TextAlign::TOP_LEFT, "ROLETY OKIENNE");
        it.print(30, 130, id(font_mala), Color(160, 174, 192), TextAlign::TOP_LEFT, "okno 1 & okno 2");
        
        it.rectangle(30, 170, 100, 50, Color(66, 153, 225));
        it.print(80, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "OTWÓRZ");
        
        it.rectangle(140, 170, 100, 50, Color(229, 62, 62));
        it.print(190, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "STOP");
        
        it.rectangle(250, 170, 100, 50, Color(66, 153, 225));
        it.print(300, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "ZAMKNIJ");

        // --- KAFELEK 2: KLIMATYZATOR ROTENSO ---
        it.print(430, 90, id(font_srednia), Color(90, 200, 250), TextAlign::TOP_LEFT, "KLIMATYZACJA ROTENSO");
        
        it.rectangle(430, 170, 60, 50, Color(66, 153, 225));
        it.print(460, 182, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "-");
        
        it.print(535, 175, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "22°C");
        
        it.rectangle(580, 170, 60, 50, Color(229, 62, 62));
        it.print(610, 182, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "+");

        // --- KAFELEK 3: CZUJNIK ZIGBEE ---
        it.print(30, 290, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_LEFT, "CZUJNIK ZIGBEE");
        it.print(30, 340, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, "21.5 °C");
        it.print(30, 400, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, "Wilgotność: 55%");

      } 
      // ======================================================
      // ZAWARTOŚĆ STRONY 1 (DRUGI KAFEL / STRONA 2)
      // ======================================================
      else {

        it.print(400, 150, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "DRUGI KAFEL / STRONA 2");
        it.print(400, 220, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_CENTER, "Miejsce na kolejne przyciski i czujniki");

        // Wizualny przycisk powrotu
        it.rectangle(250, 320, 300, 70, Color(66, 153, 225));
        it.print(400, 340, id(font_srednia), Color(255, 255, 255), TextAlign::TOP_CENTER, "POWRÓT DO STRONY GŁÓWNEJ");

      }
