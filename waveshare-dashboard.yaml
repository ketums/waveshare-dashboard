    lambda: |-

      it.fill(Color(0x101923));

      auto now = id(czas).now();


      if (id(aktualna_strona) == 0) {

        it.print(
          30,
          25,
          id(font_duzy),
          Color(0xFFFFFF),
          "DASHBOARD"
        );

        it.print(
          30,
          90,
          id(font_sredni),
          Color(0x00D8FF),
