esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

ch422g:
  - id: io_ex

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

http_request:
  id: klient_http
  useragent: "ESPHome Waveshare"
  timeout: 5s

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: "0"

  - id: temperatura_klimy
    type: float
    restore_value: no
    initial_value: "22"

font:
  - file: "Roboto-Regular.ttf"
    id: font_duza
    size: 42
    bpp: 4

  - file: "Roboto-Regular.ttf"
    id: font_srednia
    size: 22
    bpp: 4

  - file: "Roboto-Regular.ttf"
    id: font_mala
    size: 16
    bpp: 4

script:

  - id: akcja_otworz_roleta
    then:
      - logger.log: "ROLETY - OTWÓRZ"

  - id: akcja_stop_roleta
    then:
      - logger.log: "ROLETY - STOP"

  - id: akcja_zamknij_roleta
    then:
      - logger.log: "ROLETY - ZAMKNIJ"

  - id: akcja_klima_down
    then:
      - lambda: |-
          id(temperatura_klimy) -= 1.0;
          if (id(temperatura_klimy) < 16.0) {
            id(temperatura_klimy) = 16.0;
          }

  - id: akcja_klima_up
    then:
      - lambda: |-
          id(temperatura_klimy) += 1.0;
          if (id(temperatura_klimy) > 30.0) {
            id(temperatura_klimy) = 30.0;
          }

display:
  - platform: rpi_dpi_rgb
    id: ekran

    update_interval: 500ms
    auto_clear_enabled: true

    color_order: RGB

    pclk_frequency: 14MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7
    pclk_inverted: false

    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:
      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      auto now = id(czas).now();

      /*
       * TŁO
       */

      it.fill(Color(18, 24, 32));

      /*
       * GÓRNY PASEK
       */

      it.filled_rectangle(
        0,
        0,
        800,
        70,
        Color(10, 15, 22)
      );

      if (id(aktualna_strona) == 0) {

        it.print(
          400,
          20,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STEROWANIE ROLETAMI"
        );

      } else {

        it.print(
          400,
          20,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "KLIMATYZACJA ROTENSO"
        );
      }

      /*
       * ZEGAR
       */

      if (now.is_valid()) {

        it.strftime(
          775,
          8,
          id(font_mala),
          Color(180, 200, 220),
          TextAlign::TOP_RIGHT,
          "%H:%M",
          now
        );
      }

      /*
       * STRONA 1 - ROLETY
       */

      if (id(aktualna_strona) == 0) {

        it.print(
          400,
          95,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ROLETY OKIENNE"
        );

        /*
         * OTWÓRZ
         */

        it.filled_rectangle(
          40,
          180,
          150,
          70,
          Color(35, 150, 80)
        );

        it.print(
          115,
          198,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "OTWÓRZ"
        );

        /*
         * STOP
         */

        it.filled_rectangle(
          190,
          180,
          150,
          70,
          Color(180, 140, 30)
        );

        it.print(
          265,
          198,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STOP"
        );

        /*
         * ZAMKNIJ
         */

        it.filled_rectangle(
          340,
          180,
          150,
          70,
          Color(180, 55, 55)
        );

        it.print(
          415,
          198,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ZAMKNIJ"
        );

        /*
         * INFORMACJA
         */

        it.print(
          400,
          310,
          id(font_mala),
          Color(170, 190, 210),
          TextAlign::TOP_CENTER,
          "Dotknij przycisku, aby sterowac roletami"
        );

        it.print(
          400,
          370,
          id(font_mala),
          Color(110, 140, 170),
          TextAlign::TOP_CENTER,
          "Dotknij gornego paska, aby przejsc do klimatyzacji"
        );
      }

      /*
       * STRONA 2 - KLIMATYZACJA
       */

      else {

        it.print(
          400,
          95,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "KLIMATYZACJA ROTENSO"
        );

        /*
         * MINUS
         */

        it.filled_rectangle(
          500,
          180,
          130,
          90,
          Color(45, 85, 135)
        );

        it.print(
          565,
          195,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "-"
        );

        /*
         * TEMPERATURA
         */

        it.filled_rectangle(
          630,
          180,
          130,
          90,
          Color(25, 35, 48)
        );

        it.printf(
          695,
          205,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "%.0f C",
          id(temperatura_klimy)
        );

        /*
         * PLUS
         */

        it.filled_rectangle(
          760,
          180,
          40,
          90,
          Color(45, 135, 80)
        );

        it.print(
          780,
          195,
          id(font_srednia),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "+"
        );

        /*
         * DUŻY ŚRODKOWY ODCZYT
         */

        it.printf(
          300,
          185,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "%.0f C",
          id(temperatura_klimy)
        );

        it.print(
          300,
          250,
          id(font_mala),
          Color(170, 195, 220),
          TextAlign::TOP_CENTER,
          "USTAWIONA TEMPERATURA"
        );

        it.print(
          400,
          350,
          id(font_mala),
          Color(110, 140, 170),
          TextAlign::TOP_CENTER,
          "Dotknij gornego paska, aby wrocic do rolet"
        );
      }

touchscreen:

  - platform: gt911

    id: my_touch

    i2c_id: bus_i2c

    address: 0x5D

    interrupt_pin:
      number: GPIO4

    reset_pin:
      ch422g: io_ex
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      then:

        - lambda: |-
            int x = touch.x;
            int y = touch.y;

            /*
             * GÓRNY PASEK
             * przełączanie stron
             */

            if (y >= 0 && y <= 70) {

              if (id(aktualna_strona) == 0) {
                id(aktualna_strona) = 1;
              } else {
                id(aktualna_strona) = 0;
              }

              return;
            }

            /*
             * STRONA 1 - ROLETY
             */

            if (id(aktualna_strona) == 0) {

              if (
                y >= 180 &&
                y <= 250 &&
                x >= 40 &&
                x <= 170
              ) {
                id(akcja_otworz_roleta).execute();
              }

              else if (
                y >= 180 &&
                y <= 250 &&
                x >= 190 &&
                x <= 320
              ) {
                id(akcja_stop_roleta).execute();
              }

              else if (
                y >= 180 &&
                y <= 250 &&
                x >= 340 &&
                x <= 470
              ) {
                id(akcja_zamknij_roleta).execute();
              }
            }

            /*
             * STRONA 2 - KLIMATYZACJA
             */

            else {

              if (
                y >= 180 &&
                y <= 270 &&
                x >= 500 &&
                x <= 630
              ) {
                id(akcja_klima_down).execute();
              }

              else if (
                y >= 180 &&
                y <= 270 &&
                x >= 730 &&
                x <= 800
              ) {
                id(akcja_klima_up).execute();
              }
            }