esphome:
  name: waveshare-dashboard
  friendly_name: Waveshare 4.3 Dashboard

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:


# ============================================================
# ZMIENNE GLOBALNE (STAN STRONY)
# ============================================================

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'


# ============================================================
# CH422G - ekspander GPIO znajdujący się na płytce Waveshare
# ============================================================

ch422g:
  - id: ch422g_hub


# ============================================================
# I2C - GT911 + CH422G
# GPIO 8 = SDA
# GPIO 9 = SCL
# ============================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz


# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: zegar
    timezone: Europe/Warsaw


# ============================================================
# CZCIONKI (z obsługą polskich znaków)
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZęąśżźćńłóĘĄŚŻŹĆŃŁÓ0123456789°.,:-/_ "

  - file: "gfonts://Roboto"
    id: font_medium
    size: 26
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZęąśżźćńłóĘĄŚŻŹĆŃŁÓ0123456789°.,:-/_ "

  - file: "gfonts://Roboto"
    id: font_large
    size: 48
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZęąśżźćńłóĘĄŚŻŹĆŃŁÓ0123456789°.,:-/_ "

  - file: "gfonts://Roboto"
    id: font_title
    size: 30
    glyphs: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZęąśżźćńłóĘĄŚŻŹĆŃŁÓ0123456789°.,:-/_ "


# ============================================================
# SENSORY POGODOWE (OPENWEATHERMAP)
# ============================================================

sensor:
  - platform: openweathermap
    api_key: "TUTAJ_WPISZ_SWOJ_DARMOWY_KLUCZ_API"
    latitude: 54.6056
    longitude: 18.2475
    update_interval: 15min
    temperature:
      id: zew_temp
      name: "Temperatura Zewnętrzna"
    humidity:
      id: zew_wilg
      name: "Wilgotność Zewnętrzna"


# ============================================================
# WYŚWIETLACZ 800x480 (OBSŁUGA STRON)
# ============================================================

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran

    rotation: 0

    update_interval: 1s

    lambda: |-

      // ------------------------------------------------------
      // TŁO WSPÓLNE
      // ------------------------------------------------------
      it.fill(Color(15, 18, 24));

      // ------------------------------------------------------
      // GÓRNY PANEL (WSPÓLNY)
      // ------------------------------------------------------
      it.filled_rectangle(0, 0, 800, 75, Color(25, 30, 40));

      if (id(aktualna_strona) == 0) {
        it.print(20, 20, id(font_title), Color(255, 255, 255), "SMART HOME (STRONA 1/2)");
      } else {
        it.print(20, 20, id(font_title), Color(100, 200, 255), "DRUGI EKRAN (STRONA 2/2)");
      }

      // Zegar
      auto now = id(zegar).now();
      if (now.is_valid()) {
        it.printf(780, 14, id(font_large), Color(255, 255, 255), TextAlign::TOP_RIGHT, "%02d:%02d", now.hour, now.minute);
      } else {
        it.print(780, 20, id(font_medium), Color(255, 255, 255), TextAlign::TOP_RIGHT, "--:--");
      }


      // ======================================================
      // RENDEROWANIE ZAWARTOŚCI ZALEŻNIE OD STRONY
      // ======================================================
      if (id(aktualna_strona) == 0) {
        
        // --- STRONA 0: GŁÓWNA ---

        // Linie podziału
        it.filled_rectangle(399, 75, 401, 480, Color(70, 75, 85));
        it.filled_rectangle(0, 300, 800, 302, Color(70, 75, 85));

        // Lewa góra - Rolety
        it.print(200, 95, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "ROLETY OKIENNE");

        it.filled_rectangle(25, 150, 130, 210, Color(40, 45, 55));
        it.print(77, 165, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "GÓRA");

        it.filled_rectangle(145, 150, 250, 210, Color(40, 45, 55));
        it.print(197, 165, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "STOP");

        it.filled_rectangle(265, 150, 370, 210, Color(40, 45, 55));
        it.print(317, 165, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "DÓŁ");

        it.print(200, 235, id(font_small), Color(150, 160, 175), TextAlign::TOP_CENTER, "STEROWANIE ROLETAMI");

        // Prawa góra - Klimatyzacja
        it.print(600, 95, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "ROTENSO");
        it.print(600, 130, id(font_title), Color(100, 200, 255), TextAlign::TOP_CENTER, "KLIMATYZACJA");

        it.filled_rectangle(440, 170, 560, 230, Color(40, 45, 55));
        it.print(500, 184, id(font_small), Color(255, 255, 255), TextAlign::TOP_CENTER, "ON / OFF");

        it.filled_rectangle(580, 170, 760, 230, Color(40, 45, 55));
        it.print(670, 184, id(font_small), Color(255, 255, 255), TextAlign::TOP_CENTER, "TRYB");

        it.print(600, 255, id(font_small), Color(150, 160, 175), TextAlign::TOP_CENTER, "STATUS: GOTOWA");

        // Lewy dół - Pogoda z internetu
        it.print(200, 325, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "POGODA INTERNET");

        if (id(zew_temp).has_state()) {
          it.printf(110, 385, id(font_large), Color(255, 180, 80), TextAlign::TOP_CENTER, "%.1f°C", id(zew_temp).state);
        } else {
          it.print(110, 395, id(font_medium), Color(150, 150, 150), TextAlign::TOP_CENTER, "--.-°C");
        }

        if (id(zew_wilg).has_state()) {
          it.printf(285, 395, id(font_medium), Color(100, 200, 255), TextAlign::TOP_CENTER, "%.0f%% RH", id(zew_wilg).state);
        } else {
          it.print(285, 395, id(font_medium), Color(150, 150, 150), TextAlign::TOP_CENTER, "--%");
        }

        // Prawy dół - Status systemu
        it.print(600, 325, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "STATUS SYSTEMU");
        it.print(600, 375, id(font_medium), Color(100, 255, 130), TextAlign::TOP_CENTER, "ESP32 ONLINE");
        it.print(600, 420, id(font_small), Color(160, 170, 180), TextAlign::TOP_CENTER, "Dotknij góry, aby zmienić stronę");

      } else {

        // --- STRONA 1: DRUGI EKRAN ---
        it.print(400, 150, id(font_title), Color(255, 255, 255), TextAlign::TOP_CENTER, "DRUGI KAFELEK / EKRAN");
        it.print(400, 220, id(font_medium), Color(200, 200, 200), TextAlign::TOP_CENTER, "Tutaj możesz dodać inne urządzenia lub opcje");
        
        // Przycisk powrotu na stronę główną
        it.filled_rectangle(300, 320, 500, 390, Color(40, 50, 70));
        it.print(400, 335, id(font_medium), Color(255, 255, 255), TextAlign::TOP_CENTER, "POWRÓT DO STRONY 1");
      }


# ============================================================
# GT911 - PANEL DOTYKOWY
# ============================================================

touchscreen:
  - platform: gt911

    id: dotyk

    display: ekran

    i2c_id: bus_a

    address: 0x5D

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    update_interval: 50ms


# ============================================================
# PRZYCISKI DOTYKOWE (STEROWANIE STRONAMI I URZĄDZENIAMI)
# ============================================================

binary_sensor:

  # Przycisk zmiany strony (kliknięcie w górny pasek nagłówka)
  - platform: touchscreen
    name: "Zmień Stronę"
    id: zmiana_strony
    x_min: 0
    x_max: 800
    y_min: 0
    y_max: 75
    on_press:
      - lambda: |-
          if (id(aktualna_strona) == 0) {
            id(aktualna_strona) = 1;
          } else {
            id(aktualna_strona) = 0;
          }
          // Wymuś natychmiastowe odświeżenie ekranu
          id(ekran).schedule_update();


  # --- PRZYCISKI DLA STRONY 0 ---
  - platform: touchscreen
    name: "Roleta Góra"
    id: roleta_gora
    x_min: 25
    x_max: 130
    y_min: 150
    y_max: 210
    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY GÓRA"
          level: INFO

  - platform: touchscreen
    name: "Roleta Stop"
    id: roleta_stop
    x_min: 145
    x_max: 250
    y_min: 150
    y_max: 210
    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY STOP"
          level: INFO

  - platform: touchscreen
    name: "Roleta Dół"
    id: roleta_dol
    x_min: 265
    x_max: 370
    y_min: 150
    y_max: 210
    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY DÓŁ"
          level: INFO

  - platform: touchscreen
    name: "Klimatyzacja"
    id: klimatyzacja
    x_min: 440
    x_max: 560
    y_min: 170
    y_max: 230
    on_press:
      - logger.log:
          format: "Naciśnięto KLIMATYZACJA"

  - platform: touchscreen
    name: "Tryb klimatyzacji"
    id: tryb_klimatyzacji
    x_min: 580
    x_max: 760
    y_min: 170
    y_max: 230
    on_press:
      - logger.log:
          format: "Naciśnięto TRYB KLIMATYZACJI"
