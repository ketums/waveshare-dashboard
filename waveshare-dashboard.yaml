esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  timeout: 10s

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"
    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran_waveshare
    rotation: 0
    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-
      auto time_now = id(czas_sntp).now();

      // =====================================================
      // STRONA 3 - POGODA
      // =====================================================

      if (id(aktualna_strona) == 2) {

        it.fill(Color(13, 20, 36));

        it.rectangle(
          15, 15, 770, 450,
          Color(41, 58, 92)
        );

        it.print(
          40, 35,
          id(font_srednia),
          Color(148, 163, 184),
          TextAlign::TOP_LEFT,
          "Wejherowo - Stacja Pogody"
        );

        it.print(
          40, 80,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "18.5 °C"
        );

        it.print(
          40, 135,
          id(font_srednia),
          Color(56, 189, 248),
          TextAlign::TOP_LEFT,
          "Dynamiczna strefa opadow"
        );

        if (time_now.is_valid()) {

          it.strftime(
            760, 35,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::RIGHT,
            "%H:%M",
            time_now
          );

          it.strftime(
            760, 90,
            id(font_mala),
            Color(148, 163, 184),
            TextAlign::RIGHT,
            "%A, %d %B %Y",
            time_now
          );

        } else {

          it.print(
            760, 35,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::RIGHT,
            "--:--"
          );
        }

        uint32_t ms = millis();

        float angle =
          (ms % 8000) *
          (2.0 * 3.14159265 / 8000.0);

        int cx = 520;
        int cy = 250;

        for (int i = 0; i < 10; i++) {

          float a =
            angle +
            i * (2.0 * 3.14159265 / 10.0);

          int x1 =
            cx + 32.0 * cosf(a);

          int y1 =
            cy + 32.0 * sinf(a);

          int x2 =
            cx + 50.0 * cosf(a);

          int y2 =
            cy + 50.0 * sinf(a);

          it.line(
            x1,
            y1,
            x2,
            y2,
            Color(255, 170, 0)
          );
        }

        it.filled_circle(
          cx,
          cy,
          26,
          Color(255, 204, 0)
        );

        it.filled_circle(
          cx - 4,
          cy - 4,
          18,
          Color(255, 235, 100)
        );

        int cloud_x = 540;
        int cloud_y = 265;

        it.filled_circle(
          cloud_x - 65,
          cloud_y + 15,
          36,
          Color(120, 140, 175)
        );

        it.filled_circle(
          cloud_x - 15,
          cloud_y - 5,
          50,
          Color(160, 185, 215)
        );

        it.filled_circle(
          cloud_x + 45,
          cloud_y + 10,
          42,
          Color(120, 140, 175)
        );

        it.filled_circle(
          cloud_x + 15,
          cloud_y + 15,
          35,
          Color(200, 220, 240)
        );

        it.filled_rectangle(
          cloud_x - 70,
          cloud_y + 15,
          130,
          40,
          Color(160, 185, 215)
        );

        for (int i = 0; i < 85; i++) {

          int drop_x =
            70 + (i * 13 + i * 7) % 680;

          int speed =
            18 + (i % 7) * 5;

          int drop_y =
            (ms * speed / 28 + i * 27)
            % 230 + 200;

          Color drop_color =
            (i % 3 == 0)
              ? Color(56, 189, 248)
              : ((i % 3 == 1)
                  ? Color(125, 211, 252)
                  : Color(30, 144, 255));

          it.line(
            drop_x,
            drop_y,
            drop_x - 3,
            drop_y + 16,
            drop_color
          );
        }

        return;
      }

      // =====================================================
      // TLO GLOWNEGO DASHBOARDU
      // =====================================================

      it.fill(Color(18, 24, 38));

      it.rectangle(
        10, 10, 780, 460,
        Color(45, 55, 72)
      );

      it.line(
        10, 70,
        790, 70,
        Color(45, 55, 72)
      );

      // =====================================================
      // NAGLOWEK
      // =====================================================

      it.print(
        25, 20,
        id(font_srednia),
        Color(200, 210, 225),
        TextAlign::TOP_LEFT,
        "DASHBOARD"
      );

      if (id(wifi_ssid).has_state()) {

        it.print(
          285, 18,
          id(font_srednia),
          Color(72, 187, 120),
          TextAlign::TOP_LEFT,
          "WIFI OK"
        );

      } else {

        it.print(
          285, 18,
          id(font_srednia),
          Color(229, 62, 62),
          TextAlign::TOP_LEFT,
          "WIFI OFF"
        );
      }

      if (!isnan(id(wifi_sila).state)) {

        it.printf(
          390, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_LEFT,
          "%0.0f dBm",
          id(wifi_sila).state
        );

      } else {

        it.print(
          390, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_LEFT,
          "-- dBm"
        );
      }

      if (id(wifi_ip).has_state()) {

        it.printf(
          770, 20,
          id(font_mala),
          Color(90, 200, 250),
          TextAlign::TOP_RIGHT,
          "%s",
          id(wifi_ip).state.c_str()
        );

      } else {

        it.print(
          770, 20,
          id(font_mala),
          Color(180, 190, 205),
          TextAlign::TOP_RIGHT,
          "brak IP"
        );
      }

      // =====================================================
      // STRONA 1
      // =====================================================

      if (id(aktualna_strona) == 0) {

        it.line(
          400, 70,
          400, 470,
          Color(45, 55, 72)
        );

        it.line(
          10, 270,
          790, 270,
          Color(45, 55, 72)
        );

        it.print(
          770, 75,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_RIGHT,
          "STRONA 1/3"
        );

        // ===================================================
        // ROLETY
        // ===================================================

        it.print(
          30, 90,
          id(font_srednia),
          Color(237, 137, 54),
          TextAlign::TOP_LEFT,
          "ROLETY OKIENNE"
        );

        it.print(
          30, 130,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "okno 1 & okno 2"
        );

        it.rectangle(
          30, 170,
          100, 50,
          Color(66, 153, 225)
        );

        it.print(
          80, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "OTWORZ"
        );

        it.rectangle(
          140, 170,
          100, 50,
          Color(229, 62, 62)
        );

        it.print(
          190, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STOP"
        );

        it.rectangle(
          250, 170,
          100, 50,
          Color(66, 153, 225)
        );

        it.print(
          300, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ZAMKNIJ"
        );

        // ===================================================
        // KLIMATYZACJA
        // ===================================================

        it.print(
          430, 90,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_LEFT,
          "KLIMATYZACJA"
        );

        it.print(
          430, 120,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "ROTENSO"
        );

        it.rectangle(
          430, 170,
          60, 50,
          Color(66, 153, 225)
        );

        it.print(
          460, 177,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "-"
        );

        it.print(
          535, 175,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "22°C"
        );

        it.rectangle(
          580, 170,
          60, 50,
          Color(229, 62, 62)
        );

        it.print(
          610, 177,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "+"
        );

        // ===================================================
        // CZUJNIK ZIGBEE
        // ===================================================

        it.print(
          30, 290,
          id(font_srednia),
          Color(72, 187, 120),
          TextAlign::TOP_LEFT,
          "CZUJNIK ZIGBEE"
        );

        it.print(
          30, 340,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "21.5 °C"
        );

        it.print(
          30, 400,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "Wilgotnosc: 55%"
        );

        // ===================================================
        // OGRZEWANIE
        // ===================================================

        it.rectangle(
          420, 285,
          360, 175,
          Color(45, 55, 72)
        );

        it.print(
          440, 295,
          id(font_srednia),
          Color(255, 170, 60),
          TextAlign::TOP_LEFT,
          "OGRZEWANIE"
        );

        it.print(
          440, 325,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "TERMOSTAT"
        );

        // ===================================================
        // GLOWICA TERMOSTATYCZNA
        // ===================================================

        // metalowa podstawa

        it.filled_rectangle(
          560, 405,
          120, 15,
          Color(170, 175, 180)
        );

        // zabki podstawy

        for (int i = 0; i < 12; i++) {

          it.filled_rectangle(
            562 + i * 9,
            420,
            6,
            8,
            Color(125, 130, 135)
          );
        }

        // dolny pierscien

        it.filled_rectangle(
          555, 395,
          130, 22,
          Color(205, 208, 210)
        );

        // bialy korpus

        it.filled_rectangle(
          565, 335,
          110, 70,
          Color(240, 242, 244)
        );

        // zaokraglenie korpusu

        it.filled_circle(
          565, 370,
          35,
          Color(240, 242, 244)
        );

        it.filled_circle(
          675, 370,
          35,
