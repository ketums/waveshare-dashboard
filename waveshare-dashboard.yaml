esphome:
  name: esp32-s3-display
  friendly_name: ESP32-S3 Panel Pogodowy

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESP32-S3 Fallback Hotspot"
    password: "fallbackpassword"

captive_portal:

# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: time_now
    servers:
      - "pl.pool.ntp.org"
    timezone: Europe/Warsaw

# ============================================================
# HTTP - OPEN-METEO
# ============================================================

http_request:
  useragent: "ESPHome ESP32-S3 Panel Pogodowy"
  timeout: 10s

# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub

# ============================================================
# I2C
# ============================================================

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

# ============================================================
# ZMIENNE
# ============================================================

globals:

  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '2'

  - id: weather_condition_code
    type: int
    restore_value: no
    initial_value: '0'

# ============================================================
# CZUJNIKI
# ============================================================

sensor:

  - platform: template
    name: "Temperatura Zewnętrzna"
    id: weather_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "Kod Pogody WMO"
    id: weather_code_sensor
    accuracy_decimals: 0

    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              id(weather_condition_code) = (int)x;
            }

  - platform: wifi_signal
    name: "Siła WiFi"
    id: wifi_signal_db
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

# ============================================================
# INFORMACJE O WI-FI
# ============================================================

text_sensor:

  - platform: wifi_info

    ip_address:
      name: "Adres IP panelu"
      id: wifi_ip

    ssid:
      name: "Sieć WiFi"
      id: wifi_ssid

# ============================================================
# POGODA - OPEN-METEO
# WEJHEROWO
# ============================================================

interval:

  - interval: 15min
    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60&longitude=18.25&current=temperature_2m,weather_code"

          on_response:
            then:

              - lambda: |-
                  json::parse_json(response->body, [](JsonObject root) {

                    if (root["current"]["temperature_2m"].is<float>()) {

                      float temp =
                        root["current"]["temperature_2m"].as<float>();

                      int code =
                        root["current"]["weather_code"].as<int>();

                      id(weather_temp_sensor).publish_state(temp);

                      id(weather_code_sensor).publish_state(code);
                    }
                  });

# ============================================================
# CZCIONKA ROBOTO
# POLSKIE ZNAKI
# ============================================================

font:

  - file: "Roboto-Regular.ttf"
    id: font_mala
    size: 14
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "Roboto-Regular.ttf"
    id: font_srednia
    size: 20
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "Roboto-Regular.ttf"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

# ============================================================
# WYŚWIETLACZ WAVESHARE ESP32-S3 TOUCH LCD 4.3
# 800 x 480
# ============================================================

display:

  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3

    id: my_display

    rotation: 0

    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    enable_pin:
      ch422g: ch422g_hub
      number: 2

    color_order: RGB

    lambda: |-

      // ======================================================
      // TŁO
      // ======================================================

      it.fill(Color(11, 15, 25));

      // ======================================================
      // KARTA 3D
      // ======================================================

      it.filled_rectangle(
        122,
        62,
        556,
        360,
        Color(4, 7, 13)
      );

      it.filled_rectangle(
        120,
        58,
        556,
        360,
        Color(30, 41, 59)
      );

      it.rectangle(
        120,
        58,
        556,
        360,
        Color(71, 85, 105)
      );

      it.rectangle(
        122,
        60,
        552,
        356,
        Color(15, 23, 42)
      );

      // ======================================================
      // DATA
      // ======================================================

      if (id(time_now).is_valid()) {

        it.strftime(
          400,
          85,
          id(font_srednia),
          Color(148, 163, 184),
          TextAlign::TOP_CENTER,
          "%A, %d %B %Y",
          id(time_now).now()
        );

        // ====================================================
        // ZEGAR
        // ====================================================

        it.strftime(
          400,
          125,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "%H:%M",
          id(time_now).now()
        );

      } else {

        it.print(
          400,
          125,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "--:--"
        );
      }

      // ======================================================
      // KIESZEŃ TEMPERATURY
      // ======================================================

      it.filled_rectangle(
        200,
        235,
        400,
        95,
        Color(15, 23, 42)
      );

      it.rectangle(
        200,
        235,
        400,
        95,
        Color(51, 65, 85)
      );

      // ======================================================
      // TEMPERATURA
      // ======================================================

      if (!isnan(id(weather_temp_sensor).state)) {

        it.printf(
          400,
          245,
          id(font_duza),
          Color(56, 189, 248),
          TextAlign::TOP_CENTER,
          "%.1f °C",
          id(weather_temp_sensor).state
        );

      } else {

        it.print(
          400,
          245,
          id(font_duza),
          Color(56, 189, 248),
          TextAlign::TOP_CENTER,
          "--.- °C"
        );
      }

      // ======================================================
      // LOKALIZACJA
      // ======================================================

      it.print(
        400,
        350,
        id(font_srednia),
        Color(203, 213, 225),
        TextAlign::TOP_CENTER,
        "Wejherowo - Warunki zewnętrzne"
      );

      // ======================================================
      // SIŁA WI-FI
      // ======================================================

      if (id(wifi_signal_db).has_state()) {

        it.printf(
          400,
          390,
          id(font_mala),
          Color(148, 163, 184),
          TextAlign::TOP_CENTER,
          "WiFi: %.0f dBm",
          id(wifi_signal_db).state
        );

      } else {

        it.print(
          400,
          390,
          id(font_mala),
          Color(148, 163, 184),
          TextAlign::TOP_CENTER,
          "WiFi: -- dBm"
        );
      }

      // ======================================================
      // DOLNY NAPIS
      // ======================================================

      it.print(
        400,
        440,
        id(font_mala),
        Color(100, 116, 139),
        TextAlign::TOP_CENTER,
        "Panel pogodowy ESP32-S3"
      );

# ============================================================
# DOTYK GT911
# ============================================================

touchscreen:

  - platform: gt911

    id: panel_dotykowy

    i2c_id: bus_i2c

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:

      - lambda: |-

          ESP_LOGI(
            "touch",
            "Dotyk X=%d Y=%d",
            touch.x,
            touch.y
          );