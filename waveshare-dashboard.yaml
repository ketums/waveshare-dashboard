esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

# =========================================================
# I2C
# =========================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

# =========================================================
# CH422G
# =========================================================

ch422g:
  - id: io_ex

# =========================================================
# CZAS
# =========================================================

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# =========================================================
# INTERNET / POGODA
# =========================================================

http_request:
  id: klient_http
  useragent: "ESPHome Waveshare Weather"
  timeout: 10s
  follow_redirects: true

# =========================================================
# ZMIENNE POGODOWE
# =========================================================

globals:

  - id: temperatura
    type: float
    restore_value: no
    initial_value: "0"

  - id: odczuwalna
    type: float
    restore_value: no
    initial_value: "0"

  - id: wilgotnosc
    type: float
    restore_value: no
    initial_value: "0"

  - id: wiatr
    type: float
    restore_value: no
    initial_value: "0"

  - id: cisnienie
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: "2"

  - id: klatka
    type: int
    restore_value: no
    initial_value: "0"

# =========================================================
# ANIMACJA + POBIERANIE POGODY
# =========================================================

interval:

  - interval: 100ms
    then:
      - lambda: |-
          id(klatka)++;

          if (id(klatka) > 100000) {
            id(klatka) = 0;
          }

  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6050&longitude=18.2356&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 8192

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject current = root["current"];

                          if (current.isNull()) {
                            return false;
                          }

                          id(temperatura) =
                            current["temperature_2m"].as<float>();

                          id(odczuwalna) =
                            current["apparent_temperature"].as<float>();

                          id(wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(cisnienie) =
                            current["pressure_msl"].as<float>();

                          id(kod_pogody) =
                            current["weather_code"].as<int>();

                          return true;
                        });

# =========================================================
# EKRAN WAVESHARE
# 800 x 480
# =========================================================

display:

  - platform: rpi_dpi_rgb

    id: ekran

    update_interval: 100ms

    auto_clear_enabled: true

    color_order: RGB

    # WAŻNE:
    # parametry dobrane dla tego panelu

    pclk_frequency: 14MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7

    pclk_inverted: false

    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:

      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      const int f = id(klatka);
      const int kod = id(kod_pogody);

      auto now = id(czas).now();

      bool noc = false;

      if (now.is_valid()) {
        noc = (now.hour >= 20 || now.hour < 6);
      }

      // =====================================================
      // NIEBO
      // =====================================================

      Color gora;
      Color dol;

      if (noc) {

        gora = Color(5, 10, 35);
        dol = Color(35, 55, 95);

      } else {

        gora = Color(35, 120, 195);
        dol = Color(180, 220, 240);
      }

      for (int y = 0; y < 360; y += 8) {

        float p = (float)y / 360.0f;

        int r =
          gora.r +
          (dol.r - gora.r) * p;

        int g =
          gora.g +
          (dol.g - gora.g) * p;

        int b =
          gora.b +
          (dol.b - gora.b) * p;

        it.filled_rectangle(
          0,
          y,
          800,
          8,
          Color(r, g, b)
        );
      }

      // =====================================================
      // GWIAZDY
      // =====================================================

      if (noc) {

        for (int i = 0; i < 30; i++) {

          int x =
            (i * 97 + 20) % 790;

          int y =
            (i * 43 + 15) % 210;

          if (((f + i * 13) % 50) < 35) {

            it.filled_circle(
              x,
              y,
              1 + (i % 2),
              Color(235, 240, 255)
            );
          }
        }
      }

      // =====================================================
      // SŁOŃCE / KSIĘŻYC
      // =====================================================

      if (noc) {

        it.filled_circle(
          145,
          100,
          45,
          Color(240, 240, 215)
        );

        it.filled_circle(
          165,
          85,
          45,
          gora
        );

      } else {

        int puls =
          5 + ((f / 4) % 8);

        it.filled_circle(
          150,
          105,
          55 + puls,
          Color(255, 190, 50)
        );

        it.filled_circle(
          150,
          105,
          44,
          Color(255, 220, 75)
        );

        it.filled_circle(
          140,
          95,
          27,
          Color(255, 240, 130)
        );
      }

      // =====================================================
      // CHMURY
      // =====================================================

      int ruch =
        (f / 3) % 900;

      for (int i = 0; i < 5; i++) {

        int x =
          i * 190 -
          ruch / 4;

        int y =
          135 +
          (i % 2) * 30;

        Color chmura =
          noc
          ? Color(80, 95, 120)
          : Color(210, 225, 238);

        it.filled_circle(
          x,
          y,
          25,
          chmura
        );

        it.filled_circle(
          x + 28,
          y - 13,
          33,
          chmura
        );

        it.filled_circle(
          x + 58,
          y,
          27,
          chmura
        );

        it.filled_rectangle(
          x - 5,
          y,
          68,
          24,
          chmura
        );
      }

      // =====================================================
      // DESZCZ
      // =====================================================

      bool deszcz =
        kod == 51 ||
        kod == 53 ||
        kod == 55 ||
        kod == 56 ||
        kod == 57 ||
        kod == 61 ||
        kod == 63 ||
        kod == 65 ||
        kod == 66 ||
        kod == 67 ||
        kod == 80 ||
        kod == 81 ||
        kod == 82;

      if (deszcz) {

        for (int i = 0; i < 55; i++) {

          int x =
            (i * 71 +
             f * (2 + i % 3)) % 800;

          int y =
            (i * 39 +
             f * 5) % 240;

          it.line(
            x,
            240 + y,
            x - 5,
            252 + y,
            Color(175, 225, 255)
          );
        }
      }

      // =====================================================
      // ŚNIEG
      // =====================================================

      bool snieg =
        kod == 71 ||
        kod == 73 ||
        kod == 75 ||
        kod == 77 ||
        kod == 85 ||
        kod == 86;

      if (snieg) {

        for (int i = 0; i < 45; i++) {

          int x =
            (i * 89 +
             f * (1 + i % 2)) % 800;

          int y =
            (i * 43 +
             f * 2) % 270;

          it.filled_circle(
            x,
            230 + y,
            2 + (i % 3),
            Color(250, 250, 255)
          );
        }
      }

      // =====================================================
      // BURZA
      // =====================================================

      bool burza =
        kod == 95 ||
        kod == 96 ||
        kod == 99;

      if (burza) {

        it.filled_rectangle(
          0,
          0,
          800,
          350,
          Color(45, 55, 75)
        );

        for (int i = 0; i < 4; i++) {

          int x = 50 + i * 210;

          it.filled_circle(
            x,
            165,
            48,
            Color(55, 60, 75)
          );

          it.filled_circle(
            x + 45,
            145,
            55,
            Color(60, 65, 80)
          );

          it.filled_circle(
            x + 95,
            165,
            45,
            Color(50, 55, 70)
          );
        }

        if ((f % 80) < 5) {

          it.line(
            425,
            190,
            400,
            245,
            Color(255, 245, 100)
          );

          it.line(
            400,
            245,
            430,
            235,
            Color(255, 245, 100)
          );

          it.line(
            430,
            235,
            405,
            300,
            Color(255, 245, 100)
          );
        }
      }

      // =====================================================
      // HORYZONT
      // =====================================================

      it.filled_rectangle(
        0,
        350,
        800,
        130,
        Color(10, 30, 35)
      );

      // góry / krajobraz

      for (int x = 0; x < 800; x += 45) {

        int h =
          25 +
          ((x * 17) % 45);

        it.filled_circle(
          x,
          380,
          h,
          Color(15, 48, 50)
        );
      }

      // woda

      it.filled_rectangle(
        0,
        410,
        800,
        70,
        Color(12, 50, 65)
      );

      // =====================================================
      // LEWY PANEL
      // =====================================================

      it.filled_rectangle(
        20,
        20,
        330,
        245,
        Color(0, 0, 0)
      );

      // =====================================================
      // PRAWY PANEL
      // =====================================================

      it.filled_rectangle(
        570,
        20,
        210,
        245,
        Color(0, 0, 0)
      );

      // =====================================================
      // DOLNY PANEL
      // =====================================================

      it.filled_rectangle(
        20,
        390,
        760,
        75,
        Color(0, 0, 0)
      );

      // =====================================================
      // MIASTO
      // =====================================================

      it.print(
        40,
        35,
        id(font_small),
        Color(255, 255, 255),
        "WEJHEROWO"
      );

      it.print(
        40,
        65,
        id(font_tiny),
        Color(205, 225, 240),
        "POGODA NA ZYWO"
      );

      // =====================================================
      // TEMPERATURA
      // =====================================================

      it.printf(
        45,
        105,
        id(font_temperature),
        Color(255, 255, 255),
        "%.1f",
        id(temperatura)
      );

      it.print(
        250,
        120,
        id(font_medium),
        Color(255, 230, 120),
        "°C"
      );

      // =====================================================
      // OPIS POGODY
      // =====================================================

      const char *opis =
        "Pochmurno";

      if (kod == 0)
        opis = "Bezchmurnie";

      else if (kod == 1)
        opis = "Glownie slonecznie";

      else if (kod == 2)
        opis = "Czesciowe zachmurzenie";

      else if (kod == 3)
        opis = "Pochmurno";

      else if (deszcz)
        opis = "Opady deszczu";

      else if (snieg)
        opis = "Opady sniegu";

      else if (burza)
        opis = "Burza";

      else if (kod == 45 || kod == 48)
        opis = "Mgla";

      it.print(
        48,
        175,
        id(font_description),
        Color(245, 250, 255),
        opis
      );

      // =====================================================
      // ZEGAR
      // =====================================================

      if (now.is_valid()) {

        it.strftime(
          760,
          40,
          id(font_clock),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%H:%M",
          now
        );

        it.strftime(
          760,
          110,
          id(font_date),
          Color(210, 225, 240),
          TextAlign::TOP_RIGHT,
          "%d.%m.%Y",
          now
        );
      }

      // =====================================================
      // INFORMACJE
      // =====================================================

      it.printf(
        590,
        150,
        id(font_info),
        Color(255, 255, 255),
        "ODCZUWALNA %.1f C",
        id(odczuwalna)
      );

      it.printf(
        590,
        178,
        id(font_info),
        Color(170, 225, 255),
        "WILGOTNOSC %.0f %%",
        id(wilgotnosc)
      );

      it.printf(
        590,
        206,
        id(font_info),
        Color(200, 240, 245),
        "WIATR %.0f km/h",
        id(wiatr)
      );

      it.printf(
        590,
        234,
        id(font_info),
        Color(220, 205, 255),
        "CISNIENIE %.0f hPa",
        id(cisnienie)
      );

      // =====================================================
      // DOLNY PASEK
      // =====================================================

      it.print(
        45,
        405,
        id(font_info),
        Color(255, 255, 255),
        "AKTUALNA POGODA"
      );

      it.print(
        45,
        435,
        id(font_tiny),
        Color(175, 205, 220),
        "Open-Meteo  •  aktualizacja co 10 minut"
      );

# =========================================================
# FONTY
# =========================================================

font:

  - file: "gfonts://Roboto"
    id: font_tiny
    size: 13
    bpp: 2

  - file: "gfonts://Roboto"
    id: font_small
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_medium
    size: 36
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_description
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_temperature
    size: 82
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_clock
    size: 66
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_date
    size: 23
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_info
    size: 16
    bpp: 2

# =========================================================
# DOTYK GT911
# =========================================================

touchscreen:

  - platform: gt911

    id: my_touch

    i2c_id: bus_i2c

    address: 0x5D

    interrupt_pin:
      number: GPIO4

    reset_pin:
      ch422g: io_ex
      number: 1
      mode:
        output: true