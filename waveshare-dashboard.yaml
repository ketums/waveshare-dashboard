            "POBIERANIE POGODY..."
          );

          it.print(
            400,
            220,
            id(font_mala),
            szary,
            TextAlign::TOP_CENTER,
            "Czekam na dane z internetu"
          );
        }
      }

touchscreen:
  - platform: gt911
    id: panel_dotykowy
    i2c_id: bus_i2c
    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      then:
        - lambda: |-
            if (touch.y <= 70) {
              id(aktualna_strona) =
                (id(aktualna_strona) + 1) % 2;
            }