esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_temperatura
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_kod
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_ok
    type: bool
    restore_value: no
    initial_value: 'false'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  id: klient_http
  timeout: 15s
  useragent: "ESPHome Waveshare Weather"

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"

    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

script:
  - id: pobierz_pogode
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6059&longitude=18.2356&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["current"]) {
                            return false;
                          }

                          JsonObject current = root["current"];

                          if (!current["temperature_2m"]) {
                            return false;
                          }

                          id(pogoda_temperatura) =
                            current["temperature_2m"].as<float>();

                          id(pogoda_wilgotnosc) =
                            current["relative_humidity_2m"].as<int>();

                          id(pogoda_wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(pogoda_kod) =
                            current["weather_code"].as<int>();

                          id(pogoda_ok) = true;

                          ESP_LOGI(
                            "POGODA",
                            "Wejherowo: %.1f C, wilgotnosc %d%%, wiatr %.1f km/h, kod %d",
                            id(pogoda_temperatura),
                            id(pogoda_wilgotnosc),
                            id(pogoda_wiatr),
                            id(pogoda_kod)
                          );

                          return true;
                        });
                  else:
                    - lambda: |-
                        id(pogoda_ok) = false;

                        ESP_LOGE(
                          "POGODA",
                          "HTTP error: %d",
                          response->status_code
                        );

          on_error:
            then:
              - lambda: |-
                  id(pogoda_ok) = false;

                  ESP_LOGE(
                    "POGODA",
                    "Nie udalo sie pobrac danych pogodowych"
                  );

interval:
  - interval: 10min
    then:
      - script.execute: pobierz_pogode

