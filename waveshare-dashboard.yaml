esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

builder: esp-idf

wifi:
  ssid: skrapi 2,4GHZ
  password: RejtanA77

  ap:
    ssid: "ESPTest"
    password: "Password123"

api:

ota:
  - platform: esphome

# 1. Magistrala I2C dla panelu dotykowego GT911
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true
  id: bus_i2c

# 2. Obsługa dotyku GT911 z mapowaniem przycisków dla 1024x600 px
touchscreen:
  platform: gt911
  id: panel_dotykowy
  i2c_id: bus_i2c
  interrupt_pin: GPIO0
  reset_pin: GPIO38
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

  on_touch:
    - lambda: |-
        int x = touch.x;
        int y = touch.y;
        
        // --- ROLETY OKIENNE (Lewy Górny Kafelek) ---
        if (y >= 180 && y <= 250) {
          if (x >= 40 && x <= 170) {
            ESP_LOGI("TOUCH", "Naciśnięto: OTWÓRZ OKNA");
            id(http_otworz_roleta).send();
          }
          else if (x >= 190 && x <= 320) {
            ESP_LOGI("TOUCH", "Naciśnięto: STOP ROLETY");
            id(http_stop_roleta).send();
          }
          else if (x >= 340 && x <= 470) {
            ESP_LOGI("TOUCH", "Naciśnięto: ZAMKNIJ OKNA");
            id(http_zamknij_roleta).send();
          }
        }

        // --- KLIMATYZACJA ROTENSO (Prawy Górny Kafelek) ---
        if (y >= 180 && y <= 250) {
          if (x >= 550 && x <= 630) {
            ESP_LOGI("TOUCH", "Naciśnięto: TEMP -");
            id(http_klima_temp_down).send();
          }
          else if (x >= 750 && x <= 830) {
            ESP_LOGI("TOUCH", "Naciśnięto: TEMP +");
            id(http_klima_temp_up).send();
          }
        }

# 3. Zgłoszenia HTTP do OpenAPI Tuya / Smart Life
http_request:
  id: klient_http
  useragent: "ESPHome Waveshare"
  timeout: 5s

http_request.post:
  - id: http_otworz_roleta
    url: "https://openapi.tuyaeu.com/v1.0/token"
  - id: http_stop_roleta
    url: "https://openapi.tuyaeu.com/v1.0/token"
  - id: http_zamknij_roleta
    url: "https://openapi.tuyaeu.com/v1.0/token"
  - id: http_klima_temp_down
    url: "https://openapi.tuyaeu.com/v1.0/token"
  - id: http_klima_temp_up
    url: "https://openapi.tuyaeu.com/v1.0/token"

# Czcionki
font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
  - file: "gfonts://Roboto"
    id: font_mala
    size: 16

# Czas z serwera NTP
time:
  - platform: sntp
    id: czas_sntp
    timezone: "Europe/Warsaw"

# 4. Wyświetlacz LCD dopasowany do 1024x600 px
display:
  - platform: esp32_lcd
    id: ekran_waveshare
    dimensions:
      width: 1024
      height: 600
    col_max: 1024
    row_max: 600
    color_order: RGB
    data_rate: 16MHz
    lambda: |-
      it.fill(Color(18, 24, 38));

      // Ramka główna i linie podziału kafelków
      it.rectangle(10, 10, 1004, 580, Color(45, 55, 72));
      it.line(10, 80, 1014, 80, Color(45, 55, 72));
      it.line(512, 80, 512, 590, Color(45, 55, 72));
      it.line(10, 335, 1014, 335, Color(45, 55, 72));

      // Zegar i status
      auto time_now = id(czas_sntp).now();
      if (time_now.is_valid()) {
        it.strftime(40, 20, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, "%H:%M", time_now);
      }
      it.print(984, 30, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_RIGHT, "Smart Life OK");

      // ROLETY OKIENNE
      it.print(40, 100, id(font_srednia), Color(237, 137, 54), TextAlign::TOP_LEFT, "ROLETY OKIENNE");
      it.print(40, 140, id(font_mala), Color(160, 174, 192), TextAlign::TOP_LEFT, "okno 1 & okno 2");
      
      it.rectangle(40, 180, 130, 70, Color(66, 153, 225));
      it.print(105, 200, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "OTWÓRZ");
      
      it.rectangle(190, 180, 130, 70, Color(229, 62, 62));
      it.print(255, 200, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "STOP");
      
      it.rectangle(340, 180, 130, 70, Color(66, 153, 225));
      it.print(405, 200, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "ZAMKNIJ");

      // KLIMATYZACJA ROTENSO
      it.print(550, 100, id(font_srednia), Color(90, 200, 250), TextAlign::TOP_LEFT, "KLIMATYZACJA ROTENSO");
      
      it.rectangle(550, 180, 80, 70, Color(66, 153, 225));
      it.print(590, 190, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "-");
      
      it.print(690, 190, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "22°C");
      
      it.rectangle(750, 180, 80, 70, Color(229, 62, 62));
      it.print(790, 190, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "+");

      // CZUJNIK ZIGBEE
      it.print(40, 360, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_LEFT, "CZUJNIK ZIGBEE");
      it.print(40, 420, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, "21.5 °C");
      it.print(40, 490, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, "Wilgotność: 55%");
