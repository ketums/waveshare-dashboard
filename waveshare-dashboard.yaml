esphome:
  name: esp32-s3-display
  friendly_name: ESP32-S3 Panel Pogodowy

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

# Konfiguracja Wi-Fi (uzupełnij swoje dane)
wifi:
  ssid: "TWOJE_SSID"
  password: "TWOJE_HASLO"

  ap:
    ssid: "ESP32-S3 Fallback Hotspot"
    password: "fallbackpassword"

captive_portal:

api:
  encryption:
    key: "GENEROWANY_KLUCZ_API"

ota:
  - platform: esphome

# Pobieranie czasu sieciowego (SNTP)
time:
  - platform: sntp
    id: time_now
    server: "pl.pool.ntp.org"
    timezone: "Europe/Warsaw"

# Klient HTTP do komunikacji z API pogody
http_request:
  user_agent: esphome/device
  timeout: 10s

# Zmienne globalne stanu urządzenia
globals:
  - id: aktualna_strona
    type: int
    restore_value: false
    initial_value: '2' # Ustawione domyślnie na stronę 3 (indeks 2) do testów
  - id: weather_condition_code
    type: int
    restore_value: false
    initial_value: '0'

# Sensory przechowujące dane z Open-Meteo
sensor:
  - platform: template
    name: "Temperatura Zewnętrzna"
    id: weather_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "Kod Pogody WMO"
    id: weather_code_sensor
    on_raw_value:
      then:
        - lambda: |-
            id(weather_condition_code) = round(id(weather_code_sensor).state);

# Cykliczne pobieranie danych pogodowych co 15 minut (dla Wejherowa: lat 54.60, lon 18.25)
interval:
  - interval: 15min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60&longitude=18.25&current=temperature_2m,weather_code"
          on_response:
            then:
              - lambda: |-
                  json::parse_json(response->body, [](JsonObject root) {
                    float temp = root["current"]["temperature_2m"];
                    int code = root["current"]["weather_code"];
                    id(weather_temp_sensor).publish_state(temp);
                    id(weather_code_sensor).publish_state(code);
                  });

# Czcionki (upewnij się, że pliki .ttf lub .font znajdują się w folderze projektu)
font:
  - file: "gothic.ttf"
    id: font_mala
    size: 14
  - file: "gothic.ttf"
    id: font_srednia
    size: 20
  - file: "gothic.ttf"
    id: font_duza
    size: 42

# Konfiguracja wyświetlacza (dla rozdzielczości 800x480)
display:
  - platform: ili9488 # (Zmień na swój sterownik ekranu, np. st7701 / rgb_panel w zależności od sprzętu)
    # Parametry fizyczne wyświetlacza
    dimensions:
      width: 800
      height: 480
    lambda: |-
      // ======================================================
      // STRONA 3 - PANEL 3D (EFEKT WYPUKŁEJ KARTY I GŁĘBI)
      // ======================================================

      if (id(aktualna_strona) == 2) {

        // 1. GŁĘBOKIE, ELEGANCKIE TŁO CAŁEGO EKRANU
        it.fill(Color(11, 15, 25));

        // 2. RYSOWANIE GŁĘBOKIEGO CIENIA KARTY 3D
        it.filled_rectangle(122, 62, 556, 360, Color(4, 7, 13));

        // 3. GŁÓWNA BRYŁA KARTY 3D (Wypukły panel w stylu Claymorphism)
        it.filled_rectangle(120, 58, 556, 360, Color(30, 41, 59)); // Jasny grafit

        // 4. EFEKT TRÓJWYMIAROWY - KRAWĘDZIE 
        it.rectangle(120, 58, 556, 360, Color(71, 85, 105)); // Górna/lewa krawędź (światło)
        it.rectangle(122, 60, 552, 356, Color(15, 23, 42));  // Ciemna krawędź wewnętrzna (cień)

        // 5. DATA NA GÓRZE KARTY
        if (time_now.is_valid()) {
          it.strftime(
            400, 85,
            id(font_srednia),
            Color(148, 163, 184),
            TextAlign::TOP_CENTER,
            "%A, %d %B %Y",
            time_now
          );

          // GIGANTYCZNY ZEGAR
          it.strftime(
            400, 125,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_CENTER,
            "%H:%M",
            time_now
          );
        } else {
          it.print(
            400, 125,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_CENTER,
            "--:--"
          );
        }

        // 6. WEWNĘTRZNA "WKLĘŚNIĘTA" KIESZONKA NA TEMPERATURĘ
        it.filled_rectangle(200, 235, 400, 95, Color(15, 23, 42)); // Wgłębienie
        it.rectangle(200, 235, 400, 95, Color(51, 65, 85));       // Obramowanie wgłębienia

        // AKTUALNA TEMPERATURA Z OPEN-METEO
        if (!isnan(id(weather_temp_sensor).state)) {
          it.printf(
            400, 245,
            id(font_duza),
            Color(56, 189, 248),
            TextAlign::TOP_CENTER,
            "%.1f °C",
            id(weather_temp_sensor).state
          );
        } else {
          it.print(
            400, 245,
            id(font_duza),
            Color(56, 189, 248),
            TextAlign::TOP_CENTER,
            "--.- °C"
          );
        }

        // 7. PODPIS LOKALIZACJI NA DOLE KARTY
        it.print(
          400, 350,
          id(font_srednia),
          Color(203, 213, 225),
          TextAlign::TOP_CENTER,
          "Wejherowo • Warunki zewnętrzne"
        );

        // 8. DOLNY KOMUNIKAT NA TLE EKRANU
        it.print(
          400, 440,
          id(font_mala),
          Color(100, 116, 139),
          TextAlign::TOP_CENTER,
          "Dotknij ekranu, aby wrócić do menu"
        );

        return; 
      }

      // Tutaj w przyszłości możesz dodać obsługę innych stron (np. id(aktualna_strona) == 0 lub 1)
      it.fill(Color(0, 0, 0));
      it.print(400, 240, id(font_srednia), Color(255, 255, 255), TextAlign::CENTER, "Strona główna sterowania");
