esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

# ============================================================
# I2C
# ============================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: io_ex

# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# ============================================================
# INTERNET
# ============================================================

http_request:
  id: klient_http
  useragent: "ESPHome Waveshare Weather"
  timeout: 10s
  follow_redirects: true

# ============================================================
# STRONA
# 0 = pierwsza
# 1 = druga
# 2 = TRZECIA - POGODA
# ============================================================

globals:

  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: "2"

  - id: temperatura
    type: float
    restore_value: no
    initial_value: "0"

  - id: odczuwalna
    type: float
    restore_value: no
    initial_value: "0"

  - id: wilgotnosc
    type: float
    restore_value: no
    initial_value: "0"

  - id: wiatr
    type: float
    restore_value: no
    initial_value: "0"

  - id: cisnienie
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: "2"

  - id: klatka
    type: int
    restore_value: no
    initial_value: "0"

  # Prognoza 5 dni
  - id: prognoza_1
    type: float
    restore_value: no
    initial_value: "0"

  - id: prognoza_2
    type: float
    restore_value: no
    initial_value: "0"

  - id: prognoza_3
    type: float
    restore_value: no
    initial_value: "0"

  - id: prognoza_4
    type: float
    restore_value: no
    initial_value: "0"

  - id: prognoza_5
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_1
    type: int
    restore_value: no
    initial_value: "0"

  - id: kod_2
    type: int
    restore_value: no
    initial_value: "0"

  - id: kod_3
    type: int
    restore_value: no
    initial_value: "0"

  - id: kod_4
    type: int
    restore_value: no
    initial_value: "0"

  - id: kod_5
    type: int
    restore_value: no
    initial_value: "0"

# ============================================================
# CZUJNIK WIFI
# ============================================================

sensor:

  - platform: wifi_signal
    name: "Siła WiFi"
    id: sila_wifi
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

# ============================================================
# INFORMACJE WIFI
# ============================================================

text_sensor:

  - platform: wifi_info

    ip_address:
      name: "Adres IP panelu"
      id: adres_ip

    ssid:
      name: "Sieć WiFi"
      id: nazwa_wifi

# ============================================================
# POBIERANIE POGODY
# ============================================================

interval:

  # ----------------------------------------------------------
  # ANIMACJA
  # ----------------------------------------------------------

  - interval: 100ms
    then:
      - lambda: |-
          id(klatka)++;

          if (id(klatka) > 100000) {
            id(klatka) = 0;
          }

  # ----------------------------------------------------------
  # POGODA CO 10 MINUT
  # ----------------------------------------------------------

  - interval: 10min
    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6050&longitude=18.2356&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 16384

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject current = root["current"];

                          if (current.isNull()) {
                            ESP_LOGW(
                              "pogoda",
                              "Brak sekcji current"
                            );
                            return false;
                          }

                          id(temperatura) =
                            current["temperature_2m"].as<float>();

                          id(odczuwalna) =
                            current["apparent_temperature"].as<float>();

                          id(wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(cisnienie) =
                            current["pressure_msl"].as<float>();

                          id(kod_pogody) =
                            current["weather_code"].as<int>();

                          JsonObject daily = root["daily"];

                          if (!daily.isNull()) {

                            JsonArray maks =
                              daily["temperature_2m_max"];

                            JsonArray kody =
                              daily["weather_code"];

                            if (maks.size() >= 5) {

                              id(prognoza_1) =
                                maks[0].as<float>();

                              id(prognoza_2) =
                                maks[1].as<float>();

                              id(prognoza_3) =
                                maks[2].as<float>();

                              id(prognoza_4) =
                                maks[3].as<float>();

                              id(prognoza_5) =
                                maks[4].as<float>();
                            }

                            if (kody.size() >= 5) {

                              id(kod_1) =
                                kody[0].as<int>();

                              id(kod_2) =
                                kody[1].as<int>();

                              id(kod_3) =
                                kody[2].as<int>();

                              id(kod_4) =
                                kody[3].as<int>();

                              id(kod_5) =
                                kody[4].as<int>();
                            }
                          }

                          ESP_LOGI(
                            "pogoda",
                            "Temperatura: %.1f C",
                            id(temperatura)
                          );

                          return true;
                        });

                  else:

                    - logger.log:
                        format: "Blad Open-Meteo HTTP: %d"
                        args:
                          - response->status_code

# ============================================================
# WYŚWIETLACZ
# WAVESHARE ESP32-S3 TOUCH LCD 4.3
# 800 x 480
# ============================================================

display:

  - platform: rpi_dpi_rgb

    id: ekran

    update_interval: 100ms

    auto_clear_enabled: true

    color_order: RGB

    pclk_frequency: 14MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7

    pclk_inverted: false

    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:

      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      // =====================================================
      // TRZECI KAFEL
      // =====================================================

      if (id(aktualna_strona) == 2) {

        const int f = id(klatka);
        const int kod = id(kod_pogody);

        auto now = id(czas).now();

        bool noc = false;

        if (now.is_valid()) {
          noc =
            (now.hour >= 20 || now.hour < 6);
        }

        // ===================================================
        // NIEBO
        // ===================================================

        Color gora;
        Color dol;

        if (noc) {

          gora = Color(5, 12, 38);
          dol = Color(35, 55, 100);

        } else {

          gora = Color(30, 105, 180);
          dol = Color(165, 215, 240);
        }

        // gradient

        for (int y = 0; y < 350; y += 10) {

          float p =
            (float)y / 350.0f;

          int r =
            gora.r +
            (dol.r - gora.r) * p;

          int g =
            gora.g +
            (dol.g - gora.g) * p;

          int b =
            gora.b +
            (dol.b - gora.b) * p;

          it.filled_rectangle(
            0,
            y,
            800,
            10,
            Color(r, g, b)
          );
        }

        // ===================================================
        // GWIAZDY
        // ===================================================

        if (noc) {

          for (int i = 0; i < 35; i++) {

            int x =
              (i * 97 + 30) % 790;

            int y =
              (i * 43 + 15) % 220;

            if (((f / 4 + i * 7) % 50) < 32) {

              it.filled_circle(
                x,
                y,
                1 + (i % 2),
                Color(240, 245, 255)
              );
            }
          }
        }

        // ===================================================
        // SŁOŃCE
        // ===================================================

        if (!noc &&
            kod != 51 &&
            kod != 53 &&
            kod != 55 &&
            kod != 61 &&
            kod != 63 &&
            kod != 65 &&
            kod != 95 &&
            kod != 96 &&
            kod != 99) {

          int puls =
            4 + ((f / 5) % 7);

          it.filled_circle(
            155,
            115,
            57 + puls,
            Color(255, 185, 45)
          );

          it.filled_circle(
            155,
            115,
            46,
            Color(255, 220, 70)
          );

          it.filled_circle(
            145,
            105,
            27,
            Color(255, 240, 130)
          );
        }

        // ===================================================
        // KSIĘŻYC
        // ===================================================

        if (noc) {

          it.filled_circle(
            155,
            110,
            46,
            Color(235, 238, 220)
          );

          it.filled_circle(
            175,
            92,
            46,
            Color(8, 18, 48)
          );
        }

        // ===================================================
        // CHMURY
        // ===================================================

        bool pokaz_chmury =
          kod == 1 ||
          kod == 2 ||
          kod == 3 ||
          kod == 45 ||
          kod == 48 ||
          kod >= 51;

        if (pokaz_chmury) {

          int ruch =
            (f / 4) % 950;

          for (int i = 0; i < 4; i++) {

            int x =
              i * 220 -
              ruch;

            while (x < -100) {
              x += 900;
            }

            int y =
              145 +
              (i % 2) * 35;

            Color chmura =
              noc
              ? Color(80, 95, 125)
              : Color(220, 232, 242);

            it.filled_circle(
              x,
              y,
              27,
              chmura
            );

            it.filled_circle(
              x + 30,
              y - 18,
              36,
              chmura
            );

            it.filled_circle(
              x + 65,
              y,
              28,
              chmura
            );

            it.filled_rectangle(
              x,
              y,
              65,
              27,
              chmura
            );
          }
        }

        // ===================================================
        // DESZCZ
        // ===================================================

        bool deszcz =
          kod == 51 ||
          kod == 53 ||
          kod == 55 ||
          kod == 56 ||
          kod == 57 ||
          kod == 61 ||
          kod == 63 ||
          kod == 65 ||
          kod == 66 ||
          kod == 67 ||
          kod == 80 ||
          kod == 81 ||
          kod == 82;

        if (deszcz) {

          for (int i = 0; i < 65; i++) {

            int x =
              (i * 71 + f * 2) % 800;

            int y =
              (i * 37 + f * 5) % 200;

            it.line(
              x,
              220 + y,
              x - 5,
              235 + y,
              Color(180, 225, 255)
            );
          }
        }

        // ===================================================
        // ŚNIEG
        // ===================================================

        bool snieg =
          kod == 71 ||
          kod == 73 ||
          kod == 75 ||
          kod == 77 ||
          kod == 85 ||
          kod == 86;

        if (snieg) {

          for (int i = 0; i < 55; i++) {

            int x =
              (i * 89 + f) % 800;

            int y =
              (i * 43 + f * 2) % 220;

            it.filled_circle(
              x,
              220 + y,
              2 + (i % 3),
              Color(250, 250, 255)
            );
          }
        }

        // ===================================================
        // BURZA
        // ===================================================

        bool burza =
          kod == 95 ||
          kod == 96 ||
          kod == 99;

        if (burza) {

          if ((f % 80) < 6) {

            it.filled_rectangle(
              0,
              0,
              800,
              350,
              Color(150, 165, 185)
            );
          }

          it.line(
            420,
            170,
            390,
            240,
            Color(255, 240, 80)
          );

          it.line(
            390,
            240,
            425,
            230,
            Color(255, 240, 80)
          );

          it.line(
            425,
            230,
            395,
            300,
            Color(255, 240, 80)
          );
        }

        // ===================================================
        // INFORMACJE NA GÓRZE
        // ===================================================

        it.filled_rectangle(
          20,
          18,
          330,
          82,
          Color(0, 0, 0)
        );

        it.print(
          40,
          30,
          id(font_miasto),
          Color(255, 255, 255),
          "WEJHEROWO"
        );

        it.print(
          40,
          64,
          id(font_mala),
          Color(210, 230, 245),
          "POLSKA"
        );

        // ===================================================
        // ZEGAR
        // ===================================================

        if (now.is_valid()) {

          it.strftime(
            760,
            30,
            id(font_zegar),
            Color(255, 255, 255),
            TextAlign::TOP_RIGHT,
            "%H:%M",
            now
          );

          it.strftime(
            760,
            94,
            id(font_data),
            Color(225, 235, 245),
            TextAlign::TOP_RIGHT,
            "%A, %d %B",
            now
          );
        }

        // ===================================================
        // TEMPERATURA
        // ===================================================

        it.filled_rectangle(
          25,
          115,
          350,
          180,
          Color(0, 0, 0)
        );

        it.printf(
          48,
          125,
          id(font_temperatura),
          Color(255, 255, 255),
          "%.1f",
          id(temperatura)
        );

        it.print(
          265,
          153,
          id(font_stopnie),
          Color(255, 220, 100),
          "°C"
        );

        // ===================================================
        // OPIS
        // ===================================================

        const char *opis =
          "Warunki pogodowe";

        if (kod == 0) {
          opis = "Bezchmurnie";
        } else if (kod == 1) {
          opis = "Glownie slonecznie";
        } else if (kod == 2) {
          opis = "Czesciowe zachmurzenie";
        } else if (kod == 3) {
          opis = "Pochmurno";
        } else if (kod == 45 || kod == 48) {
          opis = "Mgla";
        } else if (deszcz) {
          opis = "Deszcz";
        } else if (snieg) {
          opis = "Snieg";
        } else if (burza) {
          opis = "Burza";
        }

        it.print(
          50,
          250,
          id(font_opis),
          Color(255, 255, 255),
          opis
        );

        // ===================================================
        // PANEL PARAMETRÓW
        // ===================================================

        it.filled_rectangle(
          520,
          125,
          255,
          170,
          Color(0, 0, 0)
        );

        it.printf(
          540,
          140,
          id(font_info),
          Color(255, 255, 255),
          "Odczuwalna %.1f C",
          id(odczuwalna)
        );

        it.printf(
          540,
          172,
          id(font_info),
          Color(160, 220, 255),
          "Wilgotnosc %.0f %%",
          id(wilgotnosc)
        );

        it.printf(
          540,
          204,
          id(font_info),
          Color(180, 240, 255),
          "Wiatr %.0f km/h",
          id(wiatr)
        );

        it.printf(
          540,
          236,
          id(font_info),
          Color(225, 210, 255),
          "Cisnienie %.0f hPa",
          id(cisnienie)
        );

        // ===================================================
        // DOLNA PROGNOZA
        // ===================================================

        it.filled_rectangle(
          15,
          320,
          770,
          145,
          Color(0, 0, 0)
        );

        // ---------------------------------------------------
        // DZIEŃ 1
        // ---------------------------------------------------

        it.print(
          35,
          335,
          id(font_dzien),
          Color(255, 255, 255),
          "DZIS"
        );

        it.printf(
          35,
          370,
          id(font_prognoza),
          Color(255, 220, 100),
          "%.0f C",
          id(prognoza_1)
        );

        // --------------------------