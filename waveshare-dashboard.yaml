esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

ch422g:
  - id: io_ex

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

http_request:
  id: klient_http
  useragent: "ESPHome Weather"
  timeout: 10s

globals:
  - id: temperatura
    type: float
    restore_value: no
    initial_value: "0"

  - id: wilgotnosc
    type: float
    restore_value: no
    initial_value: "0"

  - id: wiatr
    type: float
    restore_value: no
    initial_value: "0"

  - id: cisnienie
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: "2"

interval:

  - interval: 1s
    then:
      - component.update: ekran

  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.605&longitude=18.2356&current=temperature_2m,relative_humidity_2m,weather_code,pressure_msl,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject current = root["current"];

                          if (current.isNull()) {
                            return false;
                          }

                          id(temperatura) =
                            current["temperature_2m"].as<float>();

                          id(wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(cisnienie) =
                            current["pressure_msl"].as<float>();

                          id(kod_pogody) =
                            current["weather_code"].as<int>();

                          return true;
                        });

font:

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_duza
    size: 64
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_zegar
    size: 42
    bpp: 4

display:

  - platform: rpi_dpi_rgb
    id: ekran

    # KLUCZOWE USTAWIENIA TWOJEGO EKRANU
    update_interval: never
    auto_clear_enabled: true

    color_order: RGB

    pclk_frequency: 14MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7
    pclk_inverted: false

    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10

    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:

      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      auto now = id(czas).now();

      bool noc = false;

      if (now.is_valid()) {
        if (now.hour >= 20 || now.hour < 6) {
          noc = true;
        }
      }

      /*
       * TŁO
       */

      if (noc) {
        it.fill(Color(8, 15, 45));
      } else {
        it.fill(Color(55, 165, 220));
      }

      /*
       * SŁOŃCE
       */

      if (!noc) {

        it.filled_circle(
          125,
          120,
          48,
          Color(255, 190, 40)
        );

        it.filled_circle(
          125,
          120,
          38,
          Color(255, 220, 60)
        );
      }

      /*
       * KSIĘŻYC
       */

      if (noc) {

        it.filled_circle(
          125,
          120,
          42,
          Color(235, 235, 210)
        );

        it.filled_circle(
          143,
          104,
          42,
          Color(8, 15, 45)
        );
      }

      /*
       * CHMURA
       */

      it.filled_circle(
        210,
        155,
        28,
        Color(240, 245, 250)
      );

      it.filled_circle(
        245,
        135,
        38,
        Color(250, 250, 255)
      );

      it.filled_circle(
        285,
        155,
        28,
        Color(240, 245, 250)
      );

      it.filled_rectangle(
        210,
        155,
        75,
        30,
        Color(240, 245, 250)
      );

      /*
       * NAGŁÓWEK
       */

      it.filled_rectangle(
        20,
        20,
        330,
        70,
        Color(0, 0, 0)
      );

      it.print(
        40,
        30,
        id(font_srednia),
        Color(255, 255, 255),
        "WEJHEROWO"
      );

      it.print(
        40,
        62,
        id(font_mala),
        Color(200, 220, 240),
        "POLSKA"
      );

      /*
       * ZEGAR
       */

      if (now.is_valid()) {

        it.strftime(
          775,
          30,
          id(font_zegar),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%H:%M",
          now
        );
      }

      /*
       * LEWY PANEL
       */

      it.filled_rectangle(
        20,
        250,
        365,
        205,
        Color(0, 0, 0)
      );

      it.printf(
        40,
        265,
        id(font_duza),
        Color(255, 255, 255),
        "%.1f C",
        id(temperatura)
      );

      /*
       * OPIS
       */

      if (id(kod_pogody) == 0) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(255, 255, 255),
          "Bezchmurnie"
        );

      } else if (
        id(kod_pogody) == 1 ||
        id(kod_pogody) == 2
      ) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(255, 255, 255),
          "Czesciowe zachmurzenie"
        );

      } else if (id(kod_pogody) == 3) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(255, 255, 255),
          "Pochmurno"
        );

      } else if (
        id(kod_pogody) >= 51 &&
        id(kod_pogody) <= 67
      ) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(170, 220, 255),
          "Deszcz"
        );

      } else if (
        id(kod_pogody) >= 71 &&
        id(kod_pogody) <= 77
      ) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(255, 255, 255),
          "Snieg"
        );

      } else if (id(kod_pogody) >= 95) {

        it.print(
          45,
          345,
          id(font_srednia),
          Color(255, 220, 100),
          "Burza"
        );
      }

      /*
       * PRAWY PANEL
       */

      it.filled_rectangle(
        410,
        250,
        370,
        205,
        Color(0, 0, 0)
      );

      it.print(
        435,
        270,
        id(font_srednia),
        Color(255, 255, 255),
        "WARUNKI"
      );

      it.printf(
        435,
        315,
        id(font_mala),
        Color(180, 225, 255),
        "Wilgotnosc: %.0f %%",
        id(wilgotnosc)
      );

      it.printf(
        435,
        345,
        id(font_mala),
        Color(180, 235, 255),
        "Wiatr: %.0f km/h",
        id(wiatr)
      );

      it.printf(
        435,
        375,
        id(font_mala),
        Color(220, 210, 255),
        "Cisnienie: %.0f hPa",
        id(cisnienie)
      );

      it.print(
        435,
        415,
        id(font_mala),
        Color(160, 180, 200),
        "Open-Meteo"
      );

      /*
       * DOLNA LINIA
       */

      it.filled_rectangle(
        20,
        465,
        760,
        2,
        Color(120, 180, 220)
      );

touchscreen:

  - platform: gt911

    id: my_touch

    i2c_id: bus_i2c

    address: 0x5D

    interrupt_pin:
      number: GPIO4

    reset_pin:
      ch422g: io_ex
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false