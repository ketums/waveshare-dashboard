esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:


# ============================================================
# ZMIENNA - AKTUALNA STRONA (0, 1, 2)
# ============================================================

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'


# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub


# ============================================================
# I2C
# GPIO8  = SDA
# GPIO9  = SCL
# ============================================================

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true


# ============================================================
# HTTP REQUEST (Dla danych pogodowych Open-Meteo)
# ============================================================

http_request:
  timeout: 10s


# ============================================================
# WIFI - SIŁA SYGNAŁU
# ============================================================

sensor:

  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0


# ============================================================
# WIFI - INFORMACJE
# ============================================================

text_sensor:

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"

    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"


# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw


# ============================================================
# CZCIONKI
# ============================================================
font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"



# ============================================================
# WYŚWIETLACZ WAVESHARE
#
# Waveshare ESP32-S3-Touch-LCD-4.3
# 800 x 480
# ============================================================

display:

  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3

    id: ekran_waveshare

    rotation: 0

    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-

      // Pobranie aktualnego czasu
      auto time_now = id(czas_sntp).now();

      // ======================================================
      // STRONA 3 - PEŁNY EKRAN POGODOWY (BEZ GÓRNEGO PASKA)
      // ======================================================

      if (id(aktualna_strona) == 2) {

        // Pełne tło dla widoku pogodowego
        it.fill(Color(15, 23, 42));

        // Subtelna ramka zewnętrzna
        it.rectangle(15, 15, 770, 450, Color(30, 41, 59));

        // Lokacja / Nagłówek
        it.print(
          40, 35,
          id(font_srednia),
          Color(148, 163, 184),
          TextAlign::TOP_LEFT,
          "Wejherowo • Stacja Pogody"
        );

        // Aktualna temperatura
        it.print(
          40, 80,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "18.5 °C"
        );

        // Stan pogody (tekst)
        it.print(
          40, 135,
          id(font_srednia),
          Color(56, 189, 248),
          TextAlign::TOP_LEFT,
          "Intensywne opady deszczu"
        );

        // Duży zegar i data w prawym górnym rogu pełnego ekranu
        if (time_now.is_valid()) {
          it.strftime(
            760, 35,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_RIGHT,
            "%H:%M",
            time_now
          );
          it.strftime(
            760, 90,
            id(font_mala),
            Color(148, 163, 184),
            TextAlign::TOP_RIGHT,
            "%A, %d %B %Y",
            time_now
          );
        } else {
          it.print(
            760, 35,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_RIGHT,
            "--:--"
          );
        }

        // ====================================================
        // ANIMACJA DESZCZU NA CAŁYM EKRANIE
        // ====================================================
        uint32_t ms = millis();

        // Rysowanie chmury deszczowej w środkowej/górnej części
        int cloud_x = 420;
        int cloud_y = 110;
        it.filled_circle(cloud_x - 70, cloud_y + 15, 32, Color(51, 65, 85));
        it.filled_circle(cloud_x - 20, cloud_y, 48, Color(71, 85, 105));
        it.filled_circle(cloud_x + 40, cloud_y + 10, 38, Color(51, 65, 85));
        it.filled_rectangle(cloud_x - 80, cloud_y + 15, 150, 45, Color(71, 85, 105));

        // Generowanie padających kropel deszczu w pętli
        for (int i = 0; i < 70; i++) {
          int drop_x = 40 + (i * 17 + (i * 3)) % 720;
          int speed = 15 + (i % 6) * 4; // zróżnicowana prędkość kropel
          int drop_y = (ms * speed / 35 + i * 31) % 280 + 170;
          
          // Skośna kropla deszczu
          it.line(drop_x, drop_y, drop_x - 4, drop_y + 14, Color(56, 189, 248));
        }

        return; // Pomijamy rysowanie standardowego paska dla strony 3
      }


      // ======================================================
      // STANDARDOWY UKŁAD DLA STRON 1 ORAZ 2 (Z GÓRNYM PASKIEM)
      // ======================================================

      // TŁO
      it.fill(Color(18, 24, 38));

      // RAMKA
      it.rectangle(10, 10, 780, 460, Color(45, 55, 72));

      // GÓRNY PASEK
      it.line(10, 70, 790, 70, Color(45, 55, 72));

      // TYTUŁ
      it.print(25, 20, id(font_srednia), Color(200, 210, 225), TextAlign::TOP_LEFT, "DASHBOARD");

      // STAN WIFI
      if (id(wifi_ssid).has_state()) {
        it.print(285, 18, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_LEFT, "WIFI OK");
      } else {
        it.print(285, 18, id(font_srednia), Color(229, 62, 62), TextAlign::TOP_LEFT, "WIFI OFF");
      }

      // SIŁA SYGNAŁU WIFI
      if (!isnan(id(wifi_sila).state)) {
        it.printf(390, 20, id(font_mala), Color(180, 190, 205), TextAlign::TOP_LEFT, "%0.0f dBm", id(wifi_sila).state);
      } else {
        it.print(390, 20, id(font_mala), Color(180, 190, 205), TextAlign::TOP_LEFT, "-- dBm");
      }

      // ADRES IP
      if (id(wifi_ip).has_state()) {
        it.printf(770, 20, id(font_mala), Color(90, 200, 250), TextAlign::TOP_RIGHT, "%s", id(wifi_ip).state.c_str());
      } else {
        it.print(770, 20, id(font_mala), Color(180, 190, 205), TextAlign::TOP_RIGHT, "brak IP");
      }


      // ======================================================
      // STRONA 1
      // ======================================================

      if (id(aktualna_strona) == 0) {

        it.line(400, 70, 400, 470, Color(45, 55, 72));
        it.line(10, 270, 790, 270, Color(45, 55, 72));

        it.print(770, 75, id(font_mala), Color(120, 130, 145), TextAlign::TOP_RIGHT, "STRONA 1/3");

        // --- ROLETY ---
        it.print(30, 90, id(font_srednia), Color(237, 137, 54), TextAlign::TOP_LEFT, "ROLETY OKIENNE");
        it.print(30, 130, id(font_mala), Color(160, 174, 192), TextAlign::TOP_LEFT, "okno 1 & okno 2");

        it.rectangle(30, 170, 100, 50, Color(66, 153, 225));
        it.print(80, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "OTWÓRZ");

        it.rectangle(140, 170, 100, 50, Color(229, 62, 62));
        it.print(190, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "STOP");

        it.rectangle(250, 170, 100, 50, Color(66, 153, 225));
        it.print(300, 185, id(font_mala), Color(255, 255, 255), TextAlign::TOP_CENTER, "ZAMKNIJ");


        // --- KLIMATYZACJA ROTENSO ---
        it.print(430, 90, id(font_srednia), Color(90, 200, 250), TextAlign::TOP_LEFT, "KLIMATYZACJA");
        it.print(430, 120, id(font_mala), Color(160, 174, 192), TextAlign::TOP_LEFT, "ROTENSO");

        it.rectangle(430, 170, 60, 50, Color(66, 153, 225));
        it.print(460, 177, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "-");

        it.print(535, 175, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "22°C");

        it.rectangle(580, 170, 60, 50, Color(229, 62, 62));
        it.print(610, 177, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "+");


        // --- CZUJNIK ZIGBEE ---
        it.print(30, 290, id(font_srednia), Color(72, 187, 120), TextAlign::TOP_LEFT, "CZUJNIK ZIGBEE");
        it.print(30, 340, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, "21.5 °C");
        it.print(30, 400, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, "Wilgotność: 55%");

      }


      // ======================================================
      // STRONA 2
      // ======================================================

      else if (id(aktualna_strona) == 1) {

        it.print(770, 75, id(font_mala), Color(120, 130, 145), TextAlign::TOP_RIGHT, "STRONA 2/3");

        it.print(400, 150, id(font_duza), Color(255, 255, 255), TextAlign::TOP_CENTER, "DRUGI KAFEL");
        it.print(400, 220, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_CENTER, "Miejsce na kolejne");
        it.print(400, 250, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_CENTER, "przyciski i sensory");

      }


# ============================================================
# GT911 - PANEL DOTYKOWY
# ============================================================

touchscreen:

  - platform: gt911

    id: panel_dotykowy

    i2c_id: bus_i2c

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:

      - lambda: |-

          int x = touch.x;
          int y = touch.y;

          ESP_LOGI("TOUCH", "Dotyk X=%d Y=%d", x, y);


          // ==================================================
          // OBSŁUGA STRONY 3 (PEŁNY EKRAN) - DOTKNIĘCIE WRACA DO STRONY 1
          // ==================================================

          if (id(aktualna_strona) == 2) {
            id(aktualna_strona) = 0;
            ESP_LOGI("TOUCH", "Powrót ze strony 3 na stronę 1");
            return;
          }


          // ==================================================
          // GÓRNY PASEK (STRONY 1 i 2) - ZMIANA STRON
          // ==================================================

          if (y >= 0 && y <= 70) {
            id(aktualna_strona) = (id(aktualna_strona) + 1) % 3;
            ESP_LOGI("TOUCH", "Przełączono stronę na indeks: %d", id(aktualna_strona));
            return;
          }


          // ==================================================
          // STRONA 1 (indeks 0) - AKCJE
          // ==================================================

          if (id(aktualna_strona) == 0) {

            if (y >= 170 && y <= 220) {

              if (x >= 30 && x <= 130) {
                ESP_LOGI("TOUCH", "Naciśnięto: OTWÓRZ OKNA");
              }
              else if (x >= 140 && x <= 240) {
                ESP_LOGI("TOUCH", "Naciśnięto: STOP ROLETY");
              }
              else if (x >= 250 && x <= 350) {
                ESP_LOGI("TOUCH", "Naciśnięto: ZAMKNIJ OKNA");
              }
              else if (x >= 430 && x <= 490) {
                ESP_LOGI("TOUCH", "Naciśnięto: TEMP -");
              }
              else if (x >= 580 && x <= 640) {
                ESP_LOGI("TOUCH", "Naciśnięto: TEMP +");
              }

            }

          }


          // ==================================================
          // STRONA 2 (indeks 1) - AKCJE
          // ==================================================

          else if (id(aktualna_strona) == 1) {
            // Dodatkowe akcje dla strony 2 w przyszłości
          }
