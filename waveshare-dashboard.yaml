esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "Waveshare-Dashboard"
    password: "12345678"

captive_portal:

web_server:
  port: 80

# =========================================================
# I2C - GT911 + CH422G
# =========================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

ch422g:
  - id: io_ex

# =========================================================
# CZAS
# =========================================================

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# =========================================================
# INTERNET - POGODA
# =========================================================

http_request:
  id: klient_http
  useragent: "ESPHome Waveshare Weather"
  timeout: 10s
  follow_redirects: true

# =========================================================
# ZMIENNE
# =========================================================

globals:

  - id: current_page
    type: int
    restore_value: no
    initial_value: "0"

  - id: temperatura
    type: float
    restore_value: no
    initial_value: "0"

  - id: odczuwalna
    type: float
    restore_value: no
    initial_value: "0"

  - id: wilgotnosc
    type: float
    restore_value: no
    initial_value: "0"

  - id: wiatr
    type: float
    restore_value: no
    initial_value: "0"

  - id: cisnienie
    type: float
    restore_value: no
    initial_value: "0"

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: "2"

  - id: klatka
    type: int
    restore_value: no
    initial_value: "0"

# =========================================================
# ANIMACJA + POGODA
# =========================================================

interval:

  - interval: 100ms
    then:
      - lambda: |-
          id(klatka)++;

          if (id(klatka) > 100000) {
            id(klatka) = 0;
          }

  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6050&longitude=18.2356&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,pressure_msl,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 8192

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          JsonObject c = root["current"];

                          if (c.isNull()) {
                            return false;
                          }

                          id(temperatura) =
                            c["temperature_2m"].as<float>();

                          id(odczuwalna) =
                            c["apparent_temperature"].as<float>();

                          id(wilgotnosc) =
                            c["relative_humidity_2m"].as<float>();

                          id(wiatr) =
                            c["wind_speed_10m"].as<float>();

                          id(cisnienie) =
                            c["pressure_msl"].as<float>();

                          id(kod_pogody) =
                            c["weather_code"].as<int>();

                          return true;
                        });

# =========================================================
# EKRAN WAVESHARE
# 800 x 480
# =========================================================

display:

  - platform: rpi_dpi_rgb

    id: ekran

    update_interval: 100ms
    auto_clear_enabled: true

    color_order: RGB
    pclk_frequency: 16MHz

    dimensions:
      width: 800
      height: 480

    de_pin:
      number: 5

    hsync_pin:
      number: 46
      ignore_strapping_warning: true

    vsync_pin:
      number: 3
      ignore_strapping_warning: true

    pclk_pin: 7
    pclk_inverted: true

    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30

    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4

    reset_pin:
      ch422g: io_ex
      number: 3

    enable_pin:
      ch422g: io_ex
      number: 2

    data_pins:

      red:
        - 1
        - 2
        - 42
        - 41
        - 40

      green:
        - 39
        - 0
        - 45
        - 48
        - 47
        - 21

      blue:
        - 14
        - 38
        - 18
        - 17
        - 10

    lambda: |-

      const int f = id(klatka);
      const int kod = id(kod_pogody);

      auto now = id(czas).now();

      // =====================================================
      // STRONA 3 = POGODA
      // =====================================================

      if (id(current_page) == 2) {

        bool noc = false;

        if (now.is_valid()) {
          noc = (now.hour >= 20 || now.hour < 6);
        }

        // ---------------------------------------------------
        // NIEBO
        // ---------------------------------------------------

        Color gora;
        Color dol;

        if (noc) {

          gora = Color(4, 9, 30);
          dol = Color(35, 55, 95);

        } else {

          gora = Color(30, 110, 190);
          dol = Color(175, 215, 235);
        }

        for (int y = 0; y < 360; y += 8) {

          float p = (float)y / 360.0f;

          int r = gora.r + (dol.r - gora.r) * p;
          int g = gora.g + (dol.g - gora.g) * p;
          int b = gora.b + (dol.b - gora.b) * p;

          it.filled_rectangle(
            0,
            y,
            800,
            8,
            Color(r, g, b)
          );
        }

        // ---------------------------------------------------
        // GWIAZDY
        // ---------------------------------------------------

        if (noc) {

          for (int i = 0; i < 35; i++) {

            int x = (i * 97 + 23) % 790;
            int y = (i * 43 + 20) % 210;

            if (((f + i * 11) % 40) < 30) {

              it.filled_circle(
                x,
                y,
                1 + (i % 2),
                Color(230, 240, 255)
              );
            }
          }
        }

        // ---------------------------------------------------
        // SŁOŃCE / KSIĘŻYC
        // ---------------------------------------------------

        if (noc) {

          it.filled_circle(
            150,
            105,
            46,
            Color(240, 240, 215)
          );

          it.filled_circle(
            170,
            90,
            46,
            gora
          );

        } else {

          int puls =
            7 + ((f / 3) % 8);

          it.filled_circle(
            150,
            105,
            57 + puls,
            Color(255, 190, 50)
          );

          it.filled_circle(
            150,
            105,
            46,
            Color(255, 220, 75)
          );

          it.filled_circle(
            140,
            95,
            29,
            Color(255, 238, 125)
          );
        }

        // ---------------------------------------------------
        // CHMURY
        // ---------------------------------------------------

        int ruch_tla = (f / 3) % 900;

        for (int i = 0; i < 5; i++) {

          int x = i * 190 - ruch_tla / 4;
          int y = 135 + (i % 2) * 30;

          Color c =
            noc
            ? Color(80, 95, 120)
            : Color(205, 225, 238);

          it.filled_circle(x, y, 25, c);
          it.filled_circle(x + 28, y - 13, 33, c);
          it.filled_circle(x + 58, y, 27, c);

          it.filled_rectangle(
            x - 5,
            y,
            68,
            24,
            c
          );
        }

        // ---------------------------------------------------
        // DESZCZ
        // ---------------------------------------------------

        bool deszcz =
          kod == 51 || kod == 53 || kod == 55 ||
          kod == 56 || kod == 57 ||
          kod == 61 || kod == 63 || kod == 65 ||
          kod == 66 || kod == 67 ||
          kod == 80 || kod == 81 || kod == 82;

        if (deszcz) {

          for (int i = 0; i < 65; i++) {

            int x =
              (i * 71 +
               f * (2 + i % 3)) % 820 - 10;

            int y =
              (i * 39 +
               f * 5) % 250;

            it.line(
              x,
              250 + y,
              x - 5,
              260 + y,
              Color(180, 225, 255)
            );
          }
        }

        // ---------------------------------------------------
        // ŚNIEG
        // ---------------------------------------------------

        bool snieg =
          kod == 71 || kod == 73 ||
          kod == 75 || kod == 77 ||
          kod == 85 || kod == 86;

        if (snieg) {

          for (int i = 0; i < 50; i++) {

            int x =
              (i * 89 +
               f * (1 + i % 2)) % 800;

            int y =
              (i * 43 +
               f * 2) % 280;

            it.filled_circle(
              x,
              225 + y,
              2 + (i % 3),
              Color(250, 250, 255)
            );
          }
        }

        // ---------------------------------------------------
        // BURZA
        // ---------------------------------------------------

        bool burza =
          kod == 95 ||
          kod == 96 ||
          kod == 99;

        if (burza) {

          it.filled_rectangle(
            0,
            0,
            800,
            350,
            Color(45, 55, 75)
          );

          if ((f % 80) < 5) {

            it.line(
              425, 190,
              400, 245,
              Color(255, 245, 100)
            );

            it.line(
              400, 245,
              430, 235,
              Color(255, 245, 100)
            );

            it.line(
              430, 235,
              405, 300,
              Color(255, 245, 100)
            );
          }
        }

        // ---------------------------------------------------
        // DÓŁ / HORYZONT
        // ---------------------------------------------------

        it.filled_rectangle(
          0,
          350,
          800,
          130,
          Color(10, 30, 35)
        );

        it.filled_rectangle(
          0,
          410,
          800,
          70,
          Color(12, 50, 65)
        );

        // ---------------------------------------------------
        // PANELE
        // ---------------------------------------------------

        it.filled_rectangle(
          20,
          20,
          330,
          245,
          Color(0, 0, 0)
        );

        it.filled_rectangle(
          570,
          20,
          210,
          245,
          Color(0, 0, 0)
        );

        it.filled_rectangle(
          20,
          390,
          760,
          75,
          Color(0, 0, 0)
        );

        // ---------------------------------------------------
        // WEJHEROWO
        // ---------------------------------------------------

        it.print(
          40,
          35,
          id(font_small),
          Color(255, 255, 255),
          "WEJHEROWO"
        );

        it.print(
          40,
          65,
          id(font_tiny),
          Color(205, 225, 240),
          "POGODA NA ZYWO"
        );

        // ---------------------------------------------------
        // TEMPERATURA
        // ---------------------------------------------------

        it.printf(
          45,
          105,
          id(font_temperature),
          Color(255, 255, 255),
          "%.1f",
          id(temperatura)
        );

        it.print(
          250,
          120,
          id(font_medium),
          Color(255, 230, 120),
          "°C"
        );

        // ---------------------------------------------------
        // OPIS
        // ---------------------------------------------------

        const char *opis = "Pochmurno";

        if (kod == 0)
          opis = "Bezchmurnie";
        else if (kod == 1)
          opis = "Glownie slonecznie";
        else if (kod == 2)
          opis = "Czesciowe zachmurzenie";
        else if (kod == 3)
          opis = "Pochmurno";
        else if (deszcz)
          opis = "Opady deszczu";
        else if (snieg)
          opis = "Opady sniegu";
        else if (burza)
          opis = "Burza";
        else if (kod == 45 || kod == 48)
          opis = "Mgla";

        it.print(
          48,
          175,
          id(font_description),
          Color(245, 250, 255),
          opis
        );

        // ---------------------------------------------------
        // ZEGAR
        // ---------------------------------------------------

        if (now.is_valid()) {

          it.strftime(
            760,
            40,
            id(font_clock),
            Color(255, 255, 255),
            TextAlign::TOP_RIGHT,
            "%H:%M",
            now
          );

          it.strftime(
            760,
            110,
            id(font_date),
            Color(210, 225, 240),
            TextAlign::TOP_RIGHT,
            "%d.%m.%Y",
            now
          );
        }

        // ---------------------------------------------------
        // INFORMACJE
        // ---------------------------------------------------

        it.printf(
          590,
          150,
          id(font_info),
          Color(255, 255, 255),
          "ODCZUWALNA %.1f C",
          id(odczuwalna)
        );

        it.printf(
          590,
          178,
          id(font_info),
          Color(170, 225, 255),
          "WILGOTNOSC %.0f %%",
          id(wilgotnosc)
        );

        it.printf(
          590,
          206,
          id(font_info),
          Color(200, 240, 245),
          "WIATR %.0f km/h",
          id(wiatr)
        );

        it.printf(
          590,
          234,
          id(font_info),
          Color(220, 205, 255),
          "CISNIENIE %.0f hPa",
          id(cisnienie)
        );

        // ---------------------------------------------------
        // DÓŁ
        // ---------------------------------------------------

        it.print(
          45,
          405,
          id(font_info),
          Color(255, 255, 255),
          "AKTUALNA POGODA"
        );

        it.print(
          45,
          435,
          id(font_tiny),
          Color(175, 205, 220),
          "Open-Meteo • aktualizacja co 10 minut"
        );

        return;
      }

      // =====================================================
      // STRONA 1
      // =====================================================

      it.fill(Color(15, 25, 35));

      it.print(
        40,
        40,
        id(font_small),
        Color(255, 255, 255),
        "DASHBOARD SMART LIFE"
      );

      if (now.is_valid()) {

        it.strftime(
          400,
          150,
          id(font_clock),
          Color(255, 255, 255),
          TextAlign::CENTER,
          "%H:%M",
          now
        );

        it.strftime(
          400,
          230,
          id(font_date),
          Color(180, 210, 230),
          TextAlign::CENTER,
          "%d.%m.%Y",
          now
        );
      }

      it.print(
        400,
        330,
        id(font_small),
        Color(120, 210, 255),
        TextAlign::CENTER,
        "STRONA 1"
      );

      // =====================================================
      // STRONA 2
      // =====================================================

      if (id(current_page) == 1) {

        it.fill(Color(20, 25, 35));

        it.print(
          400,
          45,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::CENTER,
          "SMART LIFE"
        );

        it.print(
          400,
          160,
          id(font_medium),
          Color(100, 220, 255),
          TextAlign::CENTER,
          "STRONA 2"
        );

        it.print(
          400,
          230,
          id(font_small),
          Color(210, 220, 230),
          TextAlign::CENTER,
          "Panel sterowania"
        );
      }

# =========================================================
# FONTY
# =========================================================

font:

  - file: "gfonts://Roboto"
    id: font_tiny
    size: 13
    bpp: 2

  - file: "gfonts://Roboto"
    id: font_small
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_medium
    size: 36
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_description
    size: 24
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_temperature
    size: 82
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_clock
    size: 66
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_date
    size: 23
    bpp: 4

  - file: "gfonts://Roboto"
    id: font_info
    size: 16
    bpp: 2

# =========================================================
# DOTYK GT911
# =========================================================

touchscreen:

  - platform: gt911

    id: my_touch

    i2c_id: bus_i2c

    address: 0x5D

    interrupt_pin:
      number: GPIO4

    reset_pin:
      ch422g: io_ex
      number: 1