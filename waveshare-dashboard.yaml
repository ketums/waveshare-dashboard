esphome:
  name: waveshare-dashboard
  friendly_name: ESP32-S3 Panel Pogodowy

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESP32-S3 Fallback Hotspot"
    password: "fallbackpassword"

captive_portal:

# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: time_now
    timezone: Europe/Warsaw
    servers:
      - "pl.pool.ntp.org"

# ============================================================
# INTERNET
# ============================================================

http_request:
  useragent: "ESPHome-Waveshare-Weather"
  timeout: 10s

# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub

# ============================================================
# I2C
# GT911 + CH422G
# ============================================================

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

# ============================================================
# ZMIENNE
# ============================================================

globals:

  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '2'

  - id: weather_code
    type: int
    restore_value: no
    initial_value: '0'

  - id: animacja
    type: int
    restore_value: no
    initial_value: '0'

# ============================================================
# CZUJNIKI POGODOWE
# ============================================================

sensor:

  - platform: template
    name: "Temperatura zewnętrzna"
    id: weather_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  - platform: template
    name: "Kod pogody WMO"
    id: weather_wmo
    accuracy_decimals: 0

    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              id(weather_code) = (int) x;
            }

  - platform: template
    name: "Wilgotność"
    id: weather_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    name: "Prędkość wiatru"
    id: weather_wind
    unit_of_measurement: "km/h"
    accuracy_decimals: 1

  - platform: template
    name: "Zachmurzenie"
    id: weather_cloud
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: wifi_signal
    name: "Siła WiFi"
    id: wifi_signal_db
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

# ============================================================
# INFORMACJE O WI-FI
# ============================================================

text_sensor:

  - platform: wifi_info

    ip_address:
      name: "Adres IP panelu"
      id: wifi_ip

    ssid:
      name: "Sieć WiFi"
      id: wifi_ssid

# ============================================================
# POGODA Z OPEN-METEO
# WEJHEROWO
# ============================================================

interval:

  # ----------------------------------------------------------
  # POBIERANIE POGODY CO 10 MINUT
  # ----------------------------------------------------------

  - interval: 10min
    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60&longitude=18.25&current=temperature_2m,relative_humidity_2m,weather_code,cloud_cover,wind_speed_10m"

          capture_response: true

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          if (!root["current"]) {
                            ESP_LOGW(
                              "pogoda",
                              "Brak sekcji current w odpowiedzi"
                            );
                            return false;
                          }

                          JsonObject current = root["current"];

                          if (current["temperature_2m"]) {

                            id(weather_temp).publish_state(
                              current["temperature_2m"].as<float>()
                            );
                          }

                          if (current["relative_humidity_2m"]) {

                            id(weather_humidity).publish_state(
                              current["relative_humidity_2m"].as<float>()
                            );
                          }

                          if (current["wind_speed_10m"]) {

                            id(weather_wind).publish_state(
                              current["wind_speed_10m"].as<float>()
                            );
                          }

                          if (current["cloud_cover"]) {

                            id(weather_cloud).publish_state(
                              current["cloud_cover"].as<float>()
                            );
                          }

                          if (current["weather_code"]) {

                            id(weather_wmo).publish_state(
                              current["weather_code"].as<int>()
                            );
                          }

                          return true;
                        });

                  else:

                    - logger.log:
                        format: "Open-Meteo HTTP error: %d"
                        args:
                          - response->status_code

  # ----------------------------------------------------------
  # ANIMACJA EKRANU
  # ----------------------------------------------------------

  - interval: 80ms
    then:

      - lambda: |-
          id(animacja)++;

          if (id(animacja) >= 1000) {
            id(animacja) = 0;
          }

