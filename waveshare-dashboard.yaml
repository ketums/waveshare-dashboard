esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

  on_boot:
    priority: -100
    then:
      - delay: 8s
      - script.execute: pobierz_pogode


esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf


psram:
  mode: octal
  speed: 80MHz


logger:
  level: DEBUG


api:


