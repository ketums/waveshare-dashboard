esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

  on_boot:
    priority: -10
    then:
      - delay: 10s
      - script.execute: pobierz_pogode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: temp_pogody
    type: float
    restore_value: no
    initial_value: '0'

  - id: wilg_pogody
    type: int
    restore_value: no
    initial_value: '0'

  - id: wiatr_pogody
    type: float
    restore_value: no
    initial_value: '0'

  - id: kod_pogody
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: animacja_ikony
    type: bool
    restore_value: no
    initial_value: 'false'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  id: klient_http
  timeout: 15s
  useragent: "ESPHome Waveshare"

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"

    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphsets:
      - GF_Latin_Core

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphsets:
      - GF_Latin_Core

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphsets:
      - GF_Latin_Core

image:
  - file: "weather_partly_cloudy.png"
    id: ikona_pogoda_duza
    type: RGB565
    transparency: alpha_channel

  - file: "weather_partly_cloudy_small.png"
    id: ikona_pogoda_mala
    type: RGB565
    transparency: alpha_channel

script:
  - id: pobierz_pogode
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6059&longitude=18.2356&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    id(pogoda_ok) = false;
                    ESP_LOGE("POGODA", "HTTP %d", response->status_code);
                    return;
                  }

                  json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["current"]) {
                      return false;
                    }

                    JsonObject c = root["current"];

                    id(temp_pogody) =
                      c["temperature_2m"].as<float>();

                    id(wilg_pogody) =
                      c["relative_humidity_2m"].as<int>();

                    id(wiatr_pogody) =
                      c["wind_speed_10m"].as<float>();

                    id(kod_pogody) =
                      c["weather_code"].as<int>();

                    id(pogoda_ok) = true;

                    ESP_LOGI(
                      "POGODA",
                      "Temp %.1f C, wilg %d%%, wiatr %.1f km/h, kod %d",
                      id(temp_pogody),
                      id(wilg_pogody),
                      id(wiatr_pogody),
                      id(kod_pogody)
                    );

                    return true;
                  });

interval:
  - interval: 10min
    then:
      - script.execute: pobierz_pogode

  - interval: 1s
    then:
      - lambda: |-
          id(animacja_ikony) = !id(animacja_ikony);

