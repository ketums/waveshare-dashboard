esphome:
  name: waveshare-dashboard
  friendly_name: ESP32-S3 Panel Pogodowy

  on_boot:
    priority: -100
    then:
      - delay: 10s
      - script.execute: pobierz_pogode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz
  id: bus_i2c

ch422g:
  - id: ch422g_hub

http_request:
  timeout: 15s
  verify_ssl: true

globals:

  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_temperatura
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_kod
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_dane_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: pogoda_opis
    type: std::string
    restore_value: no
    initial_value: '"Brak danych"'

  - id: animacja
    type: int
    restore_value: no
    initial_value: '0'

font:

  - file: "Roboto-Regular.ttf"
    id: font_48
    size: 48
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-./%ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"

  - file: "Roboto-Regular.ttf"
    id: font_32
    size: 32
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-./%ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"

  - file: "Roboto-Regular.ttf"
    id: font_24
    size: 24
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-./%ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"

  - file: "Roboto-Regular.ttf"
    id: font_18
    size: 18
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-./%ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"

  - file: "Roboto-Regular.ttf"
    id: font_14
    size: 14
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:-./%ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"

image:

  - file: "weather_partly_cloudy.png"
    id: ikona_pogoda_duza
    type: RGB565
    transparency: alpha_channel

  - file: "weather_partly_cloudy_small.png"
    id: ikona_pogoda_mala
    type: RGB565
    transparency: alpha_channel

sensor:

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s

text_sensor:

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: adres_ip

time:

  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - pl.pool.ntp.org
      - pool.ntp.org

script:

  - id: pobierz_pogode
    mode: restart
    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60167&longitude=18.23833&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=kmh&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          if (!root["current"]) {
                            return false;
                          }

                          JsonObject current = root["current"];

                          if (current["temperature_2m"]) {
                            id(pogoda_temperatura) = current["temperature_2m"].as<float>();
                          }

                          if (current["relative_humidity_2m"]) {
                            id(pogoda_wilgotnosc) = current["relative_humidity_2m"].as<float>();
                          }

                          if (current["wind_speed_10m"]) {
                            id(pogoda_wiatr) = current["wind_speed_10m"].as<float>();
                          }

                          if (current["weather_code"]) {
                            id(pogoda_kod) = current["weather_code"].as<int>();
                          }

                          int code = id(pogoda_kod);

                          if (code == 0) {
                            id(pogoda_opis) = "Slonecznie";
                          } else if (code == 1 || code == 2) {
                            id(pogoda_opis) = "Czesciowe zachmurzenie";
                          } else if (code == 3) {
                            id(pogoda_opis) = "Pochmurno";
                          } else if (code == 45 || code == 48) {
                            id(pogoda_opis) = "Mgla";
                          } else if (code >= 51 && code <= 57) {
                            id(pogoda_opis) = "Mżawka";
                          } else if (code >= 61 && code <= 67) {
                            id(pogoda_opis) = "Deszcz";
                          } else if (code >= 71 && code <= 77) {
                            id(pogoda_opis) = "Snieg";
                          } else if (code >= 80 && code <= 82) {
                            id(pogoda_opis) = "Przelotny deszcz";
                          } else if (code >= 85 && code <= 86) {
                            id(pogoda_opis) = "Przelotny snieg";
                          } else if (code >= 95) {
                            id(pogoda_opis) = "Burza";
                          } else {
                            id(pogoda_opis) = "Nieznana pogoda";
                          }

                          id(pogoda_dane_ok) = true;

                          return true;
                        });

              - component.update: ekran

          on_error:
            then:
              - lambda: |-
                  id(pogoda_dane_ok) = false;

interval:

  - interval: 10min
    then:
      - script.execute: pobierz_pogode

  - interval: 180ms
    then:
      - lambda: |-
          id(animacja)++;
          if (id(animacja) >= 360) {
            id(animacja) = 0;
          }

display:

  - platform: mipi_rgb
    id: ekran
    model: ESP32-S3-TOUCH-LCD-4.3
    rotation: 0

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    update_interval: 180ms
    auto_clear_enabled: true

    lambda: |-

      auto navy = Color(12, 20, 38);
      auto panel = Color(24, 34, 56);
      auto panel2 = Color(30, 43, 68);
      auto cyan = Color(0, 220, 255);
      auto white = Color(245, 248, 255);
      auto gray = Color(170, 185, 205);
      auto green = Color(40, 220, 130);
      auto blue = Color(50, 150, 255);
      auto yellow = Color(255, 210, 60);
      auto orange = Color(255, 145, 40);

      it.fill(navy);

      if (id(aktualna_strona) == 0) {

        it.filled_rectangle(0, 0, 800, 62, Color(18, 28, 48));

        it.print(24, 14, id(font_24), cyan, "PANEL GLOWNY");

        auto now = id(czas).now();

        if (now.is_valid()) {
          it.strftime(610, 12, id(font_32), white, "%H:%M", now);
        } else {
          it.print(610, 12, id(font_32), white, "--:--");
        }

        it.filled_circle(775, 30, 7, green);

        it.filled_rectangle(20, 82, 380, 225, panel);
        it.filled_rectangle(420, 82, 780, 225, panel);

        it.filled_rectangle(20, 245, 380, 388, panel);
        it.filled_rectangle(420, 245, 780, 388, panel);

        it.print(45, 102, id(font_24), cyan, "OSWIETLENIE");
        it.print(45, 140, id(font_18), gray, "Sterowanie oswietleniem");

        it.filled_circle(330, 145, 28, yellow);
        it.filled_circle(330, 145, 16, Color(255, 235, 120));

        it.print(445, 102, id(font_24), cyan, "TEMPERATURA");
        it.print(445, 145, id(font_48), white, "--");
        it.print(540, 158, id(font_18), gray, "°C");

        it.filled_circle(710, 150, 24, orange);
        it.filled_rectangle(705, 118, 715, 180, orange);

        it.print(45, 265, id(font_24), cyan, "WILGOTNOSC");
        it.print(45, 310, id(font_32), blue, "RH");
        it.print(115, 310, id(font_32), white, "-- %");

        it.filled_circle(330, 310, 22, blue);
        it.filled_circle(330, 310, 10, Color(100, 190, 255));

        it.print(445, 265, id(font_24), cyan, "GNIAZDKO");
        it.print(445, 310, id(font_18), gray, "Stan urzadzenia");

        it.filled_circle(710, 310, 25, green);
        it.filled_circle(710, 310, 10, navy);

        it.print(24, 425, id(font_14), gray, "DOTKNIJ EKRANU, ABY PRZEJSC DALEJ");
        it.printf(690, 425, id(font_14), cyan, "1/3");

      } else if (id(aktualna_strona) == 1) {

        it.filled_rectangle(0, 0, 800, 62, Color(18, 28, 48));

        it.print(24, 14, id(font_24), cyan, "MOJA STRONA");

        auto now = id(czas).now();

        if (now.is_valid()) {
          it.strftime(610, 12, id(font_32), white, "%H:%M", now);
        } else {
          it.print(610, 12, id(font_32), white, "--:--");
        }

        it.print(280, 190, id(font_32), gray, "PUSTA STRONA");
        it.print(220, 235, id(font_18), gray, "TU DODAMY TWOJE KAFELKI");

        it.filled_rectangle(170, 290, 630, 294, Color(45, 60, 85));

        it.print(24, 425, id(font_14), gray, "MIEJSCE NA WLASNE FUNKCJE");
        it.printf(690, 425, id(font_14), cyan, "2/3");

      } else {

        it.fill(Color(7, 35, 65));

        it.filled_rectangle(0, 0, 800, 68, Color(8, 46, 82));

        it.print(28, 14, id(font_32), cyan, "POGODA");

        auto now = id(czas).now();

        if (now.is_valid()) {
          it.strftime(640, 18, id(font_24), white, "%H:%M", now);
        } else {
          it.print(640, 18, id(font_24), white, "--:--");
        }

        it.print(30, 92, id(font_18), gray, "WEJHEROWO");

        if (id(pogoda_dane_ok)) {

          it.printf(
            28,
            120,
            id(font_48),
            white,
            "%.1f°C",
            id(pogoda_temperatura)
          );

          it.print(
            30,
            178,
            id(font_24),
            white,
            id(pogoda_opis).c_str()
          );

          it.filled_circle(45, 238, 9, blue);
          it.filled_circle(45, 246, 12, blue);
          it.printf(
            70,
            230,
            id(font_18),
            white,
            "%.0f%%",
            id(pogoda_wilgotnosc)
          );

          it.print(180, 230, id(font_18), gray, "WIND");
          it.printf(
            245,
            230,
            id(font_18),
            white,
            "%.0f km/h",
            id(pogoda_wiatr)
          );

          if (id(pogoda_kod) == 0) {

            float phase = id(animacja) * 0.0174532925f;
            int move = (int)(sin(phase) * 5.0f);
            int ray = 34 + (int)(sin(phase * 2.0f) * 5.0f);

            int sx = 650;
            int sy = 155;

            it.filled_circle(sx, sy, 48, yellow);

            it.line(
              sx - ray,
              sy,
              sx - 60,
              sy,
              orange
            );

            it.line(
              sx + 60,
              sy,
              sx + ray,
              sy,
              orange
            );

            it.line(
              sx,
              sy - ray,
              sx,
              sy - 60,
              orange
            );

            it.line(
              sx,
              sy + 60,
              sx,
              sy + ray,
              orange
            );

            it.line(
              sx - 38,
              sy - 38,
              sx - ray,
              sy - ray,
              orange
            );

            it.line(
              sx + 38,
              sy - 38,
              sx + ray,
              sy - ray,
              orange
            );

            it.line(
              sx - 38,
              sy + 38,
              sx - ray,
              sy + ray,
              orange
            );

            it.line(
              sx + 38,
              sy + 38,
              sx + ray,
              sy + ray,
              orange
            );

            it.filled_circle(
              585 + move,
              205,
              25,
              white
            );

            it.filled_circle(
              615 + move,
              195,
              32,
              white
            );

            it.filled_circle(
              650 + move,
              207,
              24,
              white
            );

            it.filled_rectangle(
              585 + move,
              205,
              674 + move,
              225,
              white
            );

          } else {

            it.image(
              500,
              90,
              id(ikona_pogoda_duza)
            );

          }

        } else {

          it.print(
            30,
            130,
            id(font_24),
            gray,
            "POBIERANIE DANYCH..."
          );

          it.image(
            500,
            90,
            id(ikona_pogoda_duza)
          );

        }

        it.filled_rectangle(
          20,
          300,
          780,
          382,
          Color(12, 55, 88)
        );

        it.print(
          35,
          315,
          id(font_14),
          gray,
          "DANE Z INTERNETU"
        );

        it.print(
          35,
          345,
          id(font_18),
          white,
          "OPEN-METEO"
        );

        it.print(
          225,
          345,
          id(font_18),
          white,
          "WEJHEROWO"
        );

        it.printf(
          440,
          345,
          id(font_18),
          white,
          "WIATR %.0f km/h",
          id(pogoda_wiatr)
        );

        it.image(
          690,
          310,
          id(ikona_pogoda_mala)
        );

        it.print(
          28,
          405,
          id(font_14),
          gray,
          "AKTUALNA POGODA"
        );

        it.printf(
          690,
          405,
          id(font_14),
          cyan,
          "3/3"
        );

      }

touchscreen:

  - platform: gt911
    id: ekran_dotykowy

    display: ekran

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

    on_touch:
      - lambda: |-
          if (touch.x < 267) {
            id(aktualna_strona) = 0;
          } else if (touch.x < 534) {
            id(aktualna_strona) = 1;
          } else {
            id(aktualna_strona) = 2;
          }

          id(ekran).update();