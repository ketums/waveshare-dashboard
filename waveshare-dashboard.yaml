esphome:
  name: waveshare-dashboard
  friendly_name: Waveshare 4.3 Dashboard

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:


# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub


# ============================================================
# I2C
# GPIO8 = SDA
# GPIO9 = SCL
# ============================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true


# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: zegar
    timezone: Europe/Warsaw


# ============================================================
# CZCIONKI
# Plik Roboto-Regular.ttf musi być w katalogu YAML
# ============================================================

font:
  - file: "Roboto-Regular.ttf"
    id: font_small
    size: 18

  - file: "Roboto-Regular.ttf"
    id: font_medium
    size: 25

  - file: "Roboto-Regular.ttf"
    id: font_large
    size: 42

  - file: "Roboto-Regular.ttf"
    id: font_title
    size: 30


# ============================================================
# WIFI - SIŁA SYGNAŁU
# ============================================================

sensor:

  - platform: wifi_signal
    name: "Siła WiFi"
    id: wifi_signal_db
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0


# ============================================================
# CZAS PRACY
# ============================================================

  - platform: uptime
    name: "Czas pracy panelu"
    id: uptime_panel
    update_interval: 10s
    unit_of_measurement: "s"


# ============================================================
# INFORMACJE WIFI / IP
# ============================================================

text_sensor:

  - platform: wifi_info
    ip_address:
      name: "Adres IP panelu"
      id: adres_ip

    ssid:
      name: "Sieć WiFi"
      id: nazwa_wifi


# ============================================================
# WYŚWIETLACZ
# STABILNY RGB_PANEL 800x480
# ============================================================

display:
  - platform: rgb_panel
    id: ekran

    width: 800
    height: 480

    hsync_pin: 45
    vsync_pin: 4
    de_pin: 5
    pclk_pin: 7

    pclk_frequency: 14MHz

    data_pins:
      - 42
      - 41
      - 40
      - 39
      - 48
      - 47
      - 21
      - 14
      - 13
      - 12
      - 11
      - 10
      - 9
      - 46
      - 3
      - 8

    color_order: RGB

    update_interval: 1s

    lambda: |-

      // ======================================================
      // TŁO
      // ======================================================

      it.fill(Color(15, 18, 24));


      // ======================================================
      // GÓRNY PASEK
      // ======================================================

      it.filled_rectangle(
        0, 0,
        800, 70,
        Color(25, 30, 40)
      );

      it.print(
        20, 17,
        id(font_title),
        Color(255, 255, 255),
        "SMART HOME"
      );


      // ======================================================
      // ZEGAR
      // ======================================================

      auto now = id(zegar).now();

      if (now.is_valid()) {

        it.printf(
          780, 12,
          id(font_large),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "%02d:%02d",
          now.hour,
          now.minute
        );

      } else {

        it.print(
          780, 18,
          id(font_medium),
          Color(255, 255, 255),
          TextAlign::TOP_RIGHT,
          "--:--"
        );

      }


      // ======================================================
      // PODZIAŁ GŁÓWNEGO EKRANU
      // ======================================================

      it.filled_rectangle(
        399, 70,
        401, 420,
        Color(70, 75, 85)
      );

      it.filled_rectangle(
        0, 285,
        800, 287,
        Color(70, 75, 85)
      );


      // ======================================================
      // ROLETY OKIENNE
      // ======================================================

      it.print(
        200, 88,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ROLETY OKIENNE"
      );


      // GÓRA

      it.filled_rectangle(
        25, 140,
        130, 205,
        Color(40, 45, 55)
      );

      it.print(
        77, 157,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "GÓRA"
      );


      // STOP

      it.filled_rectangle(
        145, 140,
        250, 205,
        Color(40, 45, 55)
      );

      it.print(
        197, 157,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "STOP"
      );


      // DÓŁ

      it.filled_rectangle(
        265, 140,
        370, 205,
        Color(40, 45, 55)
      );

      it.print(
        317, 157,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "DÓŁ"
      );


      it.print(
        200, 225,
        id(font_small),
        Color(150, 160, 175),
        TextAlign::TOP_CENTER,
        "STEROWANIE ROLETAMI"
      );


      // ======================================================
      // KLIMATYZACJA
      // ======================================================

      it.print(
        600, 88,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ROTENSO"
      );

      it.print(
        600, 120,
        id(font_title),
        Color(100, 200, 255),
        TextAlign::TOP_CENTER,
        "KLIMATYZACJA"
      );


      // ON / OFF

      it.filled_rectangle(
        440, 155,
        560, 215,
        Color(40, 45, 55)
      );

      it.print(
        500, 172,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "ON / OFF"
      );


      // TRYB

      it.filled_rectangle(
        580, 155,
        760, 215,
        Color(40, 45, 55)
      );

      it.print(
        670, 172,
        id(font_small),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "TRYB"
      );


      it.print(
        600, 235,
        id(font_small),
        Color(150, 160, 175),
        TextAlign::TOP_CENTER,
        "STATUS: GOTOWA"
      );


      // ======================================================
      // CZUJNIK ZIGBEE
      // ======================================================

      it.print(
        200, 310,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "CZUJNIK ZIGBEE"
      );


      it.print(
        120, 360,
        id(font_large),
        Color(255, 180, 80),
        TextAlign::TOP_CENTER,
        "21.5°C"
      );


      it.print(
        300, 370,
        id(font_medium),
        Color(100, 200, 255),
        TextAlign::TOP_CENTER,
        "55% RH"
      );


      // ======================================================
      // STATUS SYSTEMU
      // ======================================================

      it.print(
        600, 310,
        id(font_medium),
        Color(255, 255, 255),
        TextAlign::TOP_CENTER,
        "STATUS SYSTEMU"
      );


      it.print(
        600, 355,
        id(font_medium),
        Color(100, 255, 130),
        TextAlign::TOP_CENTER,
        "ESP32 ONLINE"
      );


      // ======================================================
      // DOLNY PASEK STATUSU
      // ======================================================

      it.filled_rectangle(
        0, 420,
        800, 60,
        Color(22, 27, 36)
      );


      // WiFi

      it.print(
        15, 428,
        id(font_small),
        Color(180, 190, 200),
        TextAlign::TOP_LEFT,
        "WiFi:"
      );


      if (!isnan(id(wifi_signal_db).state)) {

        it.printf(
          70, 428,
          id(font_small),
          Color(100, 200, 255),
          TextAlign::TOP_LEFT,
          "%.0f dBm",
          id(wifi_signal_db).state
        );

      } else {

        it.print(
          70, 428,
          id(font_small),
          Color(255, 120, 120),
          TextAlign::TOP_LEFT,
          "---"
        );

      }


      // IP

      it.print(
        175, 428,
        id(font_small),
        Color(180, 190, 200),
        TextAlign::TOP_LEFT,
        "IP:"
      );


      if (id(adres_ip).has_state()) {

        it.print(
          210, 428,
          id(font_small),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          id(adres_ip).state.c_str()
        );

      } else {

        it.print(
          210, 428,
          id(font_small),
          Color(255, 120, 120),
          TextAlign::TOP_LEFT,
          "---"
        );

      }


      // POŁĄCZENIE

      if (WiFi.isConnected()) {

        it.print(
          430, 428,
          id(font_small),
          Color(100, 255, 130),
          TextAlign::TOP_LEFT,
          "POŁĄCZONO"
        );

      } else {

        it.print(
          430, 428,
          id(font_small),
          Color(255, 100, 100),
          TextAlign::TOP_LEFT,
          "BRAK WIFI"
        );

      }


      // UPTIME

      if (!isnan(id(uptime_panel).state)) {

        uint32_t sekundy =
          (uint32_t) id(uptime_panel).state;

        uint32_t godziny =
          sekundy / 3600;

        uint32_t minuty =
          (sekundy % 3600) / 60;

        it.printf(
          780, 428,
          id(font_small),
          Color(160, 170, 180),
          TextAlign::TOP_RIGHT,
          "%uh %02um",
          godziny,
          minuty
        );

      }


# ============================================================
# GT911 - DOTYK
# ============================================================

touchscreen:
  - platform: gt911

    id: dotyk

    display: ekran

    i2c_id: bus_a

    address: 0x5D

    # RESET GT911 przez CH422G IO1
    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    update_interval: 50ms

    on_touch:
      - lambda: |-
          ESP_LOGI(
            "touch",
            "Dotyk: X=%d Y=%d",
            touch.x,
            touch.y
          );


# ============================================================
# PRZYCISKI DOTYKOWE - ROLETY
# ============================================================

binary_sensor:

  - platform: touchscreen
    name: "Roleta Góra"
    id: roleta_gora

    x_min: 25
    x_max: 130
    y_min: 140
    y_max: 205

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY GÓRA"
          level: INFO


  - platform: touchscreen
    name: "Roleta Stop"
    id: roleta_stop

    x_min: 145
    x_max: 250
    y_min: 140
    y_max: 205

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY STOP"
          level: INFO


  - platform: touchscreen
    name: "Roleta Dół"
    id: roleta_dol

    x_min: 265
    x_max: 370
    y_min: 140
    y_max: 205

    on_press:
      - logger.log:
          format: "Naciśnięto ROLETY DÓŁ"
          level: INFO


# ============================================================
# PRZYCISK KLIMATYZACJI
# ============================================================

  - platform: touchscreen
    name: "Klimatyzacja"
    id: klimatyzacja

    x_min: 440
    x_max: 560
    y_min: 155
    y_max: 215

    on_press:
      - logger.log:
          format: "Naciśnięto KLIMATYZACJA"
          level: INFO


# ============================================================
# TRYB KLIMATYZACJI
# ============================================================

  - platform: touchscreen
    name: "Tryb klimatyzacji"
    id: tryb_klimatyzacji

    x_min: 580
    x_max: 760
    y_min: 155
    y_max: 215

    on_press:
      - logger.log:
          format: "Naciśnięto TRYB KLIMATYZACJI"
          level: INFO