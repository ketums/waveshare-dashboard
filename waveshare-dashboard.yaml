              105,
              id(animacja_slonecznie)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              Color(255, 220, 60),
              TextAlign::TOP_CENTER,
              "BEZCHMURNIE"
            );

          } else if (
            id(kod_pogody) == 0 &&
            id(pora_dnia) == 0
          ) {

            it.image(
              390,
              105,
              id(animacja_noc)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              bialy,
              TextAlign::TOP_CENTER,
              "BEZCHMURNA NOC"
            );

          } else if (
            id(kod_pogody) >= 1 &&
            id(kod_pogody) <= 3
          ) {

            it.image(
              390,
              105,
              id(animacja_zachmurzenie)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              Color(255, 220, 60),
              TextAlign::TOP_CENTER,
              "ZACHMURZENIE"
            );

          } else if (
            id(kod_pogody) >= 45 &&
            id(kod_pogody) <= 48
          ) {

            it.image(
              390,
              105,
              id(animacja_mgla)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              szary,
              TextAlign::TOP_CENTER,
              "MGLA"
            );

          } else if (
            (id(kod_pogody) >= 51 &&
             id(kod_pogody) <= 67) ||
            (id(kod_pogody) >= 80 &&
             id(kod_pogody) <= 82)
          ) {

            it.image(
              390,
              105,
              id(animacja_deszcz)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              niebieski,
              TextAlign::TOP_CENTER,
              "DESZCZ"
            );

          } else if (
            (id(kod_pogody) >= 71 &&
             id(kod_pogody) <= 77) ||
            (id(kod_pogody) >= 85 &&
             id(kod_pogody) <= 86)
          ) {

            it.image(
              390,
              105,
              id(animacja_snieg)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              bialy,
              TextAlign::TOP_CENTER,
              "SNIEG"
            );

          } else if (id(kod_pogody) >= 95) {

            it.image(
              390,
              105,
              id(animacja_burza)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              Color(255, 220, 60),
              TextAlign::TOP_CENTER,
              "BURZA"
            );

          } else {

            it.image(
              390,
              105,
              id(animacja_zachmurzenie)
            );

            it.print(
              620,
              285,
              id(font_srednia),
              szary,
              TextAlign::TOP_CENTER,
              "POGODA"
            );
          }

          it.line(
            35,
            315,
            765,
            315,
            ramka
          );

          if (now.is_valid()) {

            it.strftime(
              45,
              350,
              id(font_srednia),
              szary,
              TextAlign::TOP_LEFT,
              "%d.%m.%Y",
              now
            );

            it.strftime(
              760,
              340,
              id(font_duza),
              bialy,
              TextAlign::TOP_RIGHT,
              "%H:%M",
