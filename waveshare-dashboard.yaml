touchscreen:
  - platform: gt911
    id: panel_dotykowy
    i2c_id: bus_i2c

    interrupt_pin: GPIO4

    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-
          int x = touch.x;
          int y = touch.y;

          ESP_LOGI(
            "TOUCH",
            "Dotyk X=%d Y=%d",
            x,
            y
          );

          if (id(aktualna_strona) == 2) {
            id(aktualna_strona) = 0;
            return;
          }

          if (y >= 0 && y <= 70) {
            id(aktualna_strona) =
              (id(aktualna_strona) + 1) % 3;
            return;
          }

          if (id(aktualna_strona) == 0) {

            if (y >= 170 && y <= 220) {

              if (x >= 30 && x <= 130) {
                ESP_LOGI(
                  "TOUCH",
                  "OTWORZ OKNA"
                );
              }

              else if (x >= 140 && x <= 240) {
                ESP_LOGI(
                  "TOUCH",
                  "STOP ROLETY"
                );
              }

              else if (x >= 250 && x <= 350) {
                ESP_LOGI(
                  "TOUCH",
                  "ZAMKNIJ OKNA"
                );
              }

              else if (x >= 430 && x <= 490) {
                ESP_LOGI(
                  "TOUCH",
                  "TEMP -"
                );
              }

              else if (x >= 580 && x <= 640) {
                ESP_LOGI(
                  "TOUCH",
                  "TEMP +"
                );
              }
            }

            if (
              x >= 420 &&
              x <= 780 &&
              y >= 285 &&
              y <= 460
            ) {
              ESP_LOGI(
                "TOUCH",
                "OGRZEWANIE"
              );
            }
          }