esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

  - id: pogoda_temp
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_odczuwalna
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_opad
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_kod
    type: int
    restore_value: no
    initial_value: '-1'

  - id: pogoda_online
    type: bool
    restore_value: no
    initial_value: 'false'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  timeout: 10s

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"

    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

# ============================================================
# POGODA Z INTERNETU - OPEN METEO
# ============================================================

interval:
  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.605&longitude=18.235&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=Europe%2FWarsaw"
          capture_response: true
          max_response_buffer_size: 2048

          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          JsonObject current = root["current"];

                          id(pogoda_temp) =
                            current["temperature_2m"].as<float>();

                          id(pogoda_odczuwalna) =
                            current["apparent_temperature"].as<float>();

                          id(pogoda_wilgotnosc) =
                            current["relative_humidity_2m"].as<float>();

                          id(pogoda_wiatr) =
                            current["wind_speed_10m"].as<float>();

                          id(pogoda_opad) =
                            current["precipitation"].as<float>();

                          id(pogoda_kod) =
                            current["weather_code"].as<int>();

                          id(pogoda_online) = true;

                          return true;
                        });

                  else:
                    - lambda: |-
                        id(pogoda_online) = false;

# ============================================================
# WYŚWIETLACZ
# ============================================================

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran_waveshare
    rotation: 0
    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-

      auto time_now = id(czas_sntp).now();
      uint32_t ms = millis();

      # ======================================================
      # STRONA 3 - POGODA
      # ======================================================

      if (id(aktualna_strona) == 2) {

        it.fill(Color(8, 16, 30));

        it.rectangle(
          0, 0, 800, 65,
          Color(15, 30, 52)
        );

        it.print(
          25, 18,
          id(font_srednia),
          Color(220, 230, 245),
          TextAlign::TOP_LEFT,
          "WEJHEROWO"
        );

        if (id(pogoda_online)) {

          it.print(
            775, 18,
            id(font_mala),
            Color(80, 220, 130),
            TextAlign::TOP_RIGHT,
            "ONLINE"
          );

        } else {

          it.print(
            775, 18,
            id(font_mala),
            Color(240, 100, 100),
            TextAlign::TOP_RIGHT,
            "BRAK DANYCH"
          );
        }

        int kod = id(pogoda_kod);

        # ------------------------------------------------------
        # SŁOŃCE
        # ------------------------------------------------------

        if (kod == 0 || kod == 1) {

          int cx = 210;
          int cy = 230;

          float angle =
            (ms % 8000) *
            (2.0 * 3.14159265 / 8000.0);

          for (int i = 0; i < 12; i++) {

            float a =
              angle +
              i * (2.0 * 3.14159265 / 12.0);

            int x1 =
              cx + 55 * cosf(a);

            int y1 =
              cy + 55 * sinf(a);

            int x2 =
              cx + 82 * cosf(a);

            int y2 =
              cy + 82 * sinf(a);

            it.line(
              x1,
              y1,
              x2,
              y2,
              Color(255, 190, 40)
            );
          }

          it.filled_circle(
            cx,
            cy,
            48,
            Color(255, 190, 35)
          );

          it.filled_circle(
            cx - 10,
            cy - 10,
            34,
            Color(255, 225, 90)
          );

        # ------------------------------------------------------
        # CHMURY
        # ------------------------------------------------------

        } else if (kod == 2 || kod == 3) {

          int move =
            (ms / 40) % 80;

          int cx =
            150 + move;

          int cy = 215;

          it.filled_circle(
            cx - 60,
            cy + 15,
            35,
            Color(100, 125, 155)
          );

          it.filled_circle(
            cx - 10,
            cy - 10,
            50,
            Color(155, 180, 210)
          );

          it.filled_circle(
            cx + 45,
            cy + 15,
            38,
            Color(115, 140, 170)
          );

          it.filled_rectangle(
            cx - 65,
            cy + 15,
            135,
            40,
            Color(140, 165, 195)
          );

        # ------------------------------------------------------
        # MGŁA
        # ------------------------------------------------------

        } else if (kod == 45 || kod == 48) {

          for (int i = 0; i < 7; i++) {

            int shift =
              (ms / 25 + i * 40) % 150;

            int y =
              145 + i * 30;

            it.line(
              40 + shift,
              y,
              350 + shift,
              y,
              Color(155, 175, 195)
            );
          }

        # ------------------------------------------------------
        # DESZCZ
        # ------------------------------------------------------

        } else if (
          (kod >= 51 && kod <= 67) ||
          (kod >= 80 && kod <= 82)
        ) {

          int cx = 210;
          int cy = 175;

          it.filled_circle(
            cx - 65,
            cy + 20,
            38,
            Color(85, 110, 140)
          );

          it.filled_circle(
            cx - 10,
            cy - 5,
            52,
            Color(135, 160, 190)
          );

          it.filled_circle(
            cx + 45,
            cy + 20,
            40,
            Color(100, 125, 155)
          );

          it.filled_rectangle(
            cx - 70,
            cy + 20,
            135,
            42,
            Color(125, 150, 180)
          );

          for (int i = 0; i < 25; i++) {

            int x =
              80 + ((i * 43) % 270);

            int y =
              250 + ((ms / 6 + i * 29) % 170);

            it.line(
              x,
              y,
              x - 4,
              y + 17,
              Color(60, 175, 245)
            );
          }

        # ------------------------------------------------------
        # ŚNIEG
        # ------------------------------------------------------

        } else if (
          (kod >= 71 && kod <= 77) ||
          kod == 85 ||
          kod == 86
        ) {

          int cx = 210;
          int cy = 175;

          it.filled_circle(
            cx - 65,
            cy + 20,
            38,
            Color(120, 140, 165)
          );

          it.filled_circle(
            cx - 10,
            cy - 5,
            52,
            Color(175, 195, 215)
          );

          it.filled_circle(
            cx + 45,
            cy + 20,
            40,
            Color(145, 165, 190)
          );

          it.filled_rectangle(
            cx - 70,
            cy + 20,
            135,
            42,
            Color(160, 180, 200)
          );

          for (int i = 0; i < 25; i++) {

            int x =
              80 + ((i * 47) % 270);

            int y =
              250 + ((ms / 8 + i * 37) % 170);

            it.filled_circle(
              x,
              y,
              4,
              Color(245, 250, 255)
            );
          }

        # ------------------------------------------------------
        # BURZA
        # ------------------------------------------------------

        } else if (kod >= 95) {

          int cx = 210;
          int cy = 170;

          it.filled_circle(
            cx - 65,
            cy + 20,
            40,
            Color(65, 75, 95)
          );

          it.filled_circle(
            cx - 10,
            cy - 5,
            55,
            Color(90, 100, 120)
          );

          it.filled_circle(
            cx + 50,
            cy + 20,
            42,
            Color(70, 80, 100)
          );

          it.filled_rectangle(
            cx - 75,
            cy + 20,
            150,
            45,
            Color(80, 90, 110)
          );

          for (int i = 0; i < 18; i++) {

            int x =
              80 + ((i * 43) % 270);

            int y =
              260 + ((ms / 5 + i * 29) % 150);

            it.line(
              x,
              y,
              x - 5,
              y + 18,
              Color(70, 175, 245)
            );
          }

          if ((ms / 250) % 4 < 2) {

            it.line(
              210, 235,
              185, 290,
              Color(255, 240, 80)
            );

            it.line(
              185, 290,
              215, 290,
              Color(255, 240, 80)
            );

            it.line(
              215, 290,
              195, 340,
              Color(255, 240, 80)
            );
          }

        } else {

          it.filled_circle(
            210,
            220,
            50,
            Color(90, 110, 135)
          );

          it.print(
            210,
            285,
            id(font_mala),
            Color(180, 195, 215),
            TextAlign::TOP_CENTER,
            "Brak danych"
          );
        }

        # ======================================================
        # PRAWA CZĘŚĆ - INFORMACJE
        # ======================================================

        it.rectangle(
          420,
          90,
          360,
          325,
          Color(25, 40, 62)
        );

        if (id(pogoda_online)) {

          it.printf(
            445,
            110,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::TOP_LEFT,
            "%.1f°C",
            id(pogoda_temp)
          );

          it.printf(
            445,
            165,
            id(font_mala),
            Color(170, 190, 215),
            TextAlign::TOP_LEFT,
            "Odczuwalna %.1f°C",
            id(pogoda_odczuwalna)
          );

          it.printf(
            445,
            215,
            id(font_srednia),
            Color(90, 200, 250),
            TextAlign::TOP_LEFT,
            "Wilgotnosc %.0f%%",
            id(pogoda_wilgotnosc)
          );

          it.printf(
            445,
            260,
            id(font_srednia),
            Color(170, 205, 235),
            TextAlign::TOP_LEFT,
            "Wiatr %.1f km/h",
            id(pogoda_wiatr)
          );

          it.printf(
            445,
            305,
            id(font_mala),
            Color(160, 180, 205),
            TextAlign::TOP_LEFT,
            "Opad %.1f mm",
            id(pogoda_opad)
          );

          if (kod == 0) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(255, 210, 70),
              TextAlign::TOP_LEFT,
              "Bezchmurnie"
            );

          } else if (kod == 1) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(255, 210, 70),
              TextAlign::TOP_LEFT,
              "Przewaznie bezchmurnie"
            );

          } else if (kod == 2) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(190, 205, 225),
              TextAlign::TOP_LEFT,
              "Czesciowe zachmurzenie"
            );

          } else if (kod == 3) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(170, 185, 205),
              TextAlign::TOP_LEFT,
              "Pochmurno"
            );

          } else if (kod == 45 || kod == 48) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(180, 190, 200),
              TextAlign::TOP_LEFT,
              "Mgla"
            );

          } else if (
            (kod >= 51 && kod <= 67) ||
            (kod >= 80 && kod <= 82)
          ) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(80, 185, 245),
              TextAlign::TOP_LEFT,
              "Deszcz"
            );

          } else if (
            (kod >= 71 && kod <= 77) ||
            kod == 85 ||
            kod == 86
          ) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(235, 245, 255),
              TextAlign::TOP_LEFT,
              "Snieg"
            );

          } else if (kod >= 95) {

            it.print(
              445,
              350,
              id(font_mala),
              Color(255, 220, 70),
              TextAlign::TOP_LEFT,
              "Burza"
            );

          } else {

            it.print(
              445,
              350,
              id(font_mala),
              Color(180, 195, 215),
              TextAlign::TOP_LEFT,
              "Warunki pogodowe"
            );
          }

        } else {

          it.print(
            600,
            180,
            id(font_srednia),
            Color(180, 195, 215),
            TextAlign::CENTER,
            "POBIERANIE"
          );

          it.print(
            600,
            215,
            id(font_mala),
            Color(130, 150, 175),
            TextAlign::CENTER,
            "danych pogodowych..."
          );
        }

        if (time_now.is_valid()) {

          it.strftime(
            775,
            435,
            id(font_mala),
            Color(130, 150, 175),
            TextAlign::BOTTOM_RIGHT,
            "%H:%M:%S",
            time_now
          );
        }

        return;
      }

      # ======================================================
      # STRONA 1
      # ======================================================

      if (id(aktualna_strona) == 0) {

        it.fill(Color(18, 24, 38));

        it.rectangle(
          10,
          10,
          780,
          460,
          Color(45, 55, 72)
        );

        it.line(
          10,
          70,
          790,
          70,
          Color(45, 55, 72)
        );

        it.line(
          400,
          70,
          400,
          470,
          Color(45, 55, 72)
        );

        it.line(
          10,
          270,
          790,
          270,
          Color(45, 55, 72)
        );

        it.print(
          25,
          20,
          id(font_srednia),
          Color(200, 210, 225),
          TextAlign::TOP_LEFT,
          "DASHBOARD"
        );

        it.print(
          770,
          75,
          id(font_mala),
          Color(120, 130, 145),
          TextAlign::TOP_RIGHT,
          "STRONA 1/3"
        );

        if (id(wifi_ssid).has_state()) {

          it.print(
            285,
            18,
            id(font_srednia),
            Color(72, 187, 120),
            TextAlign::TOP_LEFT,
            "WIFI OK"
          );

        } else {

          it.print(
            285,
            18,
            id(font_srednia),
            Color(229, 62, 62),
            TextAlign::TOP_LEFT,
            "WIFI OFF"
          );
        }

        if (!isnan(id(wifi_sila).state)) {

          it.printf(
            390,
            20,
            id(font_mala),
            Color(180, 190, 205),
            TextAlign::TOP_LEFT,
            "%0.0f dBm",
            id(wifi_sila).state
          );
        }

        if (id(wifi_ip).has_state()) {

          it.printf(
            770,
            20,
            id(font_mala),
            Color(90, 200, 250),
            TextAlign::TOP_RIGHT,
            "%s",
            id(wifi_ip).state.c_str()
          );
        }

        # ------------------------------------------------------
        # ROLETY
        # ------------------------------------------------------

        it.print(
          30,
          90,
          id(font_srednia),
          Color(237, 137, 54),
          TextAlign::TOP_LEFT,
          "ROLETY OKIENNE"
        );

        it.print(
          30,
          130,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "okno 1 & okno 2"
        );

        it.rectangle(
          30,
          170,
          100,
          50,
          Color(66, 153, 225)
        );

        it.print(
          80,
          185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "OTWÓRZ"
        );

        it.rectangle(
          140,
          170,
          100,
          50,
          Color(229, 62, 62)
        );

        it.print(
          190,
          185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STOP"
        );

        it.rectangle(
          250,
          170,
          100,
          50,
          Color(66, 153, 225)
        );

        it.print(
          300,
          185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ZAMKNIJ"
        );

        # ------------------------------------------------------
        # KLIMATYZACJA
        # ---------------------------------------------------