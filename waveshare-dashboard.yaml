esphome:
  name: waveshare-dashboard
  friendly_name: Waveshare Dashboard

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

api:

ota:
  - platform: esphome

time:
  - platform: sntp
    id: czas
    timezone: Europe/Warsaw

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    scan: true

output:
  - platform: ledc
    pin: GPIO4
    id: backlight_pin

light:
  - platform: monochromatic
    output: backlight_pin
    name: "Podświetlenie ekranu"
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON

display:
  - platform: rpi_dpi_rgb
    id: ekran
    update_interval: 1s
    auto_clear_enabled: true
    color_order: RGB

    dimensions:
      width: 800
      height: 480

    pclk_frequency: 16MHz

    de_pin:
      number: GPIO5

    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true

    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true

    pclk_pin: GPIO7

    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30

    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4

    data_pins:
      red:
        - GPIO1
        - GPIO2
        - GPIO42
        - GPIO41
        - GPIO40

      green:
        - GPIO39
        - GPIO0
        - GPIO45
        - GPIO48
        - GPIO47
        - GPIO21

      blue:
        - GPIO14
        - GPIO38
        - GPIO18
        - GPIO17
        - GPIO10

    lambda: |-
      it.fill(Color(0, 0, 0));
      it.rectangle(0, 0, 799, 479, Color(0, 255, 255));
      it.filled_rectangle(20, 20, 760, 440, Color(0, 0, 80));
      it.print(400, 120, id(font_test), Color(255, 255, 255), TextAlign::CENTER, "WAVESHARE");
      it.print(400, 190, id(font_test), Color(0, 255, 255), TextAlign::CENTER, "ESP32-S3");
      it.print(400, 260, id(font_test), Color(255, 255, 0), TextAlign::CENTER, "800 x 480");
      it.print(400, 330, id(font_test), Color(255, 255, 255), TextAlign::CENTER, "TEST EKRANU");

      if (id(czas).now().is_valid()) {
        it.strftime(400, 400, id(font_small), Color(255, 255, 255), TextAlign::CENTER, "%H:%M:%S", id(czas).now());
      }

font:
  - file: "Roboto-Regular.ttf"
    id: font_test
    size: 42
    glyphsets:
      - GF_Latin_Core

  - file: "Roboto-Regular.ttf"
    id: font_small
    size: 28
    glyphsets:
      - GF_Latin_Core
