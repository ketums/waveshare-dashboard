    initial_value: '0'

  - id: pogoda_wilgotnosc
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: '0'

  - id: pogoda_dane_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: pogoda_opis
