esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:


# ============================================================
# KLIENT HTTP & POBIERANIE POGODY Z OPEN-METEO
# ============================================================

http_request:
  id: klient_http
  useragent: "ESPHome Waveshare"
  timeout: 5s

globals:
  - id: p_temp
    type: float
    initial_value: '0.0'
  - id: p_wilg
    type: float
    initial_value: '0.0'
  - id: p_cisnienie
    type: float
    initial_value: '0.0'
  - id: p_wiatr
    type: float
    initial_value: '0.0'
  - id: p_dane_ok
    type: bool
    initial_value: 'false'

interval:
  - interval: 10min
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.6067&longitude=18.2458&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m"
          on_response:
            then:
              - lambda: |-
                  JsonDocument doc;
                  auto error = deserializeJson(doc, body);
                  if (!error) {
                    id(p_temp) = doc["current"]["temperature_2m"];
                    id(p_wilg) = doc["current"]["relative_humidity_2m"];
                    id(p_cisnienie) = doc["current"]["surface_pressure"];
                    id(p_wiatr) = doc["current"]["wind_speed_10m"];
                    id(p_dane_ok) = true;
                  }


# ============================================================
# SKRYPTY AKCJI HTTP
# ============================================================

script:
  - id: akcja_otworz_roleta
    then:
      - http_request.post:
          url: "https://openapi.tuyaeu.com/v1.0/token"
          json: {}

  - id: akcja_stop_roleta
    then:
      - http_request.post:
          url: "https://openapi.tuyaeu.com/v1.0/token"
          json: {}

  - id: akcja_zamknij_roleta
    then:
      - http_request.post:
          url: "https://openapi.tuyaeu.com/v1.0/token"
          json: {}

  - id: akcja_klima_down
    then:
      - http_request.post:
          url: "https://openapi.tuyaeu.com/v1.0/token"
          json: {}

  - id: akcja_klima_up
    then:
      - http_request.post:
          url: "https://openapi.tuyaeu.com/v1.0/token"
          json: {}


# ============================================================
# ZMIENNA - AKTUALNA STRONA (0, 1 lub 2)
# ============================================================

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'


# ============================================================
# CH422G
# ============================================================

ch422g:
  - id: ch422g_hub


# ============================================================
# I2C
# GPIO8  = SDA
# GPIO9  = SCL
# ============================================================

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true


# ============================================================
# CZAS
# ============================================================

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw


# ============================================================
# CZCIONKI
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16


# ============================================================
# WYŚWIETLACZ WAVESHARE
# ESP32-S3-Touch-LCD-4.3
# 800 x 480
# ============================================================

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3

    id: ekran_waveshare

    rotation: 0

    update_interval: 1s

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-

      // ======================================================
      // TŁO
      // ======================================================

      it.fill(Color(18, 24, 38));

      // Ramka

      it.rectangle(
        10, 10,
        780, 460,
        Color(45, 55, 72)
      );

      // Linia nagłówka

      it.line(
        10, 70,
        790, 70,
        Color(45, 55, 72)
      );


      // ======================================================
      // ZEGAR
      // ======================================================

      auto time_now = id(czas_sntp).now();

      if (time_now.is_valid()) {

        it.strftime(
          30, 20,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "%H:%M",
          time_now
        );

      } else {

        it.print(
          30, 20,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "--:--"
        );

      }


      // ======================================================
      // STRONA 1 (GŁÓWNA)
      // ======================================================

      if (id(aktualna_strona) == 0) {

        it.print(
          770, 25,
          id(font_srednia),
          Color(72, 187, 120),
          TextAlign::TOP_RIGHT,
          "STRONA 1/3"
        );


        // ----------------------------------------------------
        // PODZIAŁ EKRANU
        // ----------------------------------------------------

        it.line(
          400, 70,
          400, 470,
          Color(45, 55, 72)
        );

        it.line(
          10, 270,
          790, 270,
          Color(45, 55, 72)
        );


        // ====================================================
        // ROLETY
        // ====================================================

        it.print(
          30, 90,
          id(font_srednia),
          Color(237, 137, 54),
          TextAlign::TOP_LEFT,
          "ROLETY OKIENNE"
        );

        it.print(
          30, 130,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "okno 1 & okno 2"
        );


        // OTWÓRZ

        it.rectangle(
          30, 170,
          100, 50,
          Color(66, 153, 225)
        );

        it.print(
          80, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "OTWÓRZ"
        );


        // STOP

        it.rectangle(
          140, 170,
          100, 50,
          Color(229, 62, 62)
        );

        it.print(
          190, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "STOP"
        );


        // ZAMKNIJ

        it.rectangle(
          250, 170,
          100, 50,
          Color(66, 153, 225)
        );

        it.print(
          300, 185,
          id(font_mala),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "ZAMKNIJ"
        );


        // ====================================================
        // KLIMATYZACJA ROTENSO
        // ====================================================

        it.print(
          430, 90,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_LEFT,
          "KLIMATYZACJA"
        );

        it.print(
          430, 120,
          id(font_mala),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "ROTENSO"
        );


        // MINUS

        it.rectangle(
          430, 170,
          60, 50,
          Color(66, 153, 225)
        );

        it.print(
          460, 177,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "-"
        );


        // TEMPERATURA

        it.print(
          535, 175,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "22°C"
        );


        // PLUS

        it.rectangle(
          580, 170,
          60, 50,
          Color(229, 62, 62)
        );

        it.print(
          610, 177,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "+"
        );


        // ====================================================
        // CZUJNIK ZIGBEE
        // ====================================================

        it.print(
          30, 290,
          id(font_srednia),
          Color(72, 187, 120),
          TextAlign::TOP_LEFT,
          "CZUJNIK ZIGBEE"
        );

        it.print(
          30, 340,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "21.5 °C"
        );

        it.print(
          30, 400,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_LEFT,
          "Wilgotność: 55%"
        );

      }


      // ======================================================
      // STRONA 2 (DRUGI KAFEL)
      // ======================================================

      else if (id(aktualna_strona) == 1) {

        it.print(
          770, 25,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_RIGHT,
          "STRONA 2/3"
        );


        it.print(
          400, 150,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_CENTER,
          "DRUGI KAFEL"
        );


        it.print(
          400, 220,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "Miejsce na kolejne"
        );

        it.print(
          400, 250,
          id(font_srednia),
          Color(160, 174, 192),
          TextAlign::TOP_CENTER,
          "przyciski i sensory"
        );

      }


      // ======================================================
      // STRONA 3 (DASHBOARD POGODOWY Z IKONAMI)
      // ======================================================

      else {

        it.print(
          770, 25,
          id(font_srednia),
          Color(237, 137, 54),
          TextAlign::TOP_RIGHT,
          "STRONA 3/3 (POGODA)"
        );

        it.print(
          40, 90,
          id(font_srednia),
          Color(90, 200, 250),
          TextAlign::TOP_LEFT,
          "POGODA ONLINE - WEJHEROWO"
        );

        it.rectangle(30, 130, 740, 310, Color(30, 41, 59));

        if (id(p_dane_ok)) {
          
          char temp_buf[32];
          sprintf(temp_buf, "%.1f °C", id(p_temp));
          it.print(70, 160, id(font_duza), Color(255, 255, 255), TextAlign::TOP_LEFT, temp_buf);

          char hum_buf[32];
          sprintf(hum_buf, "Wilgotność: %.0f %%", id(p_wilg));
          it.print(70, 230, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, hum_buf);

          char press_buf[32];
          sprintf(press_buf, "Ciśnienie: %.0f hPa", id(p_cisnienie));
          it.print(70, 270, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, press_buf);

          char wind_buf[32];
          sprintf(wind_buf, "Wiatr: %.1f m/s", id(p_wiatr));
          it.print(70, 310, id(font_srednia), Color(160, 174, 192), TextAlign::TOP_LEFT, wind_buf);

          // Słońce (ikona wektorowa)
          it.filled_circle(620, 220, 45, Color(255, 204, 0));
          it.print(620, 310, id(font_srednia), Color(255, 255, 255), TextAlign::TOP_CENTER, "Słonecznie");

        } else {
          it.print(400, 250, id(font_srednia), Color(229, 62, 62), TextAlign::TOP_CENTER, "Pobieranie danych pogodowych z Wi-Fi...");
        }

      }


# ============================================================
# GT911 - DOTYK (Obsługa 3 stron)
# ============================================================

touchscreen:
  - platform: gt911

    id: panel_dotykowy

    i2c_id: bus_i2c

    # GPIO4 = INT GT911
    interrupt_pin: GPIO4

    # CH422G IO1 = RESET GT911
    reset_pin:
      ch422g: ch422g_hub
      number: 1

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      - lambda: |-

          int x = touch.x;
          int y = touch.y;

          ESP_LOGI(
            "TOUCH",
            "Dotyk X=%d Y=%d",
            x,
            y
          );


          // ==================================================
          // GÓRNY PASEK - CYKLICZNA ZMIANA STRON (0 -> 1 -> 2 -> 0)
          // ==================================================

          if (y >= 0 && y <= 70) {

            if (id(aktualna_strona) == 0) {
              id(aktualna_strona) = 1;
              ESP_LOGI("TOUCH", "Przełączono na STRONĘ 2");
            } 
            else if (id(aktualna_strona) == 1) {
              id(aktualna_strona) = 2;
              ESP_LOGI("TOUCH", "Przełączono na STRONĘ 3 (Pogoda)");
            } 
            else {
              id(aktualna_strona) = 0;
              ESP_LOGI("TOUCH", "Przełączono na STRONĘ 1 (Główna)");
            }

            return;
          }


          // ==================================================
          // STRONA 1 (GŁÓWNA)
          // ==================================================

          if (id(aktualna_strona) == 0) {

            if (y >= 170 && y <= 220) {

              // OTWÓRZ
              if (x >= 30 && x <= 130) {
                ESP_LOGI("TOUCH", "Naciśnięto: OTWÓRZ OKNA");
                id(akcja_otworz_roleta)->execute();
              }
              // STOP
              else if (x >= 140 && x <= 240) {
                ESP_LOGI("TOUCH", "Naciśnięto: STOP ROLETY");
                id(akcja_stop_roleta)->execute();
              }
              // ZAMKNIJ
              else if (x >= 250 && x <= 350) {
                ESP_LOGI("TOUCH", "Naciśnięto: ZAMKNIJ OKNA");
                id(akcja_zamknij_roleta)->execute();
              }
              // KLIMATYZACJA -
              else if (x >= 430 && x <= 490) {
                ESP_LOGI("TOUCH", "Naciśnięto: TEMP -");
                id(akcja_klima_down)->execute();
              }
              // KLIMATYZACJA +
              else if (x >= 580 && x <= 640) {
                ESP_LOGI("TOUCH", "Naciśnięto: TEMP +");
                id(akcja_klima_up)->execute();
              }

            }

          }


          // ==================================================
          // STRONA 2
          // ==================================================

          else if (id(aktualna_strona) == 1) {
            // Miejsce na akcje z drugiego kafla w przyszłości
          }


          // ==================================================
          // STRONA 3 (POGODA)
          // ==================================================

          else {
            // Ewentualne kliknięcia na stronie pogody
          }
