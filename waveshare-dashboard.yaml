esphome:
  name: waveshare-dashboard
  friendly_name: Dashboard Smart Life

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "skrapi 2,4GHZ"
  password: "RejtanA77"

  ap:
    ssid: "ESPTest"
    password: "Password123"

captive_portal:

globals:
  - id: aktualna_strona
    type: int
    restore_value: no
    initial_value: '0'

ch422g:
  - id: ch422g_hub

i2c:
  - id: bus_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: true

http_request:
  timeout: 10s

sensor:
  - platform: wifi_signal
    id: wifi_sila
    name: "Siła WiFi"
    update_interval: 10s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "Adres IP panelu"

    ssid:
      id: wifi_ssid
      name: "Sieć WiFi panelu"

time:
  - platform: sntp
    id: czas_sntp
    timezone: Europe/Warsaw

font:
  - file: "gfonts://Roboto"
    id: font_duza
    size: 42
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_srednia
    size: 22
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

  - file: "gfonts://Roboto"
    id: font_mala
    size: 16
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ĄĆĘŁŃÓŚŹŻąćęłńóśźż°"

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: ekran_waveshare
    rotation: 0
    update_interval: 500ms

    reset_pin:
      ch422g: ch422g_hub
      number: 3

    lambda: |-
      auto time_now = id(czas_sntp).now();

      // ==========================================================
      // STRONA 3 - POGODA
      // ==========================================================

      if (id(aktualna_strona) == 2) {

        it.fill(Color(8, 16, 29));

        it.rectangle(
          10, 10, 780, 460,
          Color(27, 42, 66)
        );

        it.print(
          30, 25,
          id(font_srednia),
          Color(148, 163, 184),
          TextAlign::TOP_LEFT,
          "WEJHEROWO • STACJA POGODY"
        );

        it.print(
          30, 70,
          id(font_duza),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "18.5 °C"
        );

        it.print(
          30, 125,
          id(font_srednia),
          Color(56, 189, 248),
          TextAlign::TOP_LEFT,
          "Dynamiczna strefa opadów"
        );

        if (time_now.is_valid()) {

          it.strftime(
            760, 25,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::RIGHT,
            "%H:%M",
            time_now
          );

        } else {

          it.print(
            760, 25,
            id(font_duza),
            Color(255, 255, 255),
            TextAlign::RIGHT,
            "--:--"
          );
        }

        uint32_t ms = millis();

        float angle =
          (ms % 8000) *
          (2.0 * 3.14159265 / 8000.0);

        int cx = 520;
        int cy = 245;

        for (int i = 0; i < 10; i++) {

          float a =
            angle +
            i * (2.0 * 3.14159265 / 10.0);

          int x1 =
            cx +
            32.0 * cosf(a);

          int y1 =
            cy +
            32.0 * sinf(a);

          int x2 =
            cx +
            50.0 * cosf(a);

          int y2 =
            cy +
            50.0 * sinf(a);

          it.line(
            x1,
            y1,
            x2,
            y2,
            Color(255, 170, 0)
          );
        }

        it.filled_circle(
          cx,
          cy,
          26,
          Color(255, 204, 0)
        );

        it.filled_circle(
          cx - 4,
          cy - 4,
          18,
          Color(255, 235, 100)
        );

        int cloud_x = 540;
        int cloud_y = 265;

        it.filled_circle(
          cloud_x - 65,
          cloud_y + 15,
          36,
          Color(120, 140, 175)
        );

        it.filled_circle(
          cloud_x - 15,
          cloud_y - 5,
          50,
          Color(160, 185, 215)
        );

        it.filled_circle(
          cloud_x + 45,
          cloud_y + 10,
          42,
          Color(120, 140, 175)
        );

        it.filled_circle(
          cloud_x + 15,
          cloud_y + 15,
          35,
          Color(200, 220, 240)
        );

        it.filled_rectangle(
          cloud_x - 70,
          cloud_y + 15,
          130,
          40,
          Color(160, 185, 215)
        );

        for (int i = 0; i < 85; i++) {

          int drop_x =
            70 +
            (i * 13 + i * 7) % 680;

          int speed =
            18 +
            (i % 7) * 5;

          int drop_y =
            (ms * speed / 28 + i * 27)
            % 230 + 200;

          Color drop_color =
            (i % 3 == 0)
              ? Color(56, 189, 248)
              : ((i % 3 == 1)
                  ? Color(125, 211, 252)
                  : Color(30, 144, 255));

          it.line(
            drop_x,
            drop_y,
            drop_x - 3,
            drop_y + 16,
            drop_color
          );
        }

        return;
      }

      // ==========================================================
      // STRONA 1 - GŁÓWNY DASHBOARD
      // ==========================================================

      it.fill(
        Color(7, 17, 30)
      );

      // Główna ramka
      it.rectangle(
        8, 8, 784, 464,
        Color(24, 47, 72)
      );

      // ==========================================================
      // GÓRNY PASEK
