    initial_value: "0.0"

  - id: pogoda_wiatr
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: pogoda_kod
    type: int
    restore_value: no
    initial_value: "-1"

  - id: pogoda_dane_ok
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pogoda_opis
    type: std::string
    restore_value: no
    initial_value: '"Brak danych"'

  - id: animacja
    type: int
    restore_value: no
    initial_value: "0"


ch422g:
  - id: ch422g_hub


i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz


http_request:
  timeout: 10s
  verify_ssl: true


sensor:

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_dbm
    update_interval: 10s


text_sensor:

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip


time:

  - platform: sntp
    id: czas
    timezone: Europe/Warsaw
    servers:
      - pl.pool.ntp.org


font:

  - file: "Roboto-Regular.ttf"
    id: font_duzy
    size: 36

  - file: "Roboto-Regular.ttf"
    id: font_sredni
    size: 22

  - file: "Roboto-Regular.ttf"
    id: font_maly
    size: 16

  - file: "Roboto-Regular.ttf"
    id: font_zegar
    size: 56


image:

  - file: "weather_partly_cloudy.png"
    id: ikona_pogoda_duza
    type: RGB565
    transparency: alpha_channel


script:

  - id: pobierz_pogode
    mode: restart
    then:

      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=54.60167&longitude=18.23833&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=kmh&timezone=Europe%2FWarsaw"

          capture_response: true
          max_response_buffer_size: 4096

          on_response:
            then:

              - if:
                  condition:
                    lambda: |-
                      return response->status_code == 200;

                  then:

                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {

                          if (!root["current"]) {
                            return false;
                          }

                          JsonObject current = root["current"];

                          id(pogoda_temperatura) =
                            current["temperature_2m"] | 0.0f;

                          id(pogoda_wilgotnosc) =
                            current["relative_humidity_2m"] | 0.0f;

                          id(pogoda_wiatr) =
                            current["wind_speed_10m"] | 0.0f;

                          id(pogoda_kod) =
                            current["weather_code"] | -1;

                          int kod = id(pogoda_kod);

                          if (kod == 0) {
                            id(pogoda_opis) = "Slonecznie";
                          }
                          else if (kod <= 3) {
                            id(pogoda_opis) = "Czesciowe zachmurzenie";
                          }
                          else if (kod == 45 || kod == 48) {
                            id(pogoda_opis) = "Mgla";
                          }
                          else if (kod <= 57) {
                            id(pogoda_opis) = "Mzy";
                          }
                          else if (kod <= 67) {
                            id(pogoda_opis) = "Deszcz";
                          }
                          else if (kod <= 77) {
                            id(pogoda_opis) = "Snieg";
                          }
                          else if (kod <= 82) {
                            id(pogoda_opis) = "Przelotny deszcz";
                          }
                          else if (kod <= 86) {
                            id(pogoda_opis) = "Przelotny snieg";
                          }
                          else if (kod >= 95) {
                            id(pogoda_opis) = "Burza";
                          }
                          else {
                            id(pogoda_opis) = "Pogoda";
                          }

                          id(pogoda_dane_ok) = true;

                          return true;
                        });

              - if:
                  condition:
                    lambda: |-
                      return response->status_code != 200;

                  then:

                    - lambda: |-
                        id(pogoda_dane_ok) = false;


interval:

  - interval: 150ms
    then:

      - lambda: |-
          id(animacja)++;

          if (id(animacja) >= 360) {
            id(animacja) = 0;
          }


  - interval: 10min
    then:

      - script.execute: pobierz_pogode


